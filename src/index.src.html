        <button type="button" class="wk-ink-color" data-color="#1f6fb2" style="--ink-color:#1f6fb2" onclick="wkInkColor(this,'#1f6fb2')" aria-label="藍色"></button>
        <button type="button" class="wk-ink-color" data-color="#2d7a4f" style="--ink-color:#2d7a4f" onclick="wkInkColor(this,'#2d7a4f')" aria-label="綠色"></button>
        <button type="button" class="wk-ink-color" data-color="#7c4da0" style="--ink-color:#7c4da0" onclick="wkInkColor(this,'#7c4da0')" aria-label="紫色"></button>

        <button type="button" class="wk-ink-size on" onclick="wkInkSetSize(3)">細</button>
        <button type="button" class="wk-ink-size" onclick="wkInkSetSize(5)">中</button>
        <button type="button" class="wk-ink-size" onclick="wkInkSetSize(8)">粗</button>
      </div>
    </div>
  </div>
  <div class="wkfs-footer">
    <button class="wkfs-nav" onclick="wkPrev()">←</button>
    <span id="wkfs-counter" style="color:var(--gold);font-family:'Noto Serif TC',serif;font-size:15px">─</span>
    <button class="wkfs-nav" onclick="wkNext()">→</button>
  </div>
