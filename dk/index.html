<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>段考檢討</title>
<!-- 段考檢討（2026-11-27 起，老師：「做成題目檢討 連到國文教學網裡面去」）。開法：dk/index.html?e=<卷代號>，例 ?e=115-1-2 → dk/exams/115-1-2.js
     ・題目、選項、題組文本照試卷原文（含原卷錯字，不改）；答案依出題老師重讀後公告；詳解另寫，每題逐項說明
     ・重點先藏：先看題、可以點選項當作「學生的選擇」→「揭曉」才標出正解 → 點選項才出那一項的解析（「全部解析」一次打開）
     ・色票、字級、圓角一律用 ../tokens.css；字體＝源流明體。iPad 11（1194×834）橫式為主、手機直式可用
     ・嵌在教學網站（src/js/199_v270-dk-entry-js.js）時，「✕ 回網站」送 lbClose 關掉
     鍵盤：← → 換題、空白鍵 揭曉、Enter 全部解析、Esc 題號表 -->
<link rel="stylesheet" href="../tokens.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:rgb(var(--rk-paper));color:var(--rk-ink);font-family:var(--rk-ming);font-size:calc(var(--rk-fs) * var(--zoom,1));line-height:1.75;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:root{--bd:.024em}
b,.qn,.ok-seal,.opt .k,.cell .n{-webkit-text-stroke:var(--bd) currentColor}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:.5em;padding:.35em .8em;font-size:calc(var(--rk-fs) * .62)}
header .rk-head-title{font-size:1.5em;white-space:nowrap;flex:none}
header .sub{color:var(--rk-leaf-flat);letter-spacing:.1em;opacity:.9;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative}
.sp{flex:1}
.rk .hbtn{border:1px solid color-mix(in srgb,var(--rk-leaf-flat) 45%,transparent);background:none;color:var(--rk-leaf-flat);border-radius:var(--rk-r);padding:.15em .8em;min-height:2.6em;font-weight:700;white-space:nowrap;position:relative}
.rk .hbtn.on{background:var(--rk-leaf-flat);color:var(--rk-jin-1)}
main{flex:1;min-height:0;position:relative}
footer{display:flex;align-items:center;justify-content:center;gap:1em;padding:.3em .8em calc(.3em + env(safe-area-inset-bottom,0px));font-size:calc(var(--rk-fs) * .62);background:var(--rk-night-bg)}
.rk footer button{border:1px solid color-mix(in srgb,var(--rk-leaf-flat) 45%,transparent);background:none;color:var(--rk-leaf-flat);border-radius:var(--rk-r);padding:0 1em;min-width:3em;min-height:2.6em;font-weight:700}
.rk footer button:disabled{opacity:.3}
footer .pg{color:var(--rk-leaf-flat);letter-spacing:.1em;min-width:6em;text-align:center}

/* ── 題號表 ── */
#home{position:absolute;inset:0;overflow:auto;padding:1em 1.4em 2em}
#home .top{display:flex;align-items:baseline;gap:1em;flex-wrap:wrap;margin-bottom:.4em}
#home .note{color:var(--rk-mute);font-size:.8em;margin:.2em 0 .8em}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.45em}
.cell{border:1.5px solid var(--rk-line);background:var(--rk-card);border-radius:var(--rk-r);padding:.25em 0 .15em;text-align:center;line-height:1.3;box-shadow:2px 3px 0 var(--rk-shadow);position:relative}
.cell .n{display:block;font-size:1.15em;font-weight:700}
.cell .a{display:block;font-size:.72em;color:var(--rk-key);font-weight:700;min-height:1.4em}
.cell.hideans .a{color:transparent}
.cell.flag{border-color:var(--rk-zhu)}
.cell.flag::after{content:attr(data-flag);position:absolute;top:-.55em;right:-.3em;font-size:.5em;background:var(--rk-seal);color:var(--rk-seal-ink);border-radius:var(--rk-r-s);padding:0 .35em;line-height:1.6}
.cell.seen{background:color-mix(in srgb,var(--rk-yi-bd) 14%,var(--rk-card))}
.grp{display:flex;gap:.6em;flex-wrap:wrap;margin:.9em 0 .3em;font-size:.72em;color:var(--rk-mute)}

/* ── 一題 ── */
#q{position:absolute;inset:0;display:flex;gap:1.2em;padding:.8em 1.2em}
#q[hidden],#home[hidden]{display:none}
#pass{flex:0 0 44%;overflow:auto;padding:.6em .9em;background:var(--rk-card);border:1px solid var(--rk-line);border-radius:var(--rk-r);box-shadow:3px 4px 0 var(--rk-shadow)}
#pass[hidden]{display:none}
#pass .lb{display:inline-block;background:var(--rk-seal);color:var(--rk-seal-ink);border-radius:var(--rk-r-seal);padding:0 .45em;font-weight:700;margin:.4em 0 .2em}
#pass p{margin:.2em 0;text-indent:2em;text-align:justify}
#pass .src{text-align:right;color:var(--rk-mute);font-size:.75em;text-indent:0}
#pass .nt{color:var(--rk-pi-nt);font-size:.75em;text-indent:0}
#pass .hl{background:color-mix(in srgb,var(--rk-leaf-flat) 45%,transparent);border-radius:var(--rk-r-s)}
#qa{flex:1;min-width:0;overflow:auto;padding:.2em .3em 2em}
.qhead{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.qn{font-size:var(--rk-t-l);font-weight:700;color:var(--rk-zhu-d)}
.ptag{font-size:.65em;color:var(--rk-mute);border:1px solid var(--rk-gold);border-radius:var(--rk-r-s);padding:0 .5em}
.stem{margin:.3em 0 .6em;white-space:pre-line;text-align:justify}
.opts{display:flex;flex-direction:column;gap:.45em}
.opts.img{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--rk-line);background:var(--rk-card);border-radius:var(--rk-r);padding:.3em 2.8em .3em 2.9em;position:relative;line-height:1.65;transition:opacity .3s,border-color .3s,background .3s}
.opt .k{position:absolute;left:.6em;top:.3em;font-weight:700;color:var(--rk-mute)}
.opt .sl{color:var(--rk-gold);margin:0 .35em}
.opt img{display:block;width:100%;max-width:9em;margin:.2em auto 0;background:#fff;border-radius:var(--rk-r-s)}
.opts.img .opt{padding:.3em .4em;text-align:center}
.opts.img .opt .k{position:static}
.opt.pick{border-color:var(--rk-hb);background:color-mix(in srgb,var(--rk-hb) 10%,var(--rk-card))}
.opt.pick .k{color:var(--rk-hb)}
.rev .opt{opacity:.62}
.rev .opt.ok,.rev .opt.open{opacity:1}
.rev .opt.ok{border-color:var(--rk-ok);background:color-mix(in srgb,var(--rk-ok) 13%,var(--rk-card))}
.rev .opt.ok .k{color:var(--rk-ok)}
.ok-seal{display:none;position:absolute;right:.5em;top:.35em;font-size:.6em;background:var(--rk-ok);color:var(--rk-seal-ink);border-radius:var(--rk-r-seal);padding:0 .5em;letter-spacing:.1em;animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
.rev .opt.ok .ok-seal{display:block}
.rev .opt.pick:not(.ok){border-color:var(--rk-no)}
.ex{display:none;margin:.25em 0 .1em;font-size:.88em}
.opt.open .ex{display:block;animation:fade .3s}
.ex .rk-yi{display:block;padding:.15em .7em;margin:.15em 0}
.gen{display:none;margin:.2em 0 .6em}
.rev .gen.on{display:block;animation:fade .3s}
.gen .rk-yi{display:block;padding:.2em .8em;margin:.2em 0;font-size:.88em}
.verdict{display:none;font-weight:700;color:var(--rk-ok);margin-left:.2em}
.rev .verdict{display:inline-block;animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
.acts{display:flex;gap:.6em;margin:.8em 0 0;flex-wrap:wrap}
.acts .rk-btn{min-height:2.4em}
.hint{color:var(--rk-mute);font-size:.62em;margin-top:.6em}
@keyframes stamp{from{transform:scale(1.8) rotate(-8deg);opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(-.2em)}}
@media (prefers-reduced-motion:reduce){.ok-seal,.verdict,.ex,.gen{animation:none}}
@media (max-width:760px){
  #q{flex-direction:column;overflow:auto;padding:.6em .7em}
  #pass{flex:none;max-height:none} #qa{overflow:visible}
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .opts.img{grid-template-columns:repeat(2,minmax(0,1fr))}
  header .sub{display:none}
}
</style>
</head>
<body class="rk">
<div id="app">
  <header class="rk-head">
    <span class="rk-head-title">段考檢討</span>
    <span class="sub" id="sub"></span>
    <span class="sp"></span>
    <button class="hbtn" id="bHome" title="題號表（Esc）">題號表</button>
    <button class="hbtn" id="bSm" title="字小一點">A−</button>
    <button class="hbtn" id="bLg" title="字大一點">A+</button>
    <button class="hbtn" id="bNight" title="夜間">🌙</button>
    <button class="hbtn" id="bClose" hidden>✕ 回網站</button>
  </header>
  <main>
    <section id="home"></section>
    <section id="q" hidden>
      <div id="pass"></div>
      <div id="qa"></div>
    </section>
  </main>
  <footer>
    <button id="bPrev" title="上一題（←）">◀ 上一題</button>
    <span class="pg" id="pg"></span>
    <button id="bNext" title="下一題（→）">下一題 ▶</button>
  </footer>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const EXAM = (new URLSearchParams(location.search).get('e') || '115-1-2').replace(/[^\w-]/g, '');
let D = null, cur = -1, seen = new Set(), showAns = false;

function load() {
  const s = document.createElement('script');
  s.src = 'exams/' + EXAM + '.js';
  s.onload = () => { D = window.DK_EXAM; init(); };
  s.onerror = () => { $('#home').innerHTML = '<p>找不到這份考卷：' + esc(EXAM) + '</p>'; };
  document.head.appendChild(s);
}
const letters = a => (a.match(/[A-D]/g) || []);
const flagOf = q => q.ans === '送分' ? '送分' : (letters(q.ans).length > 1 ? '皆給分' : (q.changed ? '更正' : ''));

function init() {
  $('#sub').textContent = D.title + '｜' + D.scope;
  document.title = '段考檢討｜' + D.title;
  renderHome();
  const h = parseInt(location.hash.slice(1), 10);
  if (h >= 1 && h <= D.qs.length) go(h - 1); else home();
}

function renderHome() {
  const g = D.qs.map((q, i) => {
    const f = flagOf(q);
    return '<button class="cell' + (showAns ? '' : ' hideans') + (f ? ' flag' : '') + (seen.has(i) ? ' seen' : '') + '"' + (f ? ' data-flag="' + f + '"' : '') + ' data-i="' + i + '"><span class="n">' + q.n + '</span><span class="a">' + esc(q.ans) + '</span></button>';
  }).join('');
  const grp = D.passages.map(p => '<span>題組 ' + p.qs[0] + (p.qs.length > 1 ? '–' + p.qs[p.qs.length - 1] : '') + '：' + esc(p.parts.map(x => x.src.replace(/^(節錄自|改寫自)/, '')).join('／')) + '</span>').join('');
  $('#home').innerHTML = '<div class="top"><h2 class="rk-h">' + esc(D.title) + '　全 ' + D.qs.length + ' 題</h2>' +
    '<button class="rk-btn" id="bAns">' + (showAns ? '藏起答案' : '顯示答案') + '</button></div>' +
    '<div class="note">' + esc(D.notice) + '</div><div class="grid">' + g + '</div><div class="grp">' + grp + '</div>';
  $('#home').querySelectorAll('.cell').forEach(b => b.onclick = () => go(+b.dataset.i));
  $('#bAns').onclick = () => { showAns = !showAns; renderHome(); };
}

function home() {
  cur = -1; renderHome();
  $('#home').hidden = false; $('#q').hidden = true; $('#bHome').classList.add('on');
  $('#pg').textContent = '題號表'; $('#bPrev').disabled = true; $('#bNext').disabled = false;
  history.replaceState(null, '', location.pathname + location.search);
}

function optHtml(t) { return esc(t).replace(/ \/ ?/g, '<span class="sl">／</span>'); }

function go(i) {
  if (!D || i < 0 || i >= D.qs.length) return;
  cur = i; seen.add(i);
  const q = D.qs[i], ok = letters(q.ans);
  $('#home').hidden = true; $('#q').hidden = false; $('#bHome').classList.remove('on');
  $('#pg').textContent = q.n + ' ／ ' + D.qs.length;
  $('#bPrev').disabled = false; $('#bNext').disabled = i === D.qs.length - 1;
  history.replaceState(null, '', '#' + q.n);
  // 題組文本
  const P = q.p != null ? D.passages[q.p] : null, pass = $('#pass');
  if (P) {
    pass.hidden = false;
    pass.innerHTML = P.parts.map(x => (x.label ? '<span class="lb">' + x.label + '</span>' : '') +
      x.paras.map(t => '<p>' + esc(t) + '</p>').join('') +
      (x.note ? '<p class="nt">註：' + esc(x.note) + '</p>' : '') +
      '<p class="src">（' + esc(x.src) + '）</p>').join('');
    if (pass.dataset.p !== String(q.p)) pass.scrollTop = 0;
    pass.dataset.p = q.p;
  } else { pass.hidden = true; pass.dataset.p = ''; }
  // 解析：開頭是（A）（B）…的歸到那幾個選項，其餘是總說
  const per = {}, gen = [];
  q.exp.forEach(t => {
    const m = t.match(/^((?:（[A-D]）)+)/);
    if (m) letters(m[1]).forEach(k => (per[k] = per[k] || []).push(t.slice(m[1].length)));
    else gen.push(t);
  });
  const ptag = P ? '<span class="ptag">題組 ' + P.qs[0] + '–' + P.qs[P.qs.length - 1] + '</span>' : '';
  const opts = q.opts.map(([k, t]) => '<button class="opt' + (ok.includes(k) ? ' ok' : '') + '" data-k="' + k + '"><span class="k">（' + k + '）</span>' +
    (q.img ? '<img src="img/' + EXAM + '_q' + q.n + '_' + k + '.jpg" alt="選項 ' + k + ' 位置圖">' : optHtml(t)) +
    '<span class="ok-seal">正解</span>' +
    '<span class="ex">' + (per[k] || []).map(s => '<span class="rk-yi">' + esc(s) + '</span>').join('') + '</span></button>').join('');
  $('#qa').innerHTML = '<div class="qhead"><span class="qn">' + q.n + '.</span>' + ptag + '<span class="verdict">答案：' + esc(q.ans) + (flagOf(q) && q.ans !== '送分' ? '（' + flagOf(q) + '）' : '') + '</span></div>' +
    '<div class="stem">' + esc(q.stem) + '</div>' +
    '<div class="gen' + (gen.length ? '' : ' none') + '">' + gen.map(s => '<span class="rk-yi">' + esc(s) + '</span>').join('') + '</div>' +
    '<div class="opts' + (q.img ? ' img' : '') + '">' + opts + '</div>' +
    '<div class="acts"><button class="rk-btn pri" id="bRev">揭曉答案</button><button class="rk-btn" id="bAll" disabled>全部解析</button></div>' +
    '<div class="hint">先點選項＝標出大家選哪個；揭曉後點選項＝看那一項的解析。鍵盤：← → 換題、空白鍵 揭曉、Enter 全部解析</div>';
  $('#qa').scrollTop = 0;
  $('#qa').querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if ($('#qa').classList.contains('rev')) b.classList.toggle('open');
    else b.classList.toggle('pick');
  });
  $('#qa').classList.remove('rev');
  $('#bRev').onclick = reveal; $('#bAll').onclick = all;
}
function reveal() {
  const qa = $('#qa'); if (cur < 0) return;
  if (qa.classList.contains('rev')) { qa.classList.remove('rev'); qa.querySelectorAll('.opt').forEach(o => o.classList.remove('open'));
    $('#bRev').textContent = '揭曉答案'; $('#bAll').disabled = true; return; }
  qa.classList.add('rev'); $('#bRev').textContent = '收回'; $('#bAll').disabled = false;
  const g = qa.querySelector('.gen'); if (!g.classList.contains('none')) g.classList.add('on');
}
function all() {
  const qa = $('#qa'); if (cur < 0) return;
  if (!qa.classList.contains('rev')) reveal();
  const os = [...qa.querySelectorAll('.opt')], open = os.every(o => o.classList.contains('open'));
  os.forEach(o => o.classList.toggle('open', !open));
}

$('#bPrev').onclick = () => cur <= 0 ? home() : go(cur - 1);
$('#bNext').onclick = () => go(cur + 1);
$('#bHome').onclick = home;
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); cur <= 0 ? home() : go(cur - 1); }
  else if (e.key === ' ' && cur >= 0) { e.preventDefault(); reveal(); }
  else if (e.key === 'Enter' && cur >= 0) { e.preventDefault(); all(); }
  else if (e.key === 'Escape') home();
});
// 左右滑動換題（手機、平板）
let sx = null, sy = 0;
$('main').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$('main').addEventListener('touchend', e => {
  if (sx == null || cur < 0) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2) dx < 0 ? go(cur + 1) : (cur <= 0 ? home() : go(cur - 1));
});

// 字級、夜間
let zoom = 1; try { zoom = +localStorage.getItem('dk_zoom') || 1; } catch (e) {}
const setZoom = z => { zoom = Math.max(.7, Math.min(1.5, Math.round(z * 100) / 100)); document.documentElement.style.setProperty('--zoom', zoom); try { localStorage.setItem('dk_zoom', zoom); } catch (e) {} };
$('#bSm').onclick = () => setZoom(zoom - .1); $('#bLg').onclick = () => setZoom(zoom + .1);
setZoom(zoom);
$('#bNight').onclick = e => e.currentTarget.classList.toggle('on', document.body.classList.toggle('night'));
try { if (window.parent !== window && window.parent.document.body.classList.contains('dark-mode')) { document.body.classList.add('night'); $('#bNight').classList.add('on'); } } catch (e) {}
// 嵌在網站裡：顯示「✕ 回網站」
if (window.parent !== window) { const b = $('#bClose'); b.hidden = false; b.onclick = () => { window.parent.postMessage({ lbClose: 1 }, '*'); if (window.top !== window.parent) window.top.postMessage({ lbClose: 1 }, '*'); }; }
load();
</script>
</body>
</html>
