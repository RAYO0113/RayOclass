<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>小老師語音登分</title>
<!-- 瑞媛國文　小老師語音登分（10/25 老師）。正本：教學系統 app/成績系統/src/tutor_voice.html → 複製到 RayOclass/tv/index.html。
     原本的小老師頁（Apps Script ?page=tutor）外框不給麥克風，所以語音登分放 GitHub。
     登入：學校帳號 → 成績系統「學校帳號部署」?page=auth 發通行證（同學生網頁）→ 回到本頁 #t=通行證（立刻從網址列清掉，存 localStorage tv_t_v1）。
     資料：帳密部署 tWho／tLoad／tPut＋通行證 t（後台 gr-18：學生要在小老師表裡；老師帳號＝老師）。只做「念分數」，訂正加分、遲交、請假、新增考卷、檢查照舊用原本的小老師頁。
     網頁內沒有任何學生資料；名單、分數都從後台讀。 -->
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#3b2f25;--mut:#8a7a6a;--line:#e6dccd;--pri:#a0522d;--pri2:#f3e6d8;--ok:#2e7d4f;--okbg:#e5f3ea;--late:#b3261e;--latebg:#fde8e6;--hl:#fff3c4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top b{font-size:17px}
.top .sp{flex:1}
.top button{background:rgba(255,255,255,.18);border:0;border-radius:8px;padding:5px 10px;color:#fff;font-size:14px}
.top select{border:0;border-radius:8px;padding:4px 6px;background:#fff;color:var(--pri);font-weight:700;font-size:15px}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 10px}
h2{font-size:18px;margin:4px 0 8px}
.mut{color:var(--mut);font-size:14px}
.err{color:var(--late)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.stop{background:var(--late);border-color:var(--late);color:#fff}
.btn.big{width:100%;padding:14px;font-size:18px;margin:6px 0}
.btn:disabled{opacity:.4;cursor:default}
.inp{width:100%;font-size:18px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.it{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.it .t{font-weight:700}
.it small{display:block;color:var(--mut)}
.tag{display:inline-block;font-size:13px;border-radius:6px;padding:0 6px;margin-right:6px;background:var(--pri2);color:var(--pri)}
.say{font-size:28px;line-height:1.4;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;min-height:64px;text-align:center}
.say b{font-size:44px;color:var(--pri)}
.say small{display:block;font-size:16px}
.say.bad{border-color:var(--late);color:var(--late);font-size:20px}
.say.ok{border-color:var(--ok)}
.mid{min-height:20px;font-size:14px;color:var(--mut);text-align:center}
.vrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vrow .sp{flex:1}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
th{font-size:13px;color:var(--mut);font-weight:400}
td{font-size:17px}
tr.new td{background:var(--hl);font-weight:700}
.x{border:0;background:transparent;color:var(--mut);font-size:18px;padding:0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:6px 0}
.seat{border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px 2px;text-align:center;font-size:13px;line-height:1.3}
.seat b{display:block;font-size:17px}
.seat.done{background:var(--okbg);border-color:var(--ok)}
.seat.wait{background:var(--hl);border-color:#e0a43a}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#3b2f25;color:#fff;padding:8px 16px;border-radius:999px;z-index:30;font-size:15px;max-width:92vw}
.toast.err{background:var(--late)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:6}
.bar .sp{flex:1}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="mut">讀取中…</p></div></div>
<script>
(function () {
  'use strict';
  /* ── 設定（同 stu115 新班級網頁） ── */
  var CFG = {
    api: 'https://script.google.com/macros/s/AKfycbxfJoT1iS5tIzXtShetthjspMQ-yUwgUkiPfWc2nBEDNwYgs49u87eKvAJo5x73k7K1/exec',            /* 帳密部署（任何人）：資料 */
    auth: 'https://script.google.com/a/macros/mail2.ccvs.kh.edu.tw/s/AKfycbyW9KydiQ5kg8Mo7-JpBEHZVmmVg5Sgcor7nBO12lWU7zSBVQtle8bwEsdIK3VO2KsG/exec'   /* 學校帳號部署：登入 */
  };
  var TK = 'tv_t_v1', AC = 'tv_acct_v1', DOM = '@mail2.ccvs.kh.edu.tw', MAX = 100;   /* 語音只收 100 以內（後台可到 200；手打照舊用原本小老師頁） */
  var TYPE_NAME = { '註釋小考': '小考', 'A卷': 'A卷', '習作': '習作', '筆記': '課本筆記', '回家考卷': '其它' };
  var S = { me: null, d: null, cls: '', item: '', list: [], last: null, heard: '', saving: false, err: '' };
  var VO = { rec: null, on: false, want: false };

  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function md(s) { if (!s) return ''; var a = String(s).split('-'); return (+a[1]) + '/' + (+a[2]); }
  function $(s) { return document.querySelector(s); }
  function toast(t, err) { var o = document.createElement('div'); o.className = 'toast' + (err ? ' err' : ''); o.textContent = t; document.body.appendChild(o); setTimeout(function () { o.remove(); }, err ? 4500 : 2000); }

  /* ── 通行證：#t= 收下就從網址列清掉 ── */
  function takeHash() {
    var hm = /[#&]t=([\w.-]+)/.exec(location.hash);
    if (hm) { lsSet(TK, hm[1]); history.replaceState(null, '', location.pathname + location.search); }
    return !!hm;
  }
  function api(req) {
    req.t = lsGet(TK);
    if (S.me && S.me.all && !('cls' in req)) req.cls = S.cls;   /* 老師／測試帳號：目前選的班 */
    return fetch(CFG.api, { method: 'POST', body: JSON.stringify(req), redirect: 'follow' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (r) { if (r && r.auth === false) { lsSet(TK, ''); S.me = null; S.err = '登入過期或不是小老師，請重新登入'; render(); throw new Error('auth'); } return r; });
  }

  /* ── 語音解析（同老師端 grade.js voNorm／voParse） ── */
  var CN_D = { '零': 0, '〇': 0, '一': 1, '壹': 1, '二': 2, '兩': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
  function cnNum(s) {
    var i, n = 0, cur = 0, seen = false;
    if (!/[十百]/.test(s)) { var t = ''; for (i = 0; i < s.length; i++) { if (!(s[i] in CN_D)) return null; t += CN_D[s[i]]; } return t ? +t : null; }
    for (i = 0; i < s.length; i++) {
      var ch = s[i];
      if (ch in CN_D) { cur = CN_D[ch]; seen = true; }
      else if (ch === '十' || ch === '百') { n += (seen ? cur : 1) * (ch === '十' ? 10 : 100); cur = 0; seen = false; }
      else return null;
    }
    return n + cur;
  }
  function voNorm(txt) {
    var s = String(txt || '').replace(/[０-９]/g, function (d) { return String.fromCharCode(d.charCodeAt(0) - 0xFEE0); }).replace(/\s+/g, '').replace(/号/g, '號');
    s = s.replace(/[零〇一壹二兩两三四五六七八九十百]+/g, function (m) { var n = cnNum(m); return n == null ? m : String(n); });
    return s.replace(/(\d)[點点．](\d)/g, '$1.$2');
  }
  function voParse(txt) {
    var s = voNorm(txt), out = [], re = /(\d+)號(\d+(?:\.\d+)?)分?/g, m;
    while ((m = re.exec(s))) out.push({ seat: +m[1], v: +m[2] });
    return out;
  }

  /* ── 資料 ── */
  function itemOf(id) { return (S.d ? S.d.items : []).filter(function (i) { return i.id === id; })[0] || null; }
  function scOf(item, seat) { return (S.d ? S.d.scores : []).filter(function (o) { return o.item === item && o.seat === seat; })[0] || null; }
  function itemName(it) { return it.title || TYPE_NAME[it.type] || it.type; }
  function load(cb) {
    api({ action: 'tLoad', mode: 'reg' }).then(function (r) {
      if (!r.ok) throw new Error(r.error || '讀取失敗');
      S.d = r; S.me = r.me; if (r.me.all && !S.cls) S.cls = r.me.cls;
      if (S.item && !itemOf(S.item)) S.item = '';
      if (cb) cb(); render();
    }).catch(function (e) { if (e.message !== 'auth') toast('讀取失敗：' + e.message, true); });
  }

  /* ── 語音 ── */
  function add(seat, v) {
    var it = itemOf(S.item), st = S.d.roster.filter(function (x) { return x.seat === seat; })[0];
    if (!st) { S.last = { bad: seat + ' 號不在名單裡，沒有記' }; return; }
    if (!(v >= 0 && v <= MAX)) { S.last = { bad: seat + ' 號 ' + st.name + '：' + v + ' 分超過 ' + MAX + '，沒有記' }; return; }
    if (Math.round(v * 10) !== v * 10) { S.last = { bad: seat + ' 號 ' + st.name + '：' + v + ' 只能到小數一位，沒有記' }; return; }
    var sc = scOf(it.id, seat), old = sc && sc.raw !== '' ? sc.raw : '';   /* '✓'＝以前登過、小老師看不到分數 */
    var dup = S.list.filter(function (x) { return x.seat === seat; })[0];
    S.list = S.list.filter(function (x) { return x.seat !== seat; });
    S.list.push({ seat: seat, name: st.name, v: v, old: old });
    S.last = { seat: seat, name: st.name, v: v, old: old, dup: dup ? dup.v : null };
  }
  function heard(txt) {
    if (!S.item) return;
    S.heard = txt;
    var ps = voParse(txt);
    if (ps.length) ps.forEach(function (p) { add(p.seat, p.v); });
    else if (/更正|取消|上一筆|刪掉|刪除/.test(txt)) undo();
    else S.last = { bad: '沒有聽出「幾號幾分」' };
    paint();
  }
  function undo() { var x = S.list.pop(); S.last = x ? { info: '已取消：' + x.seat + ' 號 ' + x.name + ' ' + x.v + ' 分' } : { info: '清單是空的' }; paint(); }
  function start() {
    var R = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!R) { alert('這個瀏覽器不支援語音辨識，請改用 Chrome，或 iPhone／iPad 的 Safari。'); return; }
    if (!VO.rec) {
      var r = VO.rec = new R();
      r.lang = 'zh-TW'; r.continuous = true; r.interimResults = true;
      r.onresult = function (e) {
        var fin = '', mid = '';
        for (var i = e.resultIndex; i < e.results.length; i++) { var t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t; else mid += t; }
        var m = $('#mid'); if (m) m.textContent = mid ? '聽到：' + mid : '';
        if (fin) heard(fin);
      };
      r.onerror = function (e) {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { VO.want = false; alert('沒有麥克風權限：請在網址列左邊（或 Safari 的「aA」）允許這個網頁使用麥克風。'); }
        else if (e.error === 'network') { VO.want = false; alert('語音辨識要連網路，目前連不上。'); }
        paint();
      };
      r.onend = function () { VO.on = false; if (VO.want && S.item) { try { r.start(); VO.on = true; } catch (x) {} } paint(); };
    }
    VO.want = true; try { VO.rec.start(); VO.on = true; } catch (x) {}
    paint();
  }
  function stop() { VO.want = false; if (VO.rec && VO.on) { try { VO.rec.stop(); } catch (x) {} } VO.on = false; }
  function save() {
    var it = itemOf(S.item), L = S.list.slice(); if (!it || !L.length || S.saving) return;
    var ow = L.filter(function (x) { return x.old !== '' && String(x.old) !== String(x.v); });
    if (ow.length && !confirm('這 ' + ow.length + ' 位以前已經登記過，寫入會蓋掉原本的分數：\n' +
      ow.map(function (x) { return x.seat + ' 號 ' + x.name + '：' + (x.old === '✓' ? '（看不到原分數）' : x.old) + ' → ' + x.v; }).join('\n') + '\n\n確定全部寫入？')) return;
    stop(); S.saving = true; paint();
    api({ action: 'tPut', item: it.id, mode: 'reg', rows: L.map(function (x) { return { seat: x.seat, raw: String(x.v) }; }) }).then(function (r) {
      S.saving = false;
      if (!r.ok) { toast(r.error || '儲存失敗', true); paint(); return; }
      S.list = []; S.last = { saved: L.length }; toast('✓ 已寫入 ' + L.length + ' 筆');
      load();
    }).catch(function (e) { S.saving = false; if (e.message !== 'auth') { toast('沒存到（' + e.message + '），清單還在，網路恢復後再按一次「全部寫入」', true); paint(); } });
  }

  /* ── 畫面 ── */
  function loginHTML() {
    return '<div class="top"><b>小老師語音登分</b></div><div class="wrap"><div class="card"><h2>用學校帳號登入</h2>' +
      (S.err ? '<p class="err">' + esc(S.err) + '</p>' : '') +
      '<p class="mut">打你的學號，按「登入」後選學校帳號（學號' + DOM + '）。只有小老師登得進來。</p>' +
      '<input class="inp" id="acct" inputmode="text" autocapitalize="off" autocomplete="username" placeholder="學號" value="' + esc(lsGet(AC)) + '">' +
      '<button class="btn pri big" data-a="login">登入</button></div></div>';
  }
  function topHTML() {
    var me = S.me;
    return '<div class="top">' + (me.all ? '<b>' + (me.teacher ? '老師' : '測試帳號') + '</b><select data-a="cls">' + (me.classes || []).map(function (c) { return '<option' + (c === S.cls ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>'
      : '<b>' + esc(me.cls) + ' ' + me.seat + '號 ' + esc(me.name) + '</b>') +
      '<span class="sp"></span><button data-a="reload">⟳</button><button data-a="logout">登出</button></div>';
  }
  function homeHTML() {
    var its = S.d.items.slice().sort(function (a, b) { var x = a.issued || a.due || '', y = b.issued || b.due || ''; return x === y ? 0 : (x < y ? 1 : -1); });
    var h = '<h2>選一份要念分數的考卷</h2>';
    if (!its.length) h += '<p class="mut">還沒有考卷。請先在原本的小老師頁新增。</p>';
    its.forEach(function (it) {
      var got = S.d.roster.filter(function (x) { var o = scOf(it.id, x.seat); return o && o.raw !== ''; }).length;
      h += '<button class="it" data-a="item|' + esc(it.id) + '"><span class="tag">' + esc(TYPE_NAME[it.type] || it.type) + '</span><span class="t">' + esc(itemName(it)) + '</span>' +
        '<small>' + ((it.issued || it.due) ? md(it.issued || it.due) + '　' : '') + '有分數 ' + got + '/' + S.d.roster.length + '</small></button>';
    });
    return h + '<p class="mut">訂正加分、遲交、請假、新增考卷、檢查，請用原本的小老師頁。</p>';
  }
  function bigHTML() {
    var x = S.last;
    if (S.saving) return '<div class="say">儲存中…</div>';
    if (!x) return '<div class="say"><span class="mut">' + (VO.on ? '請開始說，例如「5 號 14 分」' : '按「🎤 開始聽」') + '</span></div>';
    if (x.saved) return '<div class="say ok">✓ 已寫入 ' + x.saved + ' 筆</div>';
    if (x.bad) return '<div class="say bad">' + esc(x.bad) + '</div>';
    if (x.info) return '<div class="say"><span class="mut">' + esc(x.info) + '</span></div>';
    return '<div class="say"><b>' + x.seat + '</b> 號 ' + esc(x.name) + '　<b>' + x.v + '</b> 分' +
      (x.dup != null ? '<small>（剛才念 ' + x.dup + '，改成這個）</small>' : '') +
      (x.old !== '' && String(x.old) !== String(x.v) ? '<small class="err">（以前登過' + (x.old === '✓' ? '' : ' ' + esc(x.old) + ' 分') + '，寫入會蓋掉）</small>' : '') + '</div>';
  }
  function voiceHTML() {
    var L = S.list;
    var h = '<div class="card" id="vo"><div class="vrow"><button class="btn big ' + (VO.on ? 'stop' : 'pri') + '" data-a="go">' + (VO.on ? '⏹ 停止聽' : '🎤 開始聽') + '</button></div>' +
      '<p class="mut" style="margin:4px 0 0;text-align:center">說「5 號 14 分」，可以連著說；說「更正」取消上一筆</p>' + bigHTML() +
      '<div class="mid" id="mid"></div>' + (S.heard ? '<p class="mut" style="margin:2px 0">最後聽到的原文：' + esc(S.heard) + '</p>' : '');
    if (L.length) h += '<table><thead><tr><th>座號</th><th>姓名</th><th>分數</th><th>以前</th><th></th></tr></thead><tbody>' +
      L.slice().reverse().map(function (y, i) { return '<tr' + (i === 0 ? ' class="new"' : '') + '><td>' + y.seat + '</td><td>' + esc(y.name) + '</td><td><b>' + y.v + '</b></td><td>' +
        (y.old === '' ? '' : '<span class="err">' + (y.old === '✓' ? '登過' : esc(y.old)) + '</span>') + '</td><td><button class="x" data-a="del|' + y.seat + '">✕</button></td></tr>'; }).join('') + '</tbody></table>';
    h += '<div class="vrow"><button class="btn" data-a="undo"' + (L.length ? '' : ' disabled') + '>↶ 上一筆取消</button><button class="btn" data-a="clr"' + (L.length ? '' : ' disabled') + '>清空</button>' +
      '<span class="sp"></span><button class="btn pri" data-a="save"' + (L.length && !S.saving ? '' : ' disabled') + '>全部寫入（' + L.length + ' 筆）</button></div></div>';
    return h;
  }
  function seatsHTML(it) {
    var wait = {}; S.list.forEach(function (x) { wait[x.seat] = 1; });
    return '<h2 style="margin-top:14px">全班</h2><div class="grid">' + S.d.roster.map(function (x) {
      var o = scOf(it.id, x.seat), has = o && o.raw !== '';
      return '<div class="seat' + (wait[x.seat] ? ' wait' : has ? ' done' : '') + '"><b>' + x.seat + '</b>' + (wait[x.seat] ? '待寫入' : has ? (o.raw === '✓' ? '已登' : esc(o.raw) + ' 分') : '—') + '</div>';
    }).join('') + '</div><p class="mut">綠＝已有分數、黃＝在清單裡還沒寫入。</p>';
  }
  function itemHTML(it) {
    return '<button class="btn" data-a="home">← 回列表</button><h2 style="margin-top:10px"><span class="tag">' + esc(TYPE_NAME[it.type] || it.type) + '</span>' + esc(itemName(it)) + '</h2>' +
      voiceHTML() + seatsHTML(it);
  }
  function render() {
    var app = $('#app');
    if (!S.me) { app.innerHTML = loginHTML(); return; }
    var h = topHTML() + '<div class="wrap">';
    if (!S.d) h += '<p class="mut">讀取中…</p>';
    else if (S.item && itemOf(S.item)) h += itemHTML(itemOf(S.item));
    else h += homeHTML();
    app.innerHTML = h + '</div>';
  }
  function paint() {   /* 只重畫語音區和座位格，不動捲動位置 */
    var it = itemOf(S.item), vo = $('#vo'); if (!it || !vo) { render(); return; }
    var y = window.scrollY; render(); window.scrollTo(0, y);
  }
  function leaveOk() { return !S.list.length || confirm('還有 ' + S.list.length + ' 筆沒寫入，離開就會丟掉，確定？'); }

  /* ── 事件 ── */
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-a]') : null; if (!t || t.tagName === 'SELECT') return;
    var p = t.getAttribute('data-a').split('|'), a = p[0];
    if (a === 'login') {
      var id = ($('#acct').value || '').trim().toLowerCase().replace(/\s+/g, ''); if (id.indexOf('@') >= 0) id = id.split('@')[0];
      if (!id) { toast('請先打學號', true); return; }
      lsSet(AC, id);
      location.href = 'https://accounts.google.com/AccountChooser?Email=' + encodeURIComponent(id + DOM) + '&continue=' + encodeURIComponent(CFG.auth + '?page=auth&ret=' + encodeURIComponent(location.origin + location.pathname));
    }
    else if (a === 'logout') { if (!leaveOk() || !confirm('登出後要重新用學校帳號登入，確定？')) return; stop(); lsSet(TK, ''); S.me = null; S.d = null; S.item = ''; S.list = []; S.err = ''; render(); }
    else if (a === 'reload') load();
    else if (a === 'home') { if (!leaveOk()) return; stop(); S.item = ''; S.list = []; S.last = null; S.heard = ''; render(); window.scrollTo(0, 0); load(); }
    else if (a === 'item') { S.item = p[1]; S.list = []; S.last = null; S.heard = ''; render(); window.scrollTo(0, 0); }
    else if (a === 'go') { if (VO.on) { stop(); paint(); } else start(); }
    else if (a === 'undo') undo();
    else if (a === 'del') { S.list = S.list.filter(function (x) { return x.seat !== +p[1]; }); paint(); }
    else if (a === 'clr') { if (confirm('清空清單裡的 ' + S.list.length + ' 筆？')) { S.list = []; S.last = null; paint(); } }
    else if (a === 'save') save();
  });
  document.addEventListener('change', function (e) {
    if (e.target.getAttribute('data-a') !== 'cls') return;
    if (!leaveOk()) { e.target.value = S.cls; return; }
    stop(); S.cls = e.target.value; S.item = ''; S.list = []; S.d = null; render(); load();
  });
  document.addEventListener('keydown', function (e) { if (e.target.id === 'acct' && e.key === 'Enter') { var b = $('[data-a="login"]'); if (b) b.click(); } });
  window.addEventListener('beforeunload', function (e) { if (S.list.length) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('hashchange', function () { if (takeHash()) init(); });

  function init() {
    takeHash();
    if (!lsGet(TK)) { S.me = null; render(); return; }
    api({ action: 'tWho' }).then(function (r) {
      if (!r.me) { lsSet(TK, ''); S.me = null; S.err = '登入已過期，或這個學校帳號不在小老師名單裡。'; render(); return; }
      S.me = r.me; if (r.me.all) S.cls = r.me.cls; render(); load();
    }).catch(function (e) { if (e.message !== 'auth') $('#app').innerHTML = '<div class="wrap"><p class="err">連不上（' + esc(e.message) + '），請檢查網路後重新整理。</p></div>'; });
  }
  window.TV = { voParse: voParse, heard: heard };   /* 測試用：模擬「聽到」一句話 */
  init();
})();
</script>
</body>
</html>
