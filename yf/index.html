<title>樂府長卷</title>
<!-- V251（2026-11-13 老師：不要只是加點圖，要大破大立，做成更優秀的互動網頁；不要標楷體）
     〈長干行〉樂府詩文體的互動版「樂府長卷」：一個時代一幅徽宗工筆畫（img/ui/bg），重點字先藏、按了才揭曉，
     點作品名進讀詩模式（一段一段聚焦、點段落看翻譯），最後「樂府還是古詩？」分類挑戰。
     內容不另抄：全部執行時讀 data/lessons/30.js 的 extras.intro（樂府詩·名稱／特色／發展／新樂府／新樂府作品／影響／與古詩、代表作·○○），
     課檔改了這裡自動跟著變。字體＝源流明體；讀詩可切「書法」（這台電腦有華康歐陽詢體才出現，商業字型不能放上網站）。
     從網站開（188 的 l7-anim 蓋版）時右上有「✕ 回課文」。iPad 11（1194×834）為主、手機直式可用。
     V253（2026-11-16 老師：整個樂府詩講解也照變形記美化，把補充講義的空格融合進來讓學生方便填空；範圍＝常識＋作者題解）
     - 前面加「作者」「題解」「簡介」三段（讀 30.js 的 extras.authorPages、intro〈題解·課本〉，一樣不另抄）
     - 翰林技高國文(1)補充講義 L7 P.77～78 的 9 個空格（HB）：講到那個詞時是藍色、有編號的空格，點了揭曉並提示填進講義；
       每一節講完有一頁「講義填空」（FILL，句子照講義原文、順序照講義），給沒跟上的學生補抄
     - ⟲ 這一頁重來；網址 #頁碼 改了會跟著跳
     V253 續（同日老師：作者、題解、詩的流變、樂府詩、樂府詩代表作＋補充講義全部整合起來；寫講稿；補統測／學測考點）
     - 一條路線：封面 → 作者 → 題解 → 流變（變形記 lb/ 蓋版開、總表、常識）→ 樂府詩（簡介／名稱／特色／發展／新樂府／影響／比較）→ 代表作（點了讀詩）→ 考點 → 挑戰
     - 考點：yf/exams.js（歷屆試題照來源教材原文，每題註明出處）＋課檔 extras.exams；相關的講解頁右上有「考點 ▸」可跳過去再跳回來
     - 講稿：yf/script.js（Claude 草擬、老師可改），右上「講稿」或按 N 開關，預設不顯示 -->

@font-face{font-family:"RayGenRyuRead";src:url("../fonts/genryumin-read-r.woff2") format("woff2");font-weight:400;font-display:swap}

html,body{margin:0;height:100%;background:#1a1612;color:var(--ink);font-family:var(--ming);font-size:var(--fs);-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
/* ── 場景：兩層交疊換畫，畫面緩慢推移 ── */

/* 中央留一片紙色，字才清楚；四周露出畫 */
.veil{position:fixed;inset:0;pointer-events:none;transition:background .8s;
  background:radial-gradient(ellipse 62% 70% at 50% 52%,rgba(var(--paper),.93) 0 62%,rgba(var(--paper),.55) 82%,rgba(var(--paper),0) 100%)}
body.wide .veil{background:radial-gradient(ellipse 80% 82% at 50% 52%,rgba(var(--paper),.95) 0 70%,rgba(var(--paper),.6) 88%,rgba(var(--paper),.15) 100%)}

/* ── 上列：章節 ── */
header{display:flex;align-items:center;gap:.35em;padding:.3em .6em;font-size:.6em;background:linear-gradient(rgba(var(--paper),.92),rgba(var(--paper),0))}

nav{display:flex;gap:.1em;flex-wrap:wrap}
nav button{border:0;background:none;padding:.2em .42em;border-radius:6px;color:var(--mute);font-weight:700;letter-spacing:.06em;position:relative}

main{flex:1;position:relative;overflow:hidden}

.bk.hb{position:relative;border-bottom-color:var(--hb);background:color-mix(in srgb,var(--hb) 13%,transparent);padding-left:1.3em;min-width:3.4em;text-align:center}
.bk.hb::before{content:attr(data-n);position:absolute;left:.14em;top:0;color:var(--hb);font-weight:700}

.kick .bkp{letter-spacing:.05em;border:1px solid var(--mute);border-radius:3px;padding:0 .5em;order:2;color:var(--ink);font-weight:700}

<script>

}

/* 課本頁碼（V254，老師 11/16「作者題解缺了課本頁碼」）：數字同網站 src/js/173_v178-bookpage-js.js（翰林 115 技高國文(1) 課本 PDF 逐頁看過） */

S.push({ ch: '封面', key: '封面', bg: BG.封面, cls: 'cover', html: `<div class="cv"><h1>${[...'樂府詩'].map((c, i) => `<span style="--i:${i}">${c}</span>`).join('')}</h1><div class="sub">感於哀樂・緣事而發</div>
  <div class="toc">${CH.slice(1).map(([c, t]) => `<button data-ch="${c}">${c}<small>${t}</small></button>`).join('')}</div></div>`,
  init: el => $$('[data-ch]', el).forEach(b => b.onclick = e => { e.stopPropagation(); goCh(b.dataset.ch); }) });
/* ───────── 補充講義的空格（翰林技高國文(1)補充講義 L7 解答版 P.77～78；編號照講義，每一節各自從 ① 起算） ─────────
   key＝出現在哪一頁；w＝答案（講義原字）；in＝限定在頁內哪個區塊找 */
const HB = {
  A1: { p: 'P.77', n: '①', w: '青蓮居士', key: '作者' }, A2: { p: 'P.77', n: '②', w: '謫仙人', key: '作者' }, A3: { p: 'P.77', n: '③', w: '杜甫', key: '作者' },
  A4: { p: 'P.77', n: '④', w: '順敘法', key: '題解' },
  B1: { p: 'P.77', n: '①', w: '漢武帝', key: '簡介' }, B2: { p: 'P.77', n: '②', w: '古詩', key: '簡介' },

  D1: { p: 'P.78', n: '①', w: '敘事', key: '與古詩·比較' }, D2: { p: 'P.78', n: '②', w: '言情', key: '與古詩·比較' }
};
/* 講義填空頁：句子照講義原文，{代號} 是空格 */
const FILL = {
  A: { p: 'P.77', t: '一、作者與題解', rows: [['字號', '字太白，號{A1}'], ['生平', '賀知章見其詩，嘆為{A2}'], ['評價', '有「詩仙」之稱，與詩聖{A3}並稱「李 杜」'],
    ['題解<br>要旨', '全詩以少婦口吻，自述對丈夫的深刻思念。採{A4}寫兩人從童年相識，到婚後甜蜜堅貞；後丈夫遠行，女子擔心惦記，觸景傷情，殷切企盼丈夫歸來']] },
  B: { p: 'P.77', t: '二、國學常識（一）「樂府」概述', rows: [['起源', '名稱最早見於秦代官制，{B1}時正式成立樂府官署，負責採集民間歌謠及制訂樂譜'], ['價值', '與{B2}被視為漢代詩歌的雙葩']] },
  C: { p: 'P.78', t: '（二）樂府詩的發展', rows: [['變調<br>中唐', '中唐 白居易、元稹倡導{C1}，主張「文章合為時而著，歌詩合為事而作」，要能「補察時政，洩導人情」']] },
  D: { p: 'P.78', t: '（三）樂府詩、古詩比較表', rows: [['風格<br>樂府詩', '多{D1}，反映時代'], ['風格<br>古詩', '多{D2}，尚溫雅']] }
};
const fillTable = f => `<div class="sec">${f.t}</div><table class="l7t fill">${f.rows.map(([h, t]) => `<tr class="st"><th>${h}</th><td>${t.replace(/\{(\w+)\}/g, (_, id) => `<span class="wk-a" data-hbid="${id}">${HB[id].w}</span>`)}</td></tr>`).join('')}</table>`;
const fillSlide = (ch, bg, ids) => S.push({ ch, key: '講義填空·' + ids.join(''), bg, wide: true, html: `<div class="kick"><span>講義填空</span><span class="hp fill">補充講義 ${FILL[ids[0]].p}</span></div><h2>把講義的空格補齊</h2><div class="fillnote">順序和講義一樣；點藍框對答案</div><div class="body">${ids.map(i => fillTable(FILL[i])).join('')}</div>` });
/* 在頁面裡找到講義空格那個詞：原本就是重點字（.wk-a）就直接用，否則把那幾個字包起來 */
function markHB(root, id) {
  const h = HB[id], box = h.in ? $(h.in, root) : root; if (!box) return false;
  let x = $$('.wk-a', box).find(e => e.textContent === h.w && !e.dataset.hbid);
  if (!x) {
    const tw = document.createTreeWalker(box, NodeFilter.SHOW_TEXT); let n;
    while ((n = tw.nextNode())) { if (n.parentElement.closest('.wk-a,.kick,.rail,.big,a,h2')) continue; const k = n.nodeValue.indexOf(h.w); if (k < 0) continue;
      const m = n.splitText(k); m.splitText(h.w.length); x = document.createElement('span'); x.className = 'wk-a'; x.textContent = h.w; m.replaceWith(x); break; }
  }
  if (!x) { console.error('講義空格在這一頁找不到：' + id + ' ' + h.w); return false; }
  x.dataset.hbid = id; return true;
}
/* 兩個以上 <br> 分段 */
const paras = html => html.split(/(?:<br\s*\/?>\s*){2,}/).map(x => x.trim()).filter(Boolean).map(x => `<div class="st">${x}</div>`).join('');
/* 作者（課本） */
{ const a = (LES[1].extras.authorPages || []).find(x => x.label === '作者·課本'); if (!a) throw new Error('課檔沒有這頁：作者·課本');
  S.push({ ch: '作者', key: '作者', bg: BG.作者, html: kick(a.head, '補充講義 P.77', BOOKP.作者) + `<div class="era"><div class="big">${LES[1].author.name}</div><div><div class="who">${LES[1].author.dynasty}</div><div class="body" style="font-size:.9em;line-height:1.75">${paras(a.body)}</div></div></div>` }); }
/* 題解頁（課本）拆成兩節：「題解」先講（講義 P.77 一、作者與題解），「樂府詩簡介」接到樂府詩常識前面（講義 P.77（一）概述） */
const TJ = {}; { const p = page('題解·課本'); let cur = null, hp = '';
  [...p.d.childNodes].forEach(n => { const c = n.nodeType === 1 ? n.className : '';

{ const c = page('詩的流變·封面').d, t = ($('.l7-cv-t', c) || {}).textContent || '詩的流變', sub = ($('.l7-cv-s', c) || {}).textContent || '';

  const p = page('詩的流變·總表'), rows = dets('詩的流變·總表').map(d => `<tr class="st"><th><span class="l7-erab">${($('.l7-era', d.s) || {}).textContent || ''}</span></th><th>${($('b', d.s) || d.s).innerHTML}</th><td>${d.b.innerHTML}</td></tr>`);

  S.push({ ch: '流變', key: '流變·常識', bg: BG.流變, wide: true, html: kick(q.head) + `<h2>${q.head}</h2><div class="body"><table class="l7t">${dets('詩的流變·常識').map(d => `<tr class="st"><th style="white-space:normal">${d.s.innerHTML}</th><td>${d.b.innerHTML}</td></tr>`).join('')}</table></div>` }); }

});

blockSlides('新樂府', '樂府詩·新樂府作品');
