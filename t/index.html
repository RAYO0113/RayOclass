<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>小老師成績登記</title>
<!-- 瑞媛國文　小老師成績登記・GitHub 版（10/25 老師：整頁搬到 GitHub，語音登分放進登記畫面；網址 RayOclass/t）。
     由 apps_script/tutor.html 搬來，功能照舊；只改三處：①連線＝fetch 帳密部署＋學校帳號通行證 t（後台 gr-18 起認，同學生網頁 ?page=auth 發的）
     ②登入＝學校帳號（不用密碼）③登記畫面加 🎤 語音登分（說「5號14分」→ 暫存清單核對 → 全部寫入，走原本 queue／setSc）。
     舊頁（Apps Script ?page=tutor）留著備用；Apps Script 外框不給麥克風，所以語音只能在這一版。
     正本：教學系統 app/成績系統/src/tutor_gh.html → 複製到 RayOclass/t/index.html。網頁內沒有任何學生資料。 -->
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#3b2f25;--mut:#8a7a6a;--line:#e6dccd;--pri:#a0522d;--pri2:#f3e6d8;--ok:#2e7d4f;--okbg:#e5f3ea;--late:#b3261e;--latebg:#fde8e6;--lv:#6a4c93;--lvbg:#efe8f7;--hl:#fff3c4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top b{font-size:17px}
.top .sp{flex:1}
.top button{background:rgba(255,255,255,.18);border:0;border-radius:8px;padding:5px 10px;color:#fff;font-size:14px}
.mode{display:inline-block;background:#fff;color:var(--pri);border-radius:999px;padding:1px 10px;font-size:14px;font-weight:700}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.it{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.it .t{font-weight:700}
.it small{display:block;color:var(--mut)}
.tag{display:inline-block;font-size:13px;border-radius:6px;padding:0 6px;margin-right:6px;background:var(--pri2);color:var(--pri)}
.miss{color:var(--late);font-weight:700}
.okc{color:var(--ok);font-weight:700}
.mut{color:var(--mut);font-size:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.big{width:100%;padding:14px;font-size:18px;margin:6px 0}
h2{font-size:18px;margin:4px 0 8px}
.missbox{background:var(--latebg);border-radius:10px;padding:8px 10px;margin:0 0 10px}
.missbox b{color:var(--late)}
.seg{display:flex;gap:6px;margin:0 0 10px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.row{display:grid;grid-template-columns:3.4em 1fr auto;gap:6px 8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin:0 0 6px}
.row.cur{outline:3px solid #e0a43a;background:var(--hl)}
.row .no{font-size:20px;font-weight:700;text-align:center}
.row .nm{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{display:block;color:var(--mut);font-size:12px}
.sc{width:4.6em;font-size:22px;text-align:center;border:2px solid var(--line);border-radius:8px;padding:4px}
.sc:focus{border-color:var(--pri);outline:0;background:#fffaf2}
.chips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:14px}
.chip.ok.on{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.chip.late.on{background:var(--latebg);border-color:var(--late);color:var(--late);font-weight:700}
.chip.lv.on{background:var(--lvbg);border-color:var(--lv);color:var(--lv);font-weight:700}
.chip input{border:0;background:transparent;font-size:14px;padding:0;width:8.2em}
.st{font-size:13px;min-width:1.2em;text-align:right}
.st.err{color:var(--late)}
.done{color:var(--ok);font-weight:700}
.bon{grid-column:1/-1;display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.bon button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;font-size:15px}
.bon button.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.ck{width:28px;height:28px}
.mask{position:fixed;inset:0;background:rgba(40,28,18,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 6px;font-size:20px}
.dlg .choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0 0}
.dlg .choice b{font-size:19px}
.dlg .choice small{display:block;color:var(--mut)}
.dlg .choice:hover,.dlg .choice:focus{border-color:var(--pri)}
label.f{display:block;margin:8px 0 2px;font-size:14px;color:var(--mut)}
.inp{width:100%;font-size:17px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#3b2f25;color:#fff;padding:8px 16px;border-radius:999px;z-index:30;font-size:15px;max-width:92vw}
.toast.err{background:var(--late)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:6}
.bar .sp{flex:1}
.top select{font:inherit;font-size:15px;border:0;border-radius:8px;padding:4px 6px;background:#fff;color:var(--pri);font-weight:700}
.warn{background:#fff3c4;border:1px solid #e0a43a;border-radius:10px;padding:6px 10px;margin:0 0 10px;font-size:14px}
.dlg .me{font-size:22px;font-weight:700;margin:10px 0 4px;text-align:center}
/* gr-6 */
.seg.tf{position:sticky;top:46px;z-index:4;background:var(--bg);padding:4px 0}
.les{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.les button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 2px;line-height:1.2}
.les button small{display:block;font-size:11px;color:var(--mut)}
.les button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.les button.on small{color:#fff}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.opts button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:15px}
.opts button.on{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.bon button{padding:9px 0;font-size:14px}
.row.cur .bon button{border-color:#e0a43a}
/* 按鈕爆粒子（10/8）：點下去 1→0.8→1.2→1 回彈＋8 顆古典色小圓點，600ms */
.pop-fx-layer{position:absolute;left:0;top:0;width:0;height:0;overflow:visible;pointer-events:none;z-index:99999}
.pop-fx-dot{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;will-change:transform,opacity}
/* 10/25 語音登分（GitHub 版） */
.vobtn{display:block;width:100%;border:2px solid var(--pri);background:#fff;color:var(--pri);border-radius:12px;padding:10px;font-size:17px;font-weight:700;margin:0 0 10px}
.vobtn.on{background:var(--pri);color:#fff}
.vo{border:2px solid var(--pri);border-radius:12px;background:#fff;padding:10px;margin:0 0 12px}
.vo .go{width:100%;padding:12px;font-size:18px;border-radius:10px;border:0;background:var(--pri);color:#fff}
.vo .go.stop{background:var(--late)}
.say{font-size:20px;line-height:1.4;border:2px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;min-height:60px;text-align:center}
.say b{font-size:36px;color:var(--pri)}
.say small{display:block;font-size:15px}
.say.bad{border-color:var(--late);color:var(--late);font-size:19px}
.say.ok{border-color:var(--ok);color:var(--ok)}
.vmid{min-height:18px;font-size:14px;color:var(--mut);text-align:center}
.vt{width:100%;border-collapse:collapse;margin:6px 0}
.vt th,.vt td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
.vt th{font-size:13px;color:var(--mut);font-weight:400}
.vt td{font-size:17px}
.vt tr.new td{background:var(--hl);font-weight:700}
.vt .x{border:0;background:transparent;color:var(--mut);font-size:18px}
.vbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vbar .sp{flex:1}
.vbar .btn:disabled{opacity:.4}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="mut">讀取中…</p></div></div>
<script>
(function () {
  'use strict';
  var TYPE_NAME = { '註釋小考': '小考', 'A卷': 'A卷', '習作': '習作', '筆記': '課本筆記', '回家考卷': '其它' };
  var TEST = { '註釋小考': 1, 'A卷': 1 };
  var S = { me: null, email: '', cls: '', mode: '', d: null, item: '', tab: 'raw', cur: 0, fix: {}, dlg: '', busy: false, newF: null, tf: '' };
  var pend = {}, rowSt = {}, timer = null, saving = false;

  /* ── 工具 ── */
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function md(s) { if (!s) return ''; var a = String(s).split('-'); return (+a[1]) + '/' + (+a[2]); }
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsPut(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
  function $(sel) { return document.querySelector(sel); }
  function toast(t, err) {
    var o = $('.toast'); if (o) o.remove();
    o = document.createElement('div'); o.className = 'toast' + (err ? ' err' : ''); o.textContent = t; document.body.appendChild(o);
    setTimeout(function () { if (o.parentNode) o.remove(); }, err ? 4500 : 1800);
  }
  /* GitHub 版：帳密部署（任何人）＋學校帳號通行證；登入用學校帳號部署 ?page=auth（同 stu115 新班級網頁） */
  var CFG = {
    api: 'https://script.google.com/macros/s/AKfycbxfJoT1iS5tIzXtShetthjspMQ-yUwgUkiPfWc2nBEDNwYgs49u87eKvAJo5x73k7K1/exec',
    auth: 'https://script.google.com/a/macros/mail2.ccvs.kh.edu.tw/s/AKfycbyW9KydiQ5kg8Mo7-JpBEHZVmmVg5Sgcor7nBO12lWU7zSBVQtle8bwEsdIK3VO2KsG/exec'
  };
  var LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if (LOCAL) CFG.api = CFG.auth = location.origin + '/exec';   /* 本機測試：scripts/成績系統/tutor_gh_dev_server.js（真的 Code.gs＋假名單） */
  var TK = 'tv_t_v1', AC = 'tv_acct_v1', DOM = '@mail2.ccvs.kh.edu.tw';
  function takeHash() {   /* #t= 收下就從網址列清掉 */
    var hm = /[#&]t=([\w.-]+)/.exec(location.hash);
    if (hm) { lsPut(TK, hm[1]); history.replaceState(null, '', location.pathname + location.search); }
    return !!hm;
  }
  function api(req) {
    req.t = lsGet(TK);
    if (S.me && S.me.all && !('cls' in req)) req.cls = S.cls;   // 測試帳號：目前選的班
    return fetch(CFG.api, { method: 'POST', body: JSON.stringify(req), redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  /* ── 資料 ── */
  function items() {
    return (S.d ? S.d.items : []).slice().sort(function (a, b) { var x = a.issued || a.due || '', y = b.issued || b.due || ''; return x === y ? 0 : (x < y ? 1 : -1); });
  }
  function itemOf(id) { return (S.d ? S.d.items : []).filter(function (i) { return i.id === id; })[0] || null; }
  function scOf(item, seat) { return (S.d ? S.d.scores : []).filter(function (o) { return o.item === item && o.seat === seat; })[0] || null; }
  function setSc(item, seat, p) {
    var o = scOf(item, seat);
    if (!o) { o = { item: item, seat: seat, got: 0, late: 0, sub: '', lv: '', lvD: '', chk: 0, raw: '', bonus: '', show: 1 }; S.d.scores.push(o); }
    Object.keys(p).forEach(function (k) { o[k] = p[k]; });
    return o;
  }
  /* 測試帳號：班級以後台回傳的為準（後台會擋掉不存在的班）；第一次用上次選的班 */
  function setMe(me) {
    var first = !S.me || S.me.all !== me.all;
    S.me = me;
    if (me.all) { var c = lsGet('tutor_cls'); S.cls = first && c && (me.classes || []).indexOf(c) >= 0 ? c : (S.cls && (me.classes || []).indexOf(S.cls) >= 0 ? S.cls : me.cls); }
    else S.cls = me.cls;
  }
  function itemName(it) { return it.title || (TYPE_NAME[it.type] || it.type); }
  function stat(it) {
    var r = S.d.roster, got = 0, chk = 0, miss = [];
    r.forEach(function (s) { var o = scOf(it.id, s.seat); if (o && o.got) { got++; if (o.chk) chk++; } else if (!(o && o.lv)) miss.push(s); });
    return { n: r.length, got: got, chk: chk, miss: miss };
  }

  function load(cb) {
    var it = S.item;
    api({ action: 'tLoad', item: it, mode: S.mode }).then(function (r) {
      if (!r.ok) { if (r.auth === false) { lsPut(TK, ''); S.me = null; S.err = '登入已過期，請重新登入'; render(); return; } throw new Error(r.error || '讀取失敗'); }
      S.d = r; setMe(r.me); if (cb) cb(); render();
    }).catch(function (e) { toast('讀取失敗：' + e.message, true); });
  }

  /* ── 儲存（批次） ── */
  function queue(seat, p) {
    var k = S.item + '|' + seat, o = pend[k] || (pend[k] = { item: S.item, mode: S.mode, cls: S.cls, row: { seat: seat } });
    Object.keys(p).forEach(function (f) { o.row[f] = p[f]; });
    rowSt[k] = '⏳'; paintSt(seat);
    clearTimeout(timer); timer = setTimeout(flush, 500);
  }
  function flush() {
    if (saving) { clearTimeout(timer); timer = setTimeout(flush, 400); return; }
    var keys = Object.keys(pend); if (!keys.length) return;
    var by = {}; keys.forEach(function (k) { var o = pend[k]; var g = o.item + '|' + o.mode + '|' + o.cls; (by[g] = by[g] || { item: o.item, mode: o.mode, cls: o.cls, rows: [], keys: [] }); by[g].rows.push(o.row); by[g].keys.push(k); });
    pend = {}; saving = true;
    var groups = Object.keys(by).map(function (g) { return by[g]; });
    (function next(i) {
      if (i >= groups.length) { saving = false; renderBar(); if (Object.keys(pend).length) flush(); return; }
      var g = groups[i];
      api({ action: 'tPut', item: g.item, mode: g.mode, cls: g.cls, rows: g.rows }).then(function (r) {
        g.keys.forEach(function (k) { rowSt[k] = r.ok ? '✓' : '⚠'; paintSt(+k.split('|')[1], k); });
        if (!r.ok) toast(r.error || '儲存失敗', true);
        next(i + 1);
      }).catch(function (e) {
        g.keys.forEach(function (k, j) { rowSt[k] = '⚠'; pend[k] = pend[k] || { item: g.item, mode: g.mode, cls: g.cls, row: g.rows[j] }; paintSt(+k.split('|')[1], k); });
        saving = false; toast('沒存到（' + e.message + '），網路恢復後按「重存」', true); renderBar();
      });
    })(0);
  }
  function paintSt(seat, k) {
    k = k || S.item + '|' + seat;
    if (k.split('|')[0] !== S.item) return;
    var e = document.querySelector('[data-st="' + seat + '"]'); if (!e) return;
    e.textContent = rowSt[k] || ''; e.className = 'st' + (rowSt[k] === '⚠' ? ' err' : '');
  }

  /* ── 畫面 ── */
  function render() {
    var app = $('#app'), h = '';
    if (!S.me) { app.innerHTML = loginHTML(); return; }
    h += '<div class="top">' + (S.me.all ? '<b>' + (S.me.teacher ? '老師' : '測試帳號') + '</b><select data-a="cls" aria-label="班級">' + (S.me.classes || []).map(function (c) { return '<option' + (c === S.cls ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>'
      : '<b>' + esc(S.me.cls) + ' ' + S.me.seat + '號</b>') +
      (S.mode ? '<span class="mode">' + (S.mode === 'chk' ? '🔍 檢查' : '✏️ 登記') + '</span>' : '') +
      '<span class="sp"></span><button data-a="mode">換模式</button><button data-a="reload">⟳</button><button data-a="logout">登出</button></div>';
    h += '<div class="wrap">';
    if (S.me.all && !S.me.teacher) h += '<div class="warn">🧪 測試帳號：登記、打勾都會寫進正式成績（記成「測試帳號」），請只在測試用的考卷上試。</div>';
    if (!S.d) h += '<p class="mut">讀取中…</p>';
    else if (S.newF) h += newHTML();
    else if (S.item && itemOf(S.item)) h += itemHTML(itemOf(S.item));
    else h += homeHTML();
    h += '</div>';
    if (S.dlg === 'who') h += whoDlg();
    else if (S.dlg === 'mode' || (!S.mode && S.d)) h += modeDlg();
    app.innerHTML = h;
    renderBar();
    var f = document.querySelector('.row.cur .sc'); if (f && !S.dlg && S.mode) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } }
  }
  function renderBar() {
    var b = $('.bar'); if (b) b.remove();
    var n = Object.keys(rowSt).filter(function (k) { return rowSt[k] === '⚠'; }).length;   // 只提示存失敗的（⏳ 是正在存）
    if (!n) return;
    b = document.createElement('div'); b.className = 'bar';
    b.innerHTML = '<span class="miss">⚠ 有 ' + n + ' 筆還沒存到</span><span class="sp"></span><button class="btn pri" data-a="retry">重存</button>';
    document.body.appendChild(b);
  }

  function loginHTML() {
    return '<div class="top"><b>小老師成績登記</b></div><div class="wrap"><div class="card">' +
      '<h2>用學校帳號登入</h2>' + (S.err ? '<p class="miss">' + esc(S.err) + '</p>' : '') +
      '<p class="mut">打你的學號，按「登入」後選學校帳號（學號' + DOM + '）。只有小老師登得進來，不用另外的密碼。</p>' +
      '<label class="f">學號</label><input class="inp" id="u" autocomplete="username" inputmode="text" autocapitalize="off" value="' + esc(lsGet(AC)) + '">' +
      '<button class="btn pri big" data-a="login">登入</button></div></div>';
  }
  function meText() { return S.me.all ? (S.me.teacher ? '老師' : '測試帳號') + '（' + esc(S.cls) + '）' : esc(S.me.cls) + ' ' + S.me.seat + '號 ' + esc(S.me.name); }
  /* 登入後先確認身分（10/6 老師要求）→「小奴工上工了」→ 再選登記／檢查 */
  function whoDlg() {
    var who = S.me.all ? (S.me.teacher ? '老師' : '測試帳號') : esc(S.me.cls) + ' ' + S.me.seat + '號 ' + esc(S.me.name);
    return '<div class="mask"><div class="dlg"><h3>請確認你的身分</h3><p class="mut" style="text-align:center;margin:8px 0 0">你是</p><div class="me">' + who + '</div>' +
      (S.me.all ? '<p class="mut" style="text-align:center">' + esc(S.me.email || '') + '<br>四個班都看得到，上方可以切換班級</p>' : '') +
      '<button class="btn pri big" data-a="go">💪 小奴工上工了</button>' +
      '<button class="btn" style="width:100%;margin-top:4px" data-a="logout">不是我（登出）</button></div></div>';
  }
  function modeDlg() {

        { transform: P(1) + ' scale(.4)', opacity: 0 }
      ], { duration: d }).onfinish = (function (el) { return function () { el.remove(); }; })(dot);
    }
  }
  // 放在主要 click 處理之後：+幾 按完會重畫整列 → 找重畫後的新按鈕來彈；整個視窗關掉的（上工、選模式）→ 用按下時的位置只炸粒子
  var fxDown = null;
  document.addEventListener('pointerdown', function (e) {
    var t = e.target.closest ? e.target.closest('button[data-a]') : null;
    fxDown = t && FX_RE.test(t.getAttribute('data-a')) ? { el: t, r: t.getBoundingClientRect(), y: window.scrollY, x: window.scrollX } : null;
  }, true);
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button[data-a]') : null; if (!t) return;
    var k = t.getAttribute('data-a'); if (!FX_RE.test(k)) return;
    var r0 = fxDown && fxDown.el === t ? fxDown : null; fxDown = null;
    if (!t.isConnected) { var q = document.querySelectorAll('button[data-a]'); t = null; for (var i = 0; i < q.length; i++) if (q[i].getAttribute('data-a') === k) { t = q[i]; break; } }
    if (t) popFx(t);
    else if (r0) popFx(null, { left: r0.r.left + r0.x - window.scrollX, top: r0.r.top + r0.y - window.scrollY, width: r0.r.width, height: r0.r.height });
  });

  window.addEventListener('beforeunload', function (e) { if (Object.keys(pend).length || (S.vo && S.vo.list.length)) { flush(); e.preventDefault(); e.returnValue = ''; } });

  function init() {
    S.tf = TYPE4.indexOf(lsGet('tutor_tf')) >= 0 ? lsGet('tutor_tf') : '註釋小考';
    takeHash();
    if (!lsGet(TK)) { S.me = null; render(); return; }
    api({ action: 'tWho' }).then(function (r) {
      if (r.me) { setMe(r.me); S.dlg = 'who'; render(); load(); } else { lsPut(TK, ''); S.me = null; S.err = '登入已過期，或這個學校帳號不在小老師名單裡。'; render(); }
    }).catch(function (e) { $('#app').innerHTML = '<div class="wrap"><p class="miss">連線失敗：' + esc(e.message) + '</p></div>'; });
  }
  window.addEventListener('hashchange', function () { if (takeHash()) init(); });
  window.TUT = { voParse: voParse, voHeard: voHeard };   /* 測試用：模擬「聽到」一句話（不含學生資料） */
  init();
})();
