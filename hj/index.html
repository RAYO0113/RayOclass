<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>課文畫卷</title>
<!-- 課文畫卷引擎（2026-11-17 起；前身 cg/index.html 試作）。開法：hj/index.html?l=<設定檔名>，例 ?l=changgan → hj/lessons/changgan.js
     製作規範：教學系統專案 docs/規格_課文畫卷製作規範.md（每一課要填什麼、從哪裡來、怎麼驗證）。
     ・課文、注釋、字義（課文裡的 {g:}）、通同（{z:}）、補充（{p:}）、句意、修辭、段旨、補充框、課本頁碼：執行時讀課檔 data/lessons/<file>.js 的 textPages，不另抄
     ・課檔沒有的（另外的字義、講義空格、提問與回答、補充互動、分段說明、畫）放在設定檔 window.HJ，每筆附來源
     ・一卷手卷由右往左；一段一幅畫，段與段互相暈開；每按一步，卷子走到下一處
     ・老師 11/16～17 定的版面：注釋、字義、句意、修辭都直書緊跟在那一句左邊（學生知道抄在哪），字級與課文只差一點（放大時一起放大），顏色區分；
       語譯不給學生看，放在講稿（N）；提問都有回答，按下一步才翻出；補充（修辭、年齡）做成互動
     色票（意思固定，不可混用）：注釋＝赭（照課本注釋編號色 #b97053 加深）、字義＝藍、句意＝綠、修辭＝紫、講義空格＝墨字＋黃底；朱紅只給介面（印章、按鈕、進度）
     字體＝源流明體。iPad 11（1194×834）為主、手機直式可用。 -->
<style>
:root{
  --fs:clamp(18px,2.65vw,40px);
  --paper:247,238,214; --ink:#2a2521; --mute:#6a5a45; --zhu:#a8352a; --zhu-d:#7f241c; --gold:#b08d57; --line:rgba(107,74,43,.32);
  --card:rgba(255,251,240,.94);
  --nt:#9a4f2f; --zy:#1d4f91; --yi:#2a5a3a; --rh:#5b3f8a; --hbk:#2a2521; --hbg:rgba(244,204,64,.42);
  --seal:linear-gradient(135deg,#b83f31,#98291f);
  --ming:"RayGenRyuRead","Noto Serif TC","PMingLiU",serif;
  --ov:9em; --pz:1.32;   /* 相鄰兩幅畫暈開寬度；課文字＝旁批字的幾倍 */
}
body.night{--paper:16,18,26; --ink:#f1e6cb; --mute:#b9a988; --zhu:#e9a45c; --zhu-d:#f0c184; --gold:#d8b878; --line:rgba(240,225,190,.28);
  --card:rgba(22,24,34,.93); --nt:#f0a982; --zy:#9cc4ff; --yi:#a9dcb2; --rh:#cdb6f2; --hbk:#f1e6cb; --hbg:rgba(190,150,30,.45)}
*{box-sizing:border-box}
@font-face{font-family:"RayGenRyuRead";src:url("../fonts/genryumin-read-r.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"RayGenRyuRead";src:url("../fonts/genryumin-read-b.woff2") format("woff2");font-weight:700;font-display:swap}
html,body{margin:0;height:100%;background:#1a1612;color:var(--ink);font-family:var(--ming);font-size:calc(var(--fs) * var(--zoom,1));-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:rgb(var(--paper))}
header,footer{display:flex;align-items:center;gap:.4em;padding:.28em .6em;font-size:calc(var(--fs) * .6);background:rgb(var(--paper));z-index:3}
header{border-bottom:1px solid var(--line)} footer{border-top:1px solid var(--line);padding-bottom:calc(.3em + env(safe-area-inset-bottom))}
.logo{color:#fbefdc;background:var(--seal);border-radius:4px 7px 4px 8px;box-shadow:inset 0 0 0 1.5px rgba(251,239,220,.55);padding:.1em .45em;font-weight:700;letter-spacing:.12em;transform:rotate(-2deg);margin-right:.3em;white-space:nowrap}
nav{display:flex;gap:.1em;flex-wrap:wrap}
nav button{border:0;background:none;padding:.2em .5em;border-radius:6px;color:var(--mute);font-weight:700;letter-spacing:.06em;position:relative}
nav button.on{color:var(--zhu-d)}
nav button.on::after{content:'';position:absolute;left:.5em;right:.5em;bottom:0;height:3px;border-radius:50%;background:var(--zhu)}
.sp{flex:1}
.tool{border:1.5px solid var(--line);background:rgba(var(--paper),.75);border-radius:6px;padding:.2em .7em;white-space:nowrap}
.tool.on{background:var(--zhu);border-color:var(--zhu);color:#fbefdc}
.nx{background:var(--seal);border:0;color:#fbefdc;border-radius:6px 9px 5px 10px;padding:.3em 1.1em;font-weight:700;box-shadow:inset 0 0 0 1.5px rgba(251,239,220,.5),0 2px 5px rgba(0,0,0,.25)}
footer .pg{min-width:4.5em;text-align:center;color:var(--mute)}
.lg{display:inline-flex;align-items:center;gap:.25em;margin-left:.55em;color:var(--mute)} .lg::before{content:'';width:.85em;height:.85em;border-radius:2px;background:var(--c)}
/* ── 畫軸：上下裱邊（錦＋金線＋綾） ── */
#view{flex:1;position:relative;overflow:hidden;background:#e9dcbd;min-height:0}
body.night #view{background:#0e1016}
#view::before,#view::after{content:'';position:absolute;left:0;right:0;height:1.05em;z-index:4;pointer-events:none;
  background:
    linear-gradient(to bottom,transparent 0 58%,#c9a764 58% 63%,#6b4f2e 63% 67%,#efe3c6 67% 100%),
    radial-gradient(circle at 50% 50%,rgba(214,178,110,.35) 0 .09em,transparent .1em) 0 0/.55em .55em,
    repeating-linear-gradient(45deg,rgba(255,226,170,.08) 0 1px,transparent 1px 5px),
    repeating-linear-gradient(-45deg,rgba(255,226,170,.08) 0 1px,transparent 1px 5px),
    linear-gradient(#2d1f14,#4b3422 45%,#2d1f14);
  box-shadow:0 2px 4px rgba(40,25,10,.35)}
#view::before{top:0}
#view::after{bottom:0;transform:scaleY(-1);box-shadow:0 2px 4px rgba(40,25,10,.35)}
body.night #view::before,body.night #view::after{filter:brightness(.75)}
#roll{position:absolute;left:0;top:1.05em;bottom:1.05em;width:max-content;display:flex;flex-direction:row-reverse;transform-origin:0 50%;transition:transform 1.5s cubic-bezier(.3,.05,.2,1);will-change:transform}
#roll.jump{transition:none}
.lead,.tail{flex:none;display:flex;flex-direction:row-reverse;align-items:center;justify-content:center;gap:1.6em;padding:0 3em;background:rgb(var(--paper));position:relative}
.lead{min-width:min(46em,92vw)} .tail{width:14em;color:var(--mute);font-size:.8em;letter-spacing:.3em;writing-mode:vertical-rl;padding:0}
.lead::before{content:'';position:absolute;top:-1.05em;bottom:-1.05em;right:0;width:1.3em;z-index:5;
  background:linear-gradient(90deg,#7a5a38,#3a2a1a 30%,#a07a4c 55%,#4a3420 80%,#6b4f30);box-shadow:-3px 0 6px rgba(30,20,10,.4)}   /* 軸桿 */
.lead::after{content:'';position:absolute;top:0;bottom:0;right:1.3em;width:.9em;background:linear-gradient(90deg,transparent,rgba(90,60,30,.12))}
.lead .tt{writing-mode:vertical-rl;font-size:min(3.6em,13vh);font-weight:900;letter-spacing:.25em;line-height:1.1}
.lead .tt span{display:inline-block;animation:ink .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.25s + .3s)}
@keyframes ink{from{opacity:0;transform:scale(1.7);filter:blur(10px)}}
.lead .au{writing-mode:vertical-rl;letter-spacing:.4em;color:var(--mute);font-size:.8em;align-self:flex-end;padding-bottom:3em}
.lead .au b{display:inline-block;color:#fbefdc;background:var(--seal);border-radius:4px 6px 4px 7px;padding:.3em .12em;margin-top:.5em;letter-spacing:.1em;box-shadow:inset 0 0 0 1.5px rgba(251,239,220,.5)}
.pan{position:relative;flex:none;min-width:92vw;display:flex;flex-direction:row-reverse;align-items:center;gap:1.2em;padding:0 2.2em}
.pan .img,.pan .tint{position:absolute;top:0;bottom:0;left:calc(var(--ov)*-1);right:calc(var(--ov)*-1);pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 calc(var(--ov)*2),#000 calc(100% - var(--ov)*2),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 calc(var(--ov)*2),#000 calc(100% - var(--ov)*2),transparent 100%)}
.pan .img{background:center/cover no-repeat}
body.night .pan .img.own{filter:brightness(.42) saturate(.75)}
.pan .tint{background:var(--tint);mix-blend-mode:multiply}
.pan>*:not(.img):not(.tint){position:relative;z-index:1}
/* 題簽：段名＋段旨（整段讀完才落款）＋課本頁碼＋自行分段提示 */
.tq{flex:none;writing-mode:vertical-rl;display:flex;align-items:center;gap:.5em;background:var(--card);border:1px solid var(--gold);box-shadow:2px 3px 0 rgba(107,74,43,.2);padding:.7em .28em;font-size:.8em;letter-spacing:.18em}
.tq>*{white-space:nowrap} .tq .sg{color:var(--zhu-d);font-weight:700} .tq .bkp{color:var(--mute);font-size:.8em;letter-spacing:.05em}
.tq .pn{font-size:1.5em;font-weight:900;color:transparent;border-right:3px solid var(--zhu);background:rgba(168,53,42,.1);padding:.2em .08em;min-height:4.6em;cursor:pointer;transition:color .4s,background .4s}
.tq .pn.on{color:var(--zhu-d);background:none;animation:stamp .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes stamp{from{opacity:0;transform:scale(2) rotate(-10deg)}}
.tq .mk{font-size:.75em;color:#fbefdc;background:var(--seal);border-radius:3px;padding:.3em .1em;letter-spacing:.05em}
#roll.ovw .seam,#roll.ovw .tail,#roll.ovw .lead .askc{display:none} #roll.ovw .pan{min-width:0} #roll.ovw .lead{min-width:0}
/* 一聯（一句）＝一張詩箋：課文直書＋緊跟在左邊的旁批 */
.lw{flex:none;opacity:0;transform:translateX(-1.2em);filter:blur(6px);transition:opacity .7s,transform .7s,filter .7s;pointer-events:none}
.lw.show{opacity:.86;transform:none;filter:none;pointer-events:auto}
.lw.cur,#roll.whole .lw.show{opacity:1}
.lian{display:flex;flex-direction:row-reverse;align-items:stretch;gap:.4em;background:var(--card);border:1px solid var(--line);border-radius:3px;box-shadow:3px 5px 14px rgba(60,40,20,.28);padding:.55em .55em}
.lw.cur .lian{box-shadow:0 0 0 2px var(--gold),4px 7px 18px rgba(60,40,20,.38)}
.col{flex:none;writing-mode:vertical-rl;white-space:nowrap;font-size:calc(var(--pz) * 1em);font-weight:700;line-height:1.3;letter-spacing:.06em;cursor:pointer;align-self:flex-start}
.col i{font-style:normal;display:inline-block}
.col i.pu{color:var(--mute)} .col i.gap{height:.3em}
.lw.fresh .col i{animation:write .5s both;animation-delay:calc(var(--k)*95ms + .35s)}
@keyframes write{from{opacity:0;transform:translateY(-.3em) scale(1.3);filter:blur(4px)}}
/* 課文裡有注釋的詞：右邊赭線＋課本注釋編號；有字義的字：右邊藍線 */
.nw{border-right:3px solid var(--nt)} .nw sup{font-size:.4em;color:var(--nt);vertical-align:baseline;letter-spacing:0;line-height:1;font-weight:900}
.gw{box-shadow:inset -3px 0 0 var(--zy)}
.col i.rq{color:var(--rh);background:color-mix(in srgb,var(--rh) 14%,transparent);box-shadow:inset 3px 0 0 var(--rh)}
/* 旁批：位置先留好（有顏色的空框），按了才出現字 */
.an{flex:none;writing-mode:vertical-rl;font-size:1em;line-height:1.5;letter-spacing:.03em;padding:.3em .2em;border-radius:3px;border-top:.25em solid var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);color:var(--c);cursor:pointer;position:relative;transition:background .4s}
.an>span{transition:opacity .5s,filter .5s}
.an.off>span{opacity:0;filter:blur(5px)}
.an.off{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 15%,transparent) 0 .5em,color-mix(in srgb,var(--c) 6%,transparent) .5em 1em)}
.an .tg{display:inline-block;font-weight:900;color:#fff;background:var(--c);border-radius:3px;padding:.12em .04em;margin-bottom:.3em;letter-spacing:0;font-size:.8em;line-height:1.2}
body.night .an .tg{color:#14161c}
.an b{font-weight:900} .an .q{margin-top:.35em}
.an.nt{--c:var(--nt)} .an.zy{--c:var(--zy)} .an.mean{--c:var(--yi)} .an.rhet{--c:var(--rh)}
.an.rhet.act{box-shadow:0 0 0 2px var(--rh)}
/* 段與段之間的留白：段落透視（講義空格）、提問、補充 */
.seam{flex:none;display:flex;flex-direction:row-reverse;align-items:center;gap:1em;padding:0 1.2em}
.card{flex:none;width:15em;max-height:calc(100% - 1em);overflow:auto;background:var(--card);border-top:5px solid var(--zhu);border-radius:3px;box-shadow:3px 5px 16px rgba(60,40,20,.3);padding:.55em .9em .7em;line-height:1.6;opacity:0;transform:translateY(14px);filter:blur(6px);transition:opacity .7s .3s,transform .7s .3s,filter .7s .3s;pointer-events:none}
.card.show{opacity:1;transform:none;filter:none;pointer-events:auto}
.card.cur{box-shadow:0 0 0 2px var(--gold),3px 5px 16px rgba(60,40,20,.3)}
.card small.k{display:block;font-size:.62em;letter-spacing:.25em;color:var(--mute);margin-bottom:.2em}
.card .q{font-weight:700;font-size:1.08em}
.card .src{display:block;font-size:.58em;color:var(--mute);margin-top:.5em;letter-spacing:.02em;line-height:1.5}
.card .ans{margin-top:.5em;padding:.35em .7em;border-left:4px solid var(--yi);background:color-mix(in srgb,var(--yi) 9%,transparent);color:var(--yi);border-radius:0 6px 6px 0;font-size:.92em}
.card .ans.off{display:none}
.card .ans b{margin-right:.3em}
.card.hbc{border-top-color:#c9a227} .card.exc{border-top-color:var(--rh)}
.opts{display:grid;gap:.3em;margin-top:.4em}
.opts button{text-align:left;border:1.5px solid var(--line);background:rgba(var(--paper),.9);border-radius:6px;padding:.15em .6em}
.opts button b{color:var(--zhu-d);margin-right:.4em}
.opts button.ok{background:#3f6b52;border-color:#3f6b52;color:#fff}.opts button.ok b{color:#fff}
.opts button.no{background:#b0796a;border-color:#b0796a;color:#fff;animation:shake .35s}.opts button.no b{color:#fff}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hbl{margin:.15em 0}
.hb{display:inline-block;min-width:3.2em;text-align:center;color:transparent;background:var(--hbg);border-bottom:2px solid var(--hbk);border-radius:3px 3px 0 0;padding:0 .2em;margin:0 .1em;font-weight:900;cursor:pointer;position:relative;transition:color .35s}
.hb::before{content:attr(data-n);position:absolute;left:-.1em;top:-.85em;font-size:.55em;color:var(--mute);font-weight:400}
.hb.on{color:var(--hbk)}
.go{margin-top:.5em;border:0;background:var(--seal);color:#fbefdc;border-radius:5px;padding:.2em .9em;font-weight:700}
/* 講稿（老師看；預設不顯示） */
#note{position:absolute;left:1.5em;right:1.5em;bottom:1.3em;z-index:6;max-height:38%;overflow:auto;display:none;background:rgba(24,21,18,.93);color:#f3e9d2;font-size:.68em;line-height:1.75;padding:.5em 1.1em .7em;border-top:3px solid var(--gold);border-radius:4px;box-shadow:0 -6px 20px rgba(0,0,0,.3)}
#note.on{display:block} #note h4{margin:0 0 .15em;font-size:.8em;letter-spacing:.2em;color:#d8b878} #note p{margin:.1em 0}
#cap{position:absolute;left:50%;bottom:1.5em;transform:translateX(-50%);z-index:3;background:var(--card);border:1px solid var(--gold);border-radius:4px;padding:.2em 1em;font-size:.75em;max-width:94%;text-align:center;box-shadow:2px 3px 0 rgba(107,74,43,.15);transition:opacity .5s}
#cap:empty{opacity:0}
#cap i{font-style:normal;display:inline-flex;align-items:center;gap:.35em;font-weight:700;margin:0 .5em} #cap i::before{content:'';width:.8em;height:.8em;border-radius:50%;background:var(--c)}
/* ── 整頁紙：補充互動 ── */
#sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(20,16,12,.55);padding:2.5vh 3vw}
#sheet.on{display:flex}
#sheet .pp{margin:auto;width:min(46em,100%);max-height:100%;overflow:auto;background:rgb(var(--paper));border:3px double var(--mute);border-radius:4px;padding:.6em 1.1em 1em;font-size:.8em;line-height:1.6;animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
#sheet h3{margin:0 0 .4em;display:flex;align-items:center;gap:.5em;color:var(--rh);letter-spacing:.1em}
#sheet h3 span{flex:1}
#sheet table{border-collapse:collapse;width:100%;margin:.3em 0}
#sheet th,#sheet td{border:1px solid var(--line);padding:.3em .55em;vertical-align:top;text-align:left}
#sheet th{background:color-mix(in srgb,var(--rh) 10%,rgba(var(--paper),.9));color:var(--rh);white-space:nowrap}
#sheet tr.hl td{background:color-mix(in srgb,var(--zhu) 9%,transparent)} #sheet tr.hl td:first-child{box-shadow:inset 4px 0 0 var(--zhu)}
#sheet .tp-ruby{display:inline-block;font-size:.55em;font-weight:400;color:var(--mute);vertical-align:middle;margin:0 .15em}
#sheet .tp-ruby-col{display:inline-block} #sheet .tp-ruby-char,#sheet .tp-ruby-tone{display:inline}
.def{border-left:4px solid var(--rh);background:color-mix(in srgb,var(--rh) 7%,transparent);padding:.35em .8em;border-radius:0 6px 6px 0}
.qz{margin-top:.6em} .qz .qq{font-size:1.25em;font-weight:700;line-height:1.7;padding:.4em .8em;background:var(--card);border:1px solid var(--line);border-radius:6px;min-height:3.4em}
.qz .qq small{display:block;font-size:.55em;color:var(--mute);font-weight:400}
.qz .ks{display:flex;gap:.5em;margin:.5em 0;flex-wrap:wrap} .qz .ks button{flex:1;min-width:5em;border:2px solid var(--rh);background:rgba(var(--paper),.9);color:var(--rh);border-radius:8px;padding:.3em;font-weight:900;font-size:1.05em}
.qz .ks button.ok{background:#3f6b52;border-color:#3f6b52;color:#fff} .qz .ks button.no{background:#b0796a;border-color:#b0796a;color:#fff;animation:shake .35s}
.qz .fb{min-height:1.6em;color:var(--mute)} .qz .dots{display:flex;gap:.25em;flex-wrap:wrap}
.qz .dots i{width:.55em;height:.55em;border-radius:50%;background:var(--line)} .qz .dots i.ok{background:#3f6b52} .qz .dots i.no{background:#b0796a} .qz .dots i.cur{outline:2px solid var(--rh);outline-offset:2px}
.tb-ctl{display:flex;gap:.4em;align-items:center;flex-wrap:wrap;font-size:.85em;color:var(--mute)}
td.blk{cursor:pointer;color:transparent;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--rh) 12%,transparent) 0 .5em,transparent .5em 1em)}
td.blk.on{color:inherit;background:none} td.blk:not(.on) *{visibility:hidden}
.fnote{font-size:.8em;color:var(--mute);border-top:1px dashed var(--line);margin-top:.6em;padding-top:.4em}
@media (max-width:760px){
  :root{--fs:16px;--ov:5em}
  header{font-size:12px}footer{font-size:12.5px} .logo,.lgs{display:none}
  .pan{padding:0 1.2em;gap:.8em} .card{width:13em}
  .lead{gap:1em;padding:0 1.6em}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="app">
  <header><span class="logo" id="logo">課文畫卷</span><nav id="nav"></nav><span class="sp"></span>
    <button class="tool" id="bMode" title="細讀：每一句依序出注釋字義、句意修辭／通讀：只出課文，其餘點了才出現">細讀</button>
    <button class="tool" id="bSm" title="字小一點">A−</button><button class="tool" id="bLg" title="字大一點">A＋</button>
    <button class="tool" id="bNote" title="講稿（N）：語譯等，只給老師看">講稿</button>
    <button class="tool" id="bNight" title="日／夜">☾</button>
    <button class="tool" id="bFull" title="全螢幕">⛶</button>
    <button class="tool" id="bClose" hidden>✕ 回課文</button></header>
  <div id="view"><div id="roll" class="jump"></div><div id="cap"></div><div id="note"></div></div>
  <footer><button class="tool" id="bPrev">← 上一步</button><span class="pg" id="pg"></span><button class="nx" id="bNext">下一步 ▸</button>

/* ───────── 步驟：畫軸怎麼走，課文就怎麼進行 ───────── */

    B.innerHTML = `<div class="def"><b>定義</b>　${def.replace(/^定義[：:]\s*/, '')}</div>
      <table><tr><th>類型</th><th>說明</th></tr>${R.out.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</table>
      <div class="qz"><div class="qq" id="qq"></div><div class="ks">${x.kinds.map(k => `<button>${k}</button>`).join('')}</div><div class="fb" id="qf"></div><div class="dots" id="qd"></div></div>
      ${x.note ? `<div class="fnote">${x.note}<br>（${x.noteSrc || ''}）</div>` : ''}<div class="fnote">定義、類型與例句：課檔補充框「${x.box}」；本課句子的類型：課檔修辭標註。</div>`;
    let i = 0, res = [];
    const dr = () => { const q = QS[i]; $('#qq').innerHTML = q ? `<small>第 ${i + 1}／${QS.length} 題・${q.src}・這是哪一種${x.name}？</small>${q.t}` : `完成！答對 ${res.filter(r => r === 'ok').length}／${QS.length} 題`;
      $$('.ks button', B).forEach(b => { b.className = ''; b.disabled = !q; }); $('#qd').innerHTML = QS.map((_, k) => `<i class="${res[k] || ''}${k === i ? ' cur' : ''}"></i>`).join(''); };
    $$('.ks button', B).forEach(b => b.onclick = () => { const q = QS[i]; if (!q || B.dataset.lock) return;
      if (b.textContent === q.a) { b.classList.add('ok'); res[i] = res[i] || 'ok'; $('#qf').textContent = '✔ ' + q.a + x.name; B.dataset.lock = 1; setTimeout(() => { delete B.dataset.lock; i++; $('#qf').textContent = ''; dr(); }, 1100); }
      else { b.classList.add('no'); res[i] = 'no'; $('#qf').textContent = '再想想：事情是過去的、未來的，還是此刻想像中的？'; dr(); $$('.ks button', B).find(y => y.textContent === b.textContent).classList.add('no'); } });
    dr();
  } else if (x.type === 'tableBlank') {
    const R = rows(box(x.box)); let bl = x.blank;
    const draw2 = () => { $('#tbb').innerHTML = `<tr>${x.cols.map(c => `<th>${c}</th>`).join('')}</tr>` + R.out.map(r => { const hl = (x.hl || []).some(h => strip(r[1]).includes(h));
      return `<tr class="${hl ? 'hl' : ''}">${r.map((v, j) => `<td class="${j === bl ? 'blk' : ''}">${v}</td>`).join('')}</tr>`; }).join('');
      $$('td.blk', B).forEach(td => td.onclick = () => td.classList.toggle('on')); };
    B.innerHTML = `<div class="tb-ctl"><span>遮住：</span>${x.cols.map((c, j) => `<button class="tool${j === x.blank ? ' on' : ''}" data-b="${j}">${c}</button>`).join('')}<button class="tool" data-b="-1">不遮</button><button class="tool" id="tbAll">全部揭曉</button></div>
      <table id="tbb"></table><div class="fnote">${x.tip || ''}　表格內容：課檔補充框「${x.box}」。</div>`;
    $$('[data-b]', B).forEach(b => b.onclick = () => { bl = +b.dataset.b; $$('[data-b]', B).forEach(y => y.classList.toggle('on', y === b)); draw2(); });
    $('#tbAll').onclick = () => $$('td.blk', B).forEach(td => td.classList.add('on'));
    draw2();
    (x.hl || []).forEach(h => { if (!R.out.some(r => strip(r[1]).includes(h))) console.error('年齡表裡找不到要標的詞：' + h); });
  }
}
/* ───────── 操作 ───────── */
$('#nav').innerHTML = `<button data-p="-1">卷首</button>` + TP.map((p, i) => `<button data-p="${i}">${p.seg}</button>`).join('') + `<button data-p="-2">全卷</button>`;
$$('#nav button').forEach(b => b.onclick = () => { const p = +b.dataset.p; go(p === -1 ? 0 : p === -2 ? STEPS.length - 1 : idx(s => s.t === 'pan' && s.p === p)); });
$('#bNext').onclick = next; $('#bPrev').onclick = prev;
$('#bMode').onclick = e => { st.fast = !st.fast; e.currentTarget.textContent = st.fast ? '通讀' : '細讀'; e.currentTarget.classList.toggle('on', st.fast); if (skip(STEPS[st.i].t)) prev(); else draw(); };
$('#bNight').onclick = e => { e.currentTarget.classList.toggle('on', document.body.classList.toggle('night')); setImgs(); };
$('#bNote').onclick = e => { st.note = !st.note; e.currentTarget.classList.toggle('on', st.note); drawNote(STEPS[st.i]); };
let zoom = 1; try { zoom = +localStorage.getItem('hj_zoom') || 1; } catch (e) {}
const setZoom = z => { zoom = Math.max(.75, Math.min(1.5, Math.round(z * 100) / 100)); document.documentElement.style.setProperty('--zoom', zoom); try { localStorage.setItem('hj_zoom', zoom); } catch (e) {} roll.classList.add('jump'); sizeLians(); draw(); requestAnimationFrame(() => roll.classList.remove('jump')); };
$('#bSm').onclick = () => setZoom(zoom - .1); $('#bLg').onclick = () => setZoom(zoom + .1);
$('#bFull').onclick = () => { const d = document.documentElement; if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d); else document.exitFullscreen && document.exitFullscreen(); };
$('#shX').onclick = closeSheet; $('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
const flip = (k, t) => { (st.ov[k] = st.ov[k] || {})[t] = !layerOn(k, t); };
view.addEventListener('click', e => {
  if (e.target.closest('#note')) return;
  const go2 = e.target.closest('[data-ext]'); if (go2) { openExt(go2.dataset.ext); return; }
  const hb = e.target.closest('.hb'); if (hb) { hb.classList.toggle('on'); return; }
  const ob = e.target.closest('.opts button'); if (ob) { const c = CARDS.find(x => x.id === ob.closest('.card').id), ok = +ob.dataset.i === c.a.ans;
    ob.classList.remove('no'); void ob.offsetWidth; ob.classList.add(ok ? 'ok' : 'no'); if (ok) { st.ov[c.id + ':a'] = true; draw(); } return; }
  const cd = e.target.closest('.card.show'); if (cd) { if (cd.classList.contains('askc')) { const k = cd.id + ':a', a = $('.ans', cd); st.ov[k] = a.classList.contains('off'); draw(); } else if (cd.classList.contains('hbc')) $$('.hb', cd).forEach(x => x.classList.add('on')); return; }
  const pn = e.target.closest('.pn'); if (pn) { const pi = pn.closest('.pan').dataset.p; (st.ov['p' + pi] = st.ov['p' + pi] || {}).pian = !pn.classList.contains('on'); draw(); return; }
  const w = e.target.closest('.lw.show'); if (!w) return next();
  const k = w.dataset.l, an = e.target.closest('.an');
  if (an) { if (an.classList.contains('off')) flip(k, an.dataset.t); else if (an.dataset.r != null) st.rq = st.rq === k + ':' + an.dataset.r ? null : k + ':' + an.dataset.r; else flip(k, an.dataset.t); draw(); return; }
  if (e.target.closest('.nw,.gw')) { flip(k, 'note'); draw(); return; }
  next();
});
document.addEventListener('keydown', e => { const k = e.key;
  if (k === 'n' || k === 'N') { $('#bNote').click(); return; }
  if ($('#sheet').classList.contains('on') && k === 'Escape') { closeSheet(); return; }
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
  else if (k === 'Escape') go(0); });
if (window.parent !== window) { const b = $('#bClose'); b.hidden = false; b.onclick = () => window.parent.postMessage({ lbClose: 1 }, '*'); $('#bFull').hidden = true; }
addEventListener('resize', () => { roll.classList.add('jump'); sizeLians(); draw(); requestAnimationFrame(() => roll.classList.remove('jump')); });
addEventListener('hashchange', () => { const x = location.hash.slice(1); if (/^\d+$/.test(x) && +x !== st.i) go(+x); });
document.documentElement.style.setProperty('--zoom', zoom);
setImgs();
const begin = () => { sizeLians(); const h = location.hash.slice(1); st.i = /^\d+$/.test(h) ? Math.min(+h, STEPS.length - 1) : 0; st.last = st.i; draw(); requestAnimationFrame(() => requestAnimationFrame(() => roll.classList.remove('jump'))); };
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(begin);
window.HJ_DEBUG = { STEPS, LN, CARDS, go, st };
}
</script>
