<!-- 手機講稿（V217 起；V219 改成逐句講稿）
     ・平板投影翻頁 → 這頁跟著跳；平板點了某一句 → 這頁捲到那一句並標亮（位置代號 seg:第三段#2，#後面是句子序號）。
     ・課文頁＝逐句講稿：本段考點（加密講稿）＋每一句的 句意／修辭（短版，長版可展開）、翻譯、提問（含答案與「師」）、統測；
       段末：本段統整、問答、注釋、析。句意修辭提問直接讀網站 data/lessons/NN.js，網站改了這裡自動跟著變。
     ・其他頁（作者、題解、說明頁…）＝該頁考點＋本課總提醒。
     ・講稿內容加密存在 notes.enc.json（AES-GCM，PBKDF2）；正本＝教學系統 OneDrive data/115-1/高職/第一冊/老師講稿_上課提醒.json
       → scripts/RayOclass/tnote_build_20261109.js 加密。位置：Apps Script liveGet（gr-21）。密碼只存這支手機（tn_pass_v1）。 -->

.mi .who i{font-style:normal;font-size:14px;border-radius:6px;padding:1px 7px;background:var(--cgb);color:var(--cg);font-weight:700}
.mi .who i.sub{background:var(--ctb);color:var(--ct);font-weight:400}
.mi .who i.lv{background:var(--cab);color:var(--ca);font-weight:400}
.stu{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 6px}
.stu .n{flex:none;font-weight:800;min-width:5.5em}
.stu .l{flex:1;font-size:14px;color:var(--mut)}
.pw{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
.pw input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:8px 0;font-size:17px}
.muted{color:var(--mut);font-size:14px}
/* ── 練習／習作／A卷 答案頁 ── */
.qz .qn{color:var(--mut);font-size:13px}
.qz .stem{font-size:17px;font-weight:600;line-height:1.6}
.ops{list-style:none;margin:6px 0 0;padding:0}
.ops li{padding:5px 8px;border-radius:8px;margin:3px 0;font-size:15.5px}
.ops li.ok{background:var(--cmb);border-left:5px solid var(--cm);font-weight:700}
.ops li.ok>.ol:after{content:" ✓";color:var(--cm)}
.ops .oe{font-weight:400;font-size:14px;color:var(--mut);margin-top:2px}
.ansb{display:inline-block;background:var(--cm);color:#fff;border-radius:8px;padding:1px 10px;font-weight:800;margin-right:6px}
.psg{font-size:14.5px;color:var(--mut);line-height:1.75;margin-top:6px}
.psg>summary{color:var(--pri);font-weight:700}
.wtab{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0;display:block;overflow-x:auto}
.wtab th,.wtab td{border:1px solid var(--line);padding:4px 6px;vertical-align:top}
.wk-a{color:var(--cm);font-weight:800}
.sech{font-weight:800;color:var(--pri);margin:4px 0 6px}
.snote{font-size:14px;color:var(--mut);margin-bottom:4px}
.home{font-size:17px;padding:4px 11px}
</style>
</head>
<body>
<div id="lock" class="lock hide">
  <div style="font-size:40px">🔒</div>
  <div style="font-weight:700;font-size:20px">講稿</div>
  <div style="color:var(--mut);font-size:14px">輸入講稿密碼（只存在這支手機）</div>
  <input id="pass" type="password" autocomplete="current-password" enterkeyhint="go">
  <div id="perr" class="err"></div>
  <button class="go" id="pgo" type="button">打開</button>
</div>

<!-- V223（老師 11/10）封面：開始上課、備課、考試日曆、缺交；版本號 -->
<div id="cover" class="cover hide">
  <div class="cv-top">
    <div class="cv-date" id="cvDate"></div>
    <div class="seal" aria-hidden="true"><span>瑞</span><span>媛</span><span>講</span><span>稿</span></div>
  </div>
  <div class="cv-title">無腦上課</div>
  <div class="cv-sub">逐句　考點　同步平板</div>
  <button class="cv-go" id="cvGo" type="button">開始上課<small>手機跟著平板投影跳頁、捲到那一句</small></button>
  <div class="cv-grid">
    <button class="cv-card" id="cvPrep" type="button"><div class="ic">備課</div><div class="nm">自己翻</div><div class="ds">不開平板，選課選頁看講稿</div></button>
    <button class="cv-card" id="cvCal" type="button"><div class="ic">考試</div><div class="nm">日曆</div><div class="ds" id="cvCalDs">各班考試、交作業</div></button>
    <button class="cv-card" id="cvMiss" type="button"><div class="ic">考卷</div><div class="nm">缺交</div><div class="ds" id="cvMissDs">依考卷／依學生</div></button>
    <button class="cv-card" id="cvKey" type="button"><div class="ic">考點</div><div class="nm" id="cvKeyNm">已上鎖</div><div class="ds" id="cvKeyDs">點這裡輸入講稿密碼</div></button>
  </div>
  <div class="cv-today" id="cvToday"><div class="h">今日</div><div class="muted">輸入登記密碼後顯示今天的考試／作業</div></div>
  <div class="cv-foot"><span>無腦上課 <span class="ver" id="cvVer"></span></span><span><button class="btn" id="cvTheme" type="button">◐</button> <button class="btn" id="cvReload" type="button">↻ 更新</button></span></div>
</div>

<div id="panel" class="hide">
  <div class="pnl">
    <div class="pnl-h"><button class="btn home" id="pnlBack" type="button">⌂</button><div class="t" id="pnlT"></div><button class="btn" id="pnlRe" type="button">↻</button></div>
    <div id="pnlB"></div>
  </div>
</div>

<div id="app" class="hide">
  <div class="top">
    <div class="row">
      <div class="live"><i class="dot" id="dot"></i><span id="lv">連線中…</span></div>
      <button class="btn on" id="follow" type="button">跟著平板</button>
    </div>
    <div class="where"><div class="ls" id="wls"></div><div class="pg" id="wpg"></div></div>
    <div class="flt" id="flt"><button type="button" class="c-m" data-c="m">句意</button><button type="button" class="c-w" data-c="w">字義</button><button type="button" class="c-r" data-c="r">修辭</button><button type="button" class="c-t" data-c="t">翻譯</button><button type="button" class="c-a" data-c="a">提問</button><button type="button" class="c-g" data-c="g">考點</button></div>
  </div>
  <main id="main"></main>
  <div class="bar">
    <button class="btn home" id="homeb" type="button" title="回封面">⌂</button>
    <select id="lsel" aria-label="選課"></select>
    <button class="btn fs" id="fsm" type="button" title="字小一點">A−</button><button class="btn fs" id="fsp" type="button" title="字大一點">A+</button>
    <button class="btn hide" id="theme" type="button" title="深淺色">◐</button>
    <button class="btn" id="lockb" type="button">鎖上</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var GS_URL = 'https://script.google.com/macros/s/AKfycbxfJoT1iS5tIzXtShetthjspMQ-yUwgUkiPfWc2nBEDNwYgs49u87eKvAJo5x73k7K1/exec';
  var PASS_K = 'tn_pass_v1', THEME_K = 'tn_theme_v1', POLL = 2500;
  var LESSON_FILE = { '論語選—子路曾皙冉有公西華侍坐': '01', '桃花源記': '07', '樂府詩選—長干行': '30', '茫茫人海中的一名女孩': '31', '極短篇小說選': '32' };
  var $ = function (id) { return document.getElementById(id); };
  function lget(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lrm(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>'); }

  /* ── 主題 ── */
  function applyTheme() { var t = lget(THEME_K); if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
  applyTheme();
  $('theme').onclick = function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!lget(THEME_K) && matchMedia('(prefers-color-scheme: dark)').matches);
    lset(THEME_K, dark ? 'light' : 'dark'); applyTheme();
  };

  /* ── V222 分類開關（只看某幾類）與字級；都記在這支手機 ── */
  var SHOW_K = 'tn_hide_v1', FS_K = 'tn_fs_v1';
  function hidden() { try { return JSON.parse(lget(SHOW_K) || '[]'); } catch (e) { return []; } }
  function applyShow() {
    var hs = hidden(), m = $('main');
    ['m', 'w', 'r', 't', 'a', 'g'].forEach(function (c) { m.classList.toggle('no-' + c, hs.indexOf(c) >= 0); });
    var bs = $('flt').querySelectorAll('button'); for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('off', hs.indexOf(bs[i].getAttribute('data-c')) >= 0);
  }
  $('flt').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var c = b.getAttribute('data-c'), hs = hidden(), i = hs.indexOf(c);
    if (i >= 0) hs.splice(i, 1); else hs.push(c);
    lset(SHOW_K, JSON.stringify(hs)); applyShow();
    if (S.li >= 0) { var li = S.li; S.li = -2; markLine(li); }   /* 收起某類後，目前那句仍留在畫面上 */
  });
  function applyFs() { var z = parseFloat(lget(FS_K)) || 1; $('main').style.zoom = z; }
  function bumpFs(d) { var z = Math.round(((parseFloat(lget(FS_K)) || 1) + d) * 10) / 10; z = Math.max(0.8, Math.min(1.6, z)); lset(FS_K, String(z)); applyFs(); }
  $('fsm').onclick = function () { bumpFs(-0.1); };
  $('fsp').onclick = function () { bumpFs(0.1); };
  applyShow(); applyFs();

  /* ── 解密 ── */
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  var ENC = null;
  function loadEnc() {
    if (ENC) return Promise.resolve(ENC);
    return fetch('notes.enc.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('講稿檔讀不到（HTTP ' + r.status + '）'); return r.json(); })
      .then(function (j) { ENC = j; return j; });
  }
  function decrypt(pass) {
    return loadEnc().then(function (e) {
      return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']).then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(e.salt), iterations: e.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      }).then(function (key) {
        var raw = b64(e.ct), tag = b64(e.tag), all = new Uint8Array(raw.length + tag.length); all.set(raw); all.set(tag, raw.length);
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(e.iv) }, key, all);
      }).then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
    });
  }

  /* ── 網站課文資料（句意、修辭、提問…）── */
  var TB = {}, tbLoading = {}, idxP = null;
  function idxHtml() { if (!idxP) idxP = fetch('../index.html', { cache: 'no-store' }).then(function (r) { return r.text(); }).catch(function () { return ''; }); return idxP; }
  function loadLesson(k) {
    if (TB[k] || tbLoading[k] || !LESSON_FILE[k]) return;
    tbLoading[k] = 1; var f = LESSON_FILE[k];
    idxHtml().then(function (html) {
      var m = html.match(new RegExp('data/lessons/' + f + '\\.js\\?v=([0-9a-f]+)'));
      var s = document.createElement('script');
      s.src = '../data/lessons/' + f + '.js' + (m ? '?v=' + m[1] : '?t=' + Date.now());
      s.onload = function () { var hit = (window.TB_LESSONS || []).filter(function (x) { return x[0] === k; })[0]; TB[k] = hit ? hit[1] : {}; render(); };
      s.onerror = function () { TB[k] = {}; };
      document.head.appendChild(s);
    });
  }
  function clean(html) {   /* 網站 HTML：拿掉按鈕、onclick；答案全部顯示 */
    var doc = new DOMParser().parseFromString('<div>' + String(html || '') + '</div>', 'text/html'), root = doc.body.firstChild;
    root.querySelectorAll('script,button,style,a.tp-more').forEach(function (e) { e.remove(); });
    root.querySelectorAll('*').forEach(function (e) { for (var i = e.attributes.length - 1; i >= 0; i--) { var n = e.attributes[i].name; if (/^on/i.test(n)) e.removeAttribute(n); } });
    return root.innerHTML;
  }
  function plain(t) {   /* 課文：{n:18|方六、七十}→方六、七十；{g:春服|解釋}→春服 */
    t = String(t || '');
    for (var i = 0; i < 3; i++) t = t.replace(/\{([a-z]+):([^{}|]*)(?:\|([^{}]*))?\}/g, function (m, ty, a, b) { return /^\d+$/.test(a) ? (b || '') : a; });
    return t.replace(/<[^>]+>/g, '');
  }
  function pageOf(k, seg) { var d = TB[k]; if (!d || !d.textPages) return null; return d.textPages.filter(function (p) { return p.seg === seg; })[0] || null; }

  /* ── 狀態 ── */
  var D = null, S = { follow: true, pos: null, viewK: '', viewId: '', err: '', li: -1, rendered: '' };
  function lessonOf(k) { if (!D) return null; for (var i = 0; i < D.lessons.length; i++) if (D.lessons[i].k === k) return D.lessons[i]; return null; }
  function anchorOf(L, id) { if (!L || !id) return null; for (var i = 0; i < L.anchors.length; i++) { var a = L.anchors[i]; if (a.id === id || (a.ids && a.ids.indexOf(id) >= 0)) return a; } return null; }
  function splitId(id) { var m = String(id || '').match(/^(.*?)(?:#(\d+))?$/); return { id: m[1], li: m[2] == null ? -1 : +m[2] }; }

  var TAG = { tc: '統測', aq: 'A卷有考', jia: '甲卷', wb: '習作', basic: '課本練習', ex: '延伸', tip: '提醒' };
  function noteHTML(n) {
    var tags = (n.tag || ['tip']).map(function (t) { return '<span class="tag ' + esc(t) + '">' + esc(TAG[t] || t) + '</span>'; }).join('');
    return '<div class="card note"><div class="tags">' + tags + '</div><div class="t">' + fmt(n.t) + '</div>' +
      (n.say ? '<div class="say">' + fmt(n.say) + '</div>' : '') + (n.src ? '<div class="src">' + fmt(n.src) + '</div>' : '') + '</div>';
  }
  /* V220（老師 11/9）：全部預設展開；短版在前、長版接在下面 */
  function shortLong(kcls, kname, shortHtml, longHtml) {
    if (!longHtml || shortHtml === longHtml) return '<div class="it c-' + kcls + '"><span class="k ' + kcls + '">' + kname + '</span>' + (shortHtml || longHtml) + '</div>';
    return '<div class="it c-' + kcls + '"><details open><summary><span class="k ' + kcls + '">' + kname + '</span>' + shortHtml + '<span class="more">長版▸</span></summary><div class="long">' + longHtml + '</div></details></div>';
  }
  function askBlock(asks, askT, label) {
    return '<div class="it c-a"><span class="k a">' + esc(label || '提問') + '</span>' +
      '<div class="qbody">' + asks.map(clean).join('') + (askT ? '<div class="teach">' + clean(askT) + '</div>' : '') + '</div></div>';
  }
  /* 這一句的字義：課文裡的 {n:號|字}（對注釋 P.notes）與 {g:字|解釋} */
  function wordsOf(l, P) {
    var out = [], st = P.noteStart || 1, t = String(l.text || ''), m, re = /\{([a-z]+):([^{}|]*)\|([^{}]*)\}/g;
    while ((m = re.exec(t))) {
      if (/^\d+$/.test(m[2])) { var n = (P.notes || [])[+m[2] - st]; if (n) out.push([n[0], n[1]]); }
      else if (m[1] === 'g') out.push([m[2], m[3]]);
    }
    return out;
  }

  /* 逐句講稿（課文頁） */
  function segHTML(L, A, P) {
    var h = '';
    /* V220 順序（老師 11/9）：每一句 句意→字義→修辭→翻譯→提問（全部展開）；段末統整、問答、析；本段考點放最後 */
    if (P.pian) h += '<div class="pian"><b>段旨</b>　' + clean(P.pian) + '</div>';
    (P.lines || []).forEach(function (l, i) {
      var b = '<div class="ln" data-li="' + i + '"><div class="tx"><span class="no">' + (i + 1) + '</span>' + esc(plain(l.text)) + '</div>';
      if (l.mean) b += shortLong('m', '句意', (l.cite ? '<span class="cite">' + clean(l.cite) + '──</span>' : '') + clean(l.meanShort || l.mean), l.meanShort ? clean(l.mean) : '');
      if (l.mean2) b += shortLong('m', '句意', (l.cite2 ? '<span class="cite">' + clean(l.cite2) + '──</span>' : '') + clean(l.mean2Short || l.mean2), l.mean2Short ? clean(l.mean2) : '');
      var ws = wordsOf(l, P);
      if (ws.length) b += '<div class="it c-w"><span class="k w">字義</span><div class="words">' + ws.map(function (w) { return '<div><b>' + clean(w[0]) + '</b>：' + clean(w[1]) + '</div>'; }).join('') + '</div></div>';
      (l.rhet || []).forEach(function (r, ri) {
        var sh = l.rhetShort && l.rhetShort[ri];
        b += shortLong('r', '修辭', '<b>' + esc(r[0]) + '</b>　' + (sh ? clean(sh) : clean(r[1])), sh ? clean(r[1]) : '');
      });
      (l.style || []).forEach(function (r) { b += '<div class="it c-s"><span class="k s">筆法</span><b>' + clean(r[0]) + '</b>　' + clean(r[1]) + '</div>'; });
      if (l.tr) b += '<div class="it c-t"><span class="k t">翻譯</span><span class="trx">' + clean(l.tr) + '</span></div>';
      if (l.ask && l.ask.length) b += askBlock(l.ask, l.askT, '提問');
      if (l.tongT) b += '<div class="it c-g"><span class="k g">統測</span>' + clean(l.tongT) + '</div>';
      h += b + '</div>';
    });
    if (P.ask && P.ask.length) h += '<div class="ln">' + askBlock(P.ask, P.askT, P.askLabel || '本段統整') + '</div>';
    (P.boxes || []).forEach(function (bx) { h += '<div class="ln">' + askBlock(bx.ask || [], bx.askT, bx.label || '統整') + '</div>'; });
    if (P.qa && P.qa.length) h += '<div class="ln blkln c-a"><span class="k a">問答</span>' + P.qa.map(function (q, i) { return '<div class="it"><b>' + (i + 1) + '. ' + clean(q[0]) + '</b><div class="qa-a">' + clean(q[1]) + '</div></div>'; }).join('') + '</div>';
    if (P.xi) h += '<div class="ln blkln c-t"><span class="k t">析</span>' + clean(P.xi) + '</div>';
    if (A && A.notes.length) h += '<div class="kdz"><div class="sec-h kh">★ 本段考點（' + A.notes.length + '）</div>' + A.notes.map(noteHTML).join('') + '</div>';
    if (!unlocked) h += lockedHTML();
    return h;
  }

  function lockedHTML() {
    return '<div class="sec-h kh">考點</div><div class="card"><div style="font-size:15px;color:var(--mut);margin-bottom:8px">🔒 考點已上鎖（學生打開這頁也看不到）。用老師的專屬網址打開會自動解鎖，或在這裡輸入一次講稿密碼。</div>' +
      '<div class="row"><input class="unlock-in" type="password" autocomplete="current-password" style="flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)">' +
      '<button type="button" class="btn on unlock-go">解鎖</button></div></div>';
  }
  function pageList(L) {   /* 本課所有頁：課文段落（網站資料）＋有講稿的說明頁 */
    var seen = {}, list = [];
    var d = TB[L.k];
    if (d && d.textPages) d.textPages.forEach(function (p) { var id = 'seg:' + p.seg, a = anchorOf(L, id); seen[id] = 1; list.push({ id: id, h: a ? a.h : p.seg, n: a ? a.notes.length : 0 }); });
    L.anchors.forEach(function (a) { if (!seen[a.id]) { seen[a.id] = 1; list.push({ id: a.id, h: a.h, n: a.notes.length }); } });
    if (d) {   /* V223：課後習題、習作、A卷（點了看題目＋答案＋解析） */
      if (d.basicQ && d.basicQ.length) list.push({ id: 'qall:', h: '課後習題　基礎練習（' + d.basicQ.length + ' 題）' });
      (d.advQ || []).forEach(function (sec) { list.push({ id: 'iadv:' + (sec.head || ''), h: '課後習題　' + plain(sec.head || '進階練習') }); });
      if (d.workbook) { list.push({ id: 'work_answers:', h: '習作　答案總覽' }); (d.workbook.sections || []).forEach(function (sec) { list.push({ id: 'work:' + (sec.head || ''), h: '習作　' + plain(sec.head || '') }); }); }
      if (d.aQuiz || d.aHand) list.push({ id: 'asheet:', h: 'A卷　全部答案' + (unlocked ? '' : '（考點解鎖後才看得到）') });
    }
    return list;
  }

  /* ── V223（老師 11/10「能同步到課後習題、習作、A卷講解嗎」）：題目＋答案＋解析
     資料＝網站 data/lessons/NN.js（網站改了這裡跟著變）；A卷要先解鎖考點才顯示 ── */
  function quizHTML(q, tag) {
    var stem = q.q || q.stem || '', ans = String(q.ans || ''), per = q.per || {};
    var h = '<div class="ln qz"><div class="qn">' + esc(tag || '') + ' 第 ' + esc(q.n) + ' 題</div>';

    getLoad().then(function (ld) {
      var n = 0; CLS.forEach(function (c) { n += missOf(ld, c).total; });
      $('cvMissDs').innerHTML = '四班共 <b>' + n + '</b> 件未交';
    }).catch(function () {});
  }
  function evName(e) {
    var les = (e.lessons || []).map(function (n) { return 'L' + n + (LES[n] ? LES[n] : ''); }).join('、');
    return String(e.item || '').replace('課後習題', '課本後習題') + (les ? '（' + les + '）' : '');
  }

  /* ── 面板共用 ── */
  function panel(title, body) { $('pnlT').textContent = title; $('pnlB').innerHTML = body; go('panel'); }
  function pwHTML(msg) {
    return '<div class="pw"><b>輸入登記密碼</b><div class="muted">成績系統的那組密碼。只存在這支手機，只用來讀日曆和缺交，不會改任何資料。</div>' +
      '<input id="grIn" type="password" autocomplete="current-password" enterkeyhint="go"><div class="err" id="grErr">' + esc(msg || '') + '</div>' +
      '<button class="cv-go" id="grGo" type="button" style="font-size:18px;letter-spacing:.2em;margin:6px 0 0;padding:10px">確定</button></div>';
  }
  var PNL = '';
  function needPw(then, msg) {
    $('pnlB').innerHTML = pwHTML(msg);
    $('grGo').onclick = function () {
      var p = $('grIn').value.trim(); if (!p) return;
      $('grErr').textContent = '確認中…';
      api({ action: 'check', pw: p }).then(function (r) {
        if (r && r.admin) { lset(GRPW_K, p); then(); } else $('grErr').textContent = '密碼不對';
      }).catch(function () { $('grErr').textContent = '連不上，稍後再試'; });
    };
  }
  function fail(e, again) {
    if (e && e.message === 'nopw') needPw(again);
    else $('pnlB').innerHTML = '<div class="empty">' + esc((e && e.message) || '讀不到') + '</div>';
  }

  /* ── 考試日曆（只看）── */
  var calCls = '';
  function showCal(force) {
    PNL = 'cal'; panel('考試日曆', '<div class="empty">讀取中…</div>');
    getCal(force).then(function (a) {
      var td = ymd(new Date()), from = ymd(new Date(Date.now() - 3 * 86400000)), to = ymd(new Date(Date.now() + 28 * 86400000));
      var h = '<div class="seg" id="calSeg">' + ['', ...CLS].map(function (c) { return '<button type="button" data-c="' + c + '" class="' + (c === calCls ? 'on' : '') + '">' + (c || '全部') + '</button>'; }).join('') + '</div>';
      var list = a.filter(function (e) { return e.date >= from && e.date <= to && (!calCls || e.cls === calCls); })
        .sort(function (x, y) { return x.date < y.date ? -1 : x.date > y.date ? 1 : CLS.indexOf(x.cls) - CLS.indexOf(y.cls); });
      var last = '';
      list.forEach(function (e) {
        if (e.date !== last) { last = e.date; h += '<div class="day' + (e.date === td ? ' today' : '') + '">' + md(e.date) + '（' + WD[pd(e.date).getDay()] + '）' + (e.date === td ? '<small>今天</small>' : e.date < td ? '<small>已過</small>' : '') + '</div>'; }
        var kc = e.kind === '交作業' ? 'hw' : e.kind === '檢討' ? 'rv' : '';
        h += '<div class="ev" style="--cc:' + ccol(e.cls) + '"><span class="cl">' + esc(e.cls) + '</span><div class="w"><span class="kd ' + kc + '">' + esc(e.kind || '') + '</span>' + esc(evName(e)) +
          (e.note ? '<div class="nt">' + esc(e.note) + '</div>' : '') + '</div></div>';
      });
      if (!list.length) h += '<div class="empty">這段期間（前 3 天～後 4 週）沒有項目</div>';
      h += '<div class="muted" style="margin-top:14px">只看不改；要新增或改日期請到教學網站的日曆。</div>';
      $('pnlB').innerHTML = h;
      $('calSeg').onclick = function (ev) { var b = ev.target.closest('button'); if (!b) return; calCls = b.getAttribute('data-c'); showCal(); };
    }).catch(function (e) { fail(e, function () { showCal(true); }); });
  }

  /* ── 缺交 ── */
  var TRANS_MAX = 3, TRANS_MIN = 10;
  function lesNums(it) {
    var L = String(it.lessons || '').split(',').filter(Boolean).map(Number), m = /L(\d+)/.exec(it.title || '');
    return L.length ? L : (m ? [m[1].length >= 3 ? +m[1].slice(0, 2) : +m[1]] : []);
  }
  function isTrans(it) { var L = lesNums(it); return L.length > 0 && L.every(function (n) { return n >= 1 && n <= TRANS_MAX; }); }
  function missOf(ld, c) {
    var td = ymd(new Date());
    var stu = (ld.students || []).filter(function (s) { return s.cls === c && String(s.active) !== '0'; }).sort(function (a, b) { return a.seat - b.seat; });
    var sc = {}; (ld.scores || []).forEach(function (s) { if (s.cls === c) (sc[s.item] = sc[s.item] || {})[+s.seat] = s; });
    var out = [], open = [], wait = [], total = 0;
    (ld.items || []).filter(function (it) { return it.cls === c && it.type !== '態度'; }).forEach(function (it) {
      var due = it.due || it.issued || '';
      var m = sc[it.id] || {}, n = 0; Object.keys(m).forEach(function (k) { if (String(m[k].raw || '') !== '') n++; });
      if (!due || due >= td) { open.push(it); return; }
      if (isTrans(it) ? n < TRANS_MIN : n === 0) { wait.push(it); return; }
      var miss = [], sub = [], lv = [];
      stu.forEach(function (s) {
        var x = m[+s.seat];
        if (x && String(x.raw || '') !== '') return;
        if (x && x.sub) sub.push(s); else if (x && x.leave) lv.push(s); else miss.push(s);
      });
      total += miss.length;
      out.push({ it: it, due: due, miss: miss, sub: sub, lv: lv });
    });
    out.sort(function (a, b) { return a.due < b.due ? 1 : a.due > b.due ? -1 : 0; });
    return { list: out, open: open, wait: wait, total: total, stu: stu };
  }
  var missCls = CLS[0], missTab = 'item';
  function showMiss(force) {
    PNL = 'miss'; panel('缺交狀況', '<div class="empty">讀取中…</div>');
    getLoad(force).then(function (ld) {
      var R = missOf(ld, missCls);
      var h = '<div class="seg" id="mcSeg">' + CLS.map(function (c) { var t = missOf(ld, c).total; return '<button type="button" data-c="' + c + '" class="' + (c === missCls ? 'on' : '') + '">' + c + (t ? ' <span class="cnt">' + t + '</span>' : '') + '</button>'; }).join('') + '</div>' +
        '<div class="seg" id="mtSeg"><button type="button" data-t="item" class="' + (missTab === 'item' ? 'on' : '') + '">依考卷</button><button type="button" data-t="stu" class="' + (missTab === 'stu' ? 'on' : '') + '">依學生</button></div>';
      var nm = function (s) { return esc(s.seat) + ' ' + esc(s.name); };
      if (missTab === 'item') {
        var has = R.list.filter(function (x) { return x.miss.length || x.sub.length || x.lv.length; }), ok = R.list.filter(function (x) { return !(x.miss.length || x.sub.length || x.lv.length); });
        has.forEach(function (x) {
          h += '<div class="mi"><div class="h"><b>' + esc(x.it.title || x.it.type) + (x.miss.length ? '<span class="cnt">缺 ' + x.miss.length + '</span>' : '<span class="cnt z">齊</span>') + '</b><span>' + esc(x.it.type) + '｜期限 ' + md(x.due) + '</span></div>' +
            '<div class="who">' + x.miss.map(function (s) { return '<i>' + nm(s) + '</i>'; }).join('') +
            x.sub.map(function (s) { return '<i class="sub">' + nm(s) + '（已交待登分）</i>'; }).join('') +
            x.lv.map(function (s) { return '<i class="lv">' + nm(s) + '（請假）</i>'; }).join('') + '</div></div>';
        });
        if (!has.length) h += '<div class="empty">這班過期限的考卷都交齊了 🎉</div>';
        if (ok.length) h += '<details class="blk"><summary>已交齊（' + ok.length + '）</summary>' + ok.map(function (x) { return '<div class="muted">' + esc(x.it.title || x.it.type) + '｜' + md(x.due) + '</div>'; }).join('') + '</details>';
      } else {
        var by = {};
        R.list.forEach(function (x) { x.miss.forEach(function (s) { (by[s.seat] = by[s.seat] || { s: s, a: [] }).a.push(x); }); });
        var arr = Object.keys(by).map(function (k) { return by[k]; }).sort(function (a, b) { return b.a.length - a.a.length || a.s.seat - b.s.seat; });
        arr.forEach(function (o) {
          h += '<div class="stu"><span class="n">' + nm(o.s) + '</span><span class="cnt">' + o.a.length + '</span><span class="l">' + o.a.map(function (x) { return esc(x.it.title || x.it.type) + '（' + md(x.due) + '）'; }).join('、') + '</span></div>';
        });
        if (!arr.length) h += '<div class="empty">這班沒有人缺交 🎉</div>';
      }
      if (R.open.length) h += '<details class="blk"><summary>還沒到期限（' + R.open.length + '）</summary>' + R.open.map(function (it) { return '<div class="muted">' + esc(it.title || it.type) + '｜期限 ' + md(it.due || it.issued) + '</div>'; }).join('') + '</details>';
      if (R.wait.length) h += '<details class="blk"><summary>過期限但還沒登分（' + R.wait.length + '）</summary><div class="muted">全班都沒分數（或 L1～L3 不到 10 人有分數），先不算缺交。</div>' + R.wait.map(function (it) { return '<div class="muted">' + esc(it.title || it.type) + '｜' + md(it.due || it.issued) + '</div>'; }).join('') + '</details>';
      h += '<div class="muted" style="margin-top:12px">規則同成績系統：過期限、沒分數、沒繳交日、沒請假＝缺交。只看不改。</div>';
      $('pnlB').innerHTML = h;
      $('mcSeg').onclick = function (ev) { var b = ev.target.closest('button'); if (!b) return; missCls = b.getAttribute('data-c'); showMiss(); };
      $('mtSeg').onclick = function (ev) { var b = ev.target.closest('button'); if (!b) return; missTab = b.getAttribute('data-t'); showMiss(); };
    }).catch(function (e) { fail(e, function () { showMiss(true); }); });
  }

  /* ── 按鈕 ── */
  $('cvGo').onclick = function () { S.follow = true; render(); go('app'); };
  $('cvPrep').onclick = function () { S.follow = false; render(); go('app'); };
  $('cvCal').onclick = function () { showCal(); };
  $('cvMiss').onclick = function () { showMiss(); };
  $('cvKey').onclick = function () { $('lockb').click(); };
  $('cvTheme').onclick = function () { $('theme').click(); };
  $('cvReload').onclick = function () { location.replace(location.pathname + '?t=' + Date.now() + location.hash); };
  $('homeb').onclick = function () { go('cover'); };
  $('pnlBack').onclick = function () { go('cover'); };
  $('pnlRe').onclick = function () { if (PNL === 'cal') showCal(true); else if (PNL === 'miss') showMiss(true); };

  start(BASE); go('cover');
  var key0 = hashKey() || lget(PASS_K);
  if (key0) tryPass(key0, true);
})();
</script>
</body>
</html>
