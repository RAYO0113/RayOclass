<title>講稿</title>
<!-- 手機講稿（V217 起；V219 改成逐句講稿）
     ・平板投影翻頁 → 這頁跟著跳；平板點了某一句 → 這頁捲到那一句並標亮（位置代號 seg:第三段#2，#後面是句子序號）。
     ・課文頁＝逐句講稿：本段考點（加密講稿）＋每一句的 句意／修辭（短版，長版可展開）、翻譯、提問（含答案與「師」）、統測；
       段末：本段統整、問答、注釋、析。句意修辭提問直接讀網站 data/lessons/NN.js，網站改了這裡自動跟著變。
     ・其他頁（作者、題解、說明頁…）＝該頁考點＋本課總提醒。
     ・講稿內容加密存在 notes.enc.json（AES-GCM，PBKDF2）；正本＝教學系統 OneDrive data/115-1/高職/第一冊/老師講稿_上課提醒.json
       → scripts/RayOclass/tnote_build_20261109.js 加密。位置：Apps Script liveGet（gr-21）。密碼只存這支手機（tn_pass_v1）。 -->
<style>

:root[data-theme="dark"]{--bg:#1d1916;--card:#2a2420;--ink:#efe6dc;--mut:#a8998c;--line:#3d352f;--pri:#e59a6d;--pri2:#3d2c22;
  --tc:#ff8f86;--tcbg:#47231f;--aq:#f2b25c;--aqbg:#42311a;--jia:#b5a6f0;--jiabg:#302a47;--wb:#7fd1a8;--wbbg:#1f3b2f;--ex:#8cc3ea;--exbg:#1d3343;--say:#332d1d;--saybd:#6b5c2a;--hl:#4a3f12}

  --tc:#ff8f86;--tcbg:#47231f;--aq:#f2b25c;--aqbg:#42311a;--jia:#b5a6f0;--jiabg:#302a47;--wb:#7fd1a8;--wbbg:#1f3b2f;--ex:#8cc3ea;--exbg:#1d3343;--say:#332d1d;--saybd:#6b5c2a;--hl:#4a3f12}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button,summary{cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.row{display:flex;align-items:center;gap:8px}
.live{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:#aaa;flex:none}

.btn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.where{margin-top:6px}
.where .ls{font-size:13px;color:var(--mut)}
.where .pg{font-size:21px;font-weight:700;line-height:1.35}
main{padding:12px 16px 120px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px}
.tag.tc{color:var(--tc);background:var(--tcbg)}.tag.aq{color:var(--aq);background:var(--aqbg)}
.tag.jia{color:var(--jia);background:var(--jiabg)}.tag.wb{color:var(--wb);background:var(--wbbg)}
.tag.ex{color:var(--ex);background:var(--exbg)}.tag.tip{color:var(--pri);background:var(--pri2)}.tag.basic{color:var(--mut);background:var(--line)}
.note .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.note .t{font-weight:600}

.sec-h{font-size:14px;color:var(--mut);margin:20px 0 8px;font-weight:700;letter-spacing:.05em}
.empty{color:var(--mut);text-align:center;padding:18px 0}
details>summary{list-style:none}

details.all{margin-top:8px}
details.all>summary{color:var(--pri);font-weight:700;padding:6px 0}
.alist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 4px}
.alist button.cur{color:var(--pri);font-weight:700}
.alist small{color:var(--mut);margin-left:6px}
.lock{max-width:420px;margin:12vh auto 0;padding:0 16px;text-align:center}
.lock input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:14px 0 10px;font-size:18px;text-align:center}

/* ── 逐句講稿 ── */
.pian{font-size:15px;color:var(--mut);margin:0 0 10px}

.ln .tx .no{display:inline-block;min-width:1.4em;color:var(--mut);font-size:13px;font-weight:400}
.it{margin-top:7px;font-size:15.5px}
.k{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:0 6px;margin-right:5px;vertical-align:1px}
.k.w{color:#fff;background:#8a6d1f}.words{margin-top:2px}.words div{padding:1px 0}.trx{color:var(--mut)}
.sec-h.kh{color:var(--tc);font-size:16px;border-top:2px solid var(--line);padding-top:12px}
.k.m{color:#fff;background:#3f7d5c}.k.r{color:#fff;background:#b0563a}.k.t{color:#fff;background:#6d6157}.k.a{color:#fff;background:#3d6aa8}.k.g{color:#fff;background:#b3261e}.k.s{color:#fff;background:#7a5aa6}

.tp-rq,.rq-hi{font-weight:700;text-decoration:underline;text-decoration-color:var(--pri);text-underline-offset:3px}
details.ask>summary{color:#3d6aa8;font-weight:600}
details.ask>summary .cnt{font-size:12px;color:var(--mut);font-weight:400;margin-left:4px}
.qbody{margin-top:6px;border-left:3px solid #3d6aa8;padding-left:8px}
.qbody .gd{margin-bottom:8px}
.qbody .gd-q{font-weight:700}
.qbody .gd-tag{display:inline-block;min-width:1.5em;color:var(--pri);font-weight:700}
.qbody .gd-s{padding:4px 0;border-top:1px dashed var(--line)}
.qbody .gd-sq{display:block}
.qbody .gd-sq:before{content:"問　";color:var(--mut);font-size:12px}
.qbody .gd-sa{display:block;color:var(--wb);font-weight:600}
.qbody .gd-sa:before{content:"答　";color:var(--mut);font-size:12px;font-weight:400}
.qbody .gd-end{margin-top:5px;background:var(--say);border-left:4px solid var(--saybd);border-radius:6px;padding:5px 9px}
.qbody .gd-ek{display:block;font-size:12px;color:var(--mut)}
.qbody table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0;display:block;overflow-x:auto}
.qbody th,.qbody td{border:1px solid var(--line);padding:4px 6px;vertical-align:top}
.qbody .jy-blank-ph{display:none}.qbody .jy-blank-ans{color:var(--wb);font-weight:600}
.qbody .teach{margin-top:6px;border-top:2px solid var(--line);padding-top:6px;font-size:14.5px}
.qbody .teach:before{content:"師";display:inline-block;background:var(--pri);color:#fff;border-radius:6px;padding:0 6px;font-size:12px;margin-bottom:3px}
.qbody .tk-core,.qbody .tk-open{margin:3px 0}
.qbody .tk-k{font-size:12px;font-weight:700;border-radius:6px;padding:0 6px;margin-right:4px;color:var(--tc);background:var(--tcbg)}
.qbody .tk-open .tk-k{color:var(--ex);background:var(--exbg)}
.qbody .tk-sep{border-top:1px dashed var(--line);margin:6px 0}
.qa-a{color:var(--wb);font-weight:600}
.notes div{font-size:15px;padding:3px 0;border-bottom:1px dashed var(--line)}
details.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:0 0 10px}
details.blk>summary{font-weight:700;color:var(--pri)}
details.blk>summary:after{content:" ▸";color:var(--mut);font-weight:400}
details.blk[open]>summary:after{content:" ▾"}
.howto{font-size:14px;color:var(--mut);line-height:1.7}
/* ── V222（老師 11/10「分類不夠明顯，很難快速抓到重點」）：每一類一個顏色，整塊上色（左色條＋淡底＋實心標籤）── */
:root{--cm:#23744a;--cmb:#e7f5ed;--cw:#9a6200;--cwb:#fdf2da;--cr:#8e3fb0;--crb:#f4e9fa;--cs:#0e7c86;--csb:#e0f3f4;
  --ct:#6d6157;--ctb:#f2ede7;--ca:#1f5fbf;--cab:#e6effc;--cg:#c62828;--cgb:#fde8e6}
:root[data-theme="dark"]{--cm:#6fd39f;--cmb:#17332a;--cw:#f2c06b;--cwb:#3a2e14;--cr:#d7a3f0;--crb:#33223d;--cs:#7fd6dd;--csb:#173539;
  --ct:#c9bcb0;--ctb:#302925;--ca:#8cb8f5;--cab:#1a2b45;--cg:#ff8f86;--cgb:#47231f}

  --ct:#c9bcb0;--ctb:#302925;--ca:#8cb8f5;--cab:#1a2b45;--cg:#ff8f86;--cgb:#47231f}}
.c-m{--c:var(--cm);--cb:var(--cmb)}.c-w{--c:var(--cw);--cb:var(--cwb)}.c-r{--c:var(--cr);--cb:var(--crb)}.c-s{--c:var(--cs);--cb:var(--csb)}

.ln .tx{font-family:"Noto Serif TC","Songti TC",serif;font-size:19px;padding-bottom:4px;border-bottom:1px dashed var(--line)}
.it[class*="c-"]{border-left:5px solid var(--c);background:var(--cb);border-radius:4px 10px 10px 4px;padding:6px 10px 7px;margin-top:6px}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .it[class*="c-"]>.k,:root:not([data-theme="light"]) .it[class*="c-"]>details>summary>.k{color:#1d1916}}
.it.c-m{font-weight:500}
.it.c-r b,.it.c-s b{color:var(--c)}
.it.c-w .words b{color:var(--c)}

.it.c-a .qbody{border-left-color:var(--c)}
.it.c-a>.k{margin-bottom:2px}
.it .long{border-left-color:var(--c)}
.ln.cur{box-shadow:0 0 0 3px var(--pri)}
/* 整段的區塊（統整、問答、析）也標顏色 */
.ln.blkln{border-left:5px solid var(--c);background:var(--card)}
.ln.blkln>.k{background:var(--c);color:#fff}
/* 本段考點：紅色區塊 */
.kdz{border:2px solid var(--cg);border-radius:14px;padding:4px 10px 2px;margin:16px 0 12px;background:var(--cgb)}
.kdz .sec-h.kh{border-top:0;margin:6px 0 8px;color:var(--cg)}
.kdz .card.note{border-color:transparent}
/* ── 只看某幾類（上方色塊開關；記在這支手機）── */
.flt{display:flex;gap:6px;overflow-x:auto;margin-top:7px;padding-bottom:2px;scrollbar-width:none}
.flt::-webkit-scrollbar{display:none}
.flt button{flex:none;border:2px solid var(--c);background:var(--c);color:#fff;border-radius:999px;padding:1px 9px;font-size:13.5px;font-weight:700}
:root[data-theme="dark"] .flt button{color:#1d1916}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .flt button{color:#1d1916}}

main.no-m .c-m,main.no-w .c-w,main.no-r .c-r,main.no-r .c-s,main.no-t .c-t,main.no-a .c-a,main.no-g .c-g,main.no-g .kdz{display:none!important}

.bar .fs{padding:5px 10px}

<body>
<div id="lock" class="lock hide">
  <div style="font-size:40px">🔒</div>
  <div style="font-weight:700;font-size:20px">講稿</div>
  <div style="color:var(--mut);font-size:14px">輸入講稿密碼（只存在這支手機）</div>
  <input id="pass" type="password" autocomplete="current-password" enterkeyhint="go">
  <div id="perr" class="err"></div>
  <button class="go" id="pgo" type="button">打開</button>
</div>

<div id="app" class="hide">
  <div class="top">
    <div class="row">
      <div class="live"><i class="dot" id="dot"></i><span id="lv">連線中…</span></div>
      <button class="btn on" id="follow" type="button">跟著平板</button>
    </div>
    <div class="where"><div class="ls" id="wls"></div><div class="pg" id="wpg"></div></div>
    <div class="flt" id="flt"><button type="button" class="c-m" data-c="m">句意</button><button type="button" class="c-w" data-c="w">字義</button><button type="button" class="c-r" data-c="r">修辭</button><button type="button" class="c-t" data-c="t">翻譯</button><button type="button" class="c-a" data-c="a">提問</button><button type="button" class="c-g" data-c="g">考點</button></div>
  </div>
  <main id="main"></main>
  <div class="bar">
    <select id="lsel" aria-label="選課"></select>
    <button class="btn fs" id="fsm" type="button" title="字小一點">A−</button><button class="btn fs" id="fsp" type="button" title="字大一點">A+</button>
    <button class="btn" id="theme" type="button" title="深淺色">◐</button>
    <button class="btn" id="lockb" type="button">鎖上</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var GS_URL = 'https://script.google.com/macros/s/AKfycbxfJoT1iS5tIzXtShetthjspMQ-yUwgUkiPfWc2nBEDNwYgs49u87eKvAJo5x73k7K1/exec';
  var PASS_K = 'tn_pass_v1', THEME_K = 'tn_theme_v1', POLL = 2500;
  var LESSON_FILE = { '論語選—子路曾皙冉有公西華侍坐': '01', '桃花源記': '07', '樂府詩選—長干行': '30', '茫茫人海中的一名女孩': '31', '極短篇小說選': '32' };
  var $ = function (id) { return document.getElementById(id); };
  function lget(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lrm(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>'); }

  /* ── 主題 ── */
  function applyTheme() { var t = lget(THEME_K); if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
  applyTheme();
  $('theme').onclick = function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!lget(THEME_K) && matchMedia('(prefers-color-scheme: dark)').matches);
    lset(THEME_K, dark ? 'light' : 'dark'); applyTheme();
  };

  /* ── V222 分類開關（只看某幾類）與字級；都記在這支手機 ── */
  var SHOW_K = 'tn_hide_v1', FS_K = 'tn_fs_v1';
  function hidden() { try { return JSON.parse(lget(SHOW_K) || '[]'); } catch (e) { return []; } }
  function applyShow() {
    var hs = hidden(), m = $('main');
    ['m', 'w', 'r', 't', 'a', 'g'].forEach(function (c) { m.classList.toggle('no-' + c, hs.indexOf(c) >= 0); });
    var bs = $('flt').querySelectorAll('button'); for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('off', hs.indexOf(bs[i].getAttribute('data-c')) >= 0);
  }
  $('flt').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var c = b.getAttribute('data-c'), hs = hidden(), i = hs.indexOf(c);
    if (i >= 0) hs.splice(i, 1); else hs.push(c);
    lset(SHOW_K, JSON.stringify(hs)); applyShow();
    if (S.li >= 0) { var li = S.li; S.li = -2; markLine(li); }   /* 收起某類後，目前那句仍留在畫面上 */
  });
  function applyFs() { var z = parseFloat(lget(FS_K)) || 1; $('main').style.zoom = z; }
  function bumpFs(d) { var z = Math.round(((parseFloat(lget(FS_K)) || 1) + d) * 10) / 10; z = Math.max(0.8, Math.min(1.6, z)); lset(FS_K, String(z)); applyFs(); }
  $('fsm').onclick = function () { bumpFs(-0.1); };
  $('fsp').onclick = function () { bumpFs(0.1); };
  applyShow(); applyFs();

  /* ── 解密 ── */
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  var ENC = null;
  function loadEnc() {
    if (ENC) return Promise.resolve(ENC);
    return fetch('notes.enc.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('講稿檔讀不到（HTTP ' + r.status + '）'); return r.json(); })
      .then(function (j) { ENC = j; return j; });
  }
  function decrypt(pass) {
    return loadEnc().then(function (e) {
      return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']).then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(e.salt), iterations: e.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      }).then(function (key) {
        var raw = b64(e.ct), tag = b64(e.tag), all = new Uint8Array(raw.length + tag.length); all.set(raw); all.set(tag, raw.length);
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(e.iv) }, key, all);
      }).then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
    });
  }

  /* ── 網站課文資料（句意、修辭、提問…）── */
  var TB = {}, tbLoading = {}, idxP = null;
  function idxHtml() { if (!idxP) idxP = fetch('../index.html', { cache: 'no-store' }).then(function (r) { return r.text(); }).catch(function () { return ''; }); return idxP; }
  function loadLesson(k) {
    if (TB[k] || tbLoading[k] || !LESSON_FILE[k]) return;
    tbLoading[k] = 1; var f = LESSON_FILE[k];
    idxHtml().then(function (html) {
      var m = html.match(new RegExp('data/lessons/' + f + '\\.js\\?v=([0-9a-f]+)'));
      var s = document.createElement('script');
      s.src = '../data/lessons/' + f + '.js' + (m ? '?v=' + m[1] : '?t=' + Date.now());
      s.onload = function () { var hit = (window.TB_LESSONS || []).filter(function (x) { return x[0] === k; })[0]; TB[k] = hit ? hit[1] : {}; render(); };
      s.onerror = function () { TB[k] = {}; };
      document.head.appendChild(s);
    });
  }
  function clean(html) {   /* 網站 HTML：拿掉按鈕、onclick；答案全部顯示 */
    var doc = new DOMParser().parseFromString('<div>' + String(html || '') + '</div>', 'text/html'), root = doc.body.firstChild;
    root.querySelectorAll('script,button,style,a.tp-more').forEach(function (e) { e.remove(); });
    root.querySelectorAll('*').forEach(function (e) { for (var i = e.attributes.length - 1; i >= 0; i--) { var n = e.attributes[i].name; if (/^on/i.test(n)) e.removeAttribute(n); } });
    return root.innerHTML;
  }
  function plain(t) {   /* 課文：{n:18|方六、七十}→方六、七十；{g:春服|解釋}→春服 */
    t = String(t || '');
    for (var i = 0; i < 3; i++) t = t.replace(/\{([a-z]+):([^{}|]*)(?:\|([^{}]*))?\}/g, function (m, ty, a, b) { return /^\d+$/.test(a) ? (b || '') : a; });
    return t.replace(/<[^>]+>/g, '');
  }
  function pageOf(k, seg) { var d = TB[k]; if (!d || !d.textPages) return null; return d.textPages.filter(function (p) { return p.seg === seg; })[0] || null; }

  /* ── 狀態 ── */
  var D = null, S = { follow: true, pos: null, viewK: '', viewId: '', err: '', li: -1, rendered: '' };
  function lessonOf(k) { if (!D) return null; for (var i = 0; i < D.lessons.length; i++) if (D.lessons[i].k === k) return D.lessons[i]; return null; }
  function anchorOf(L, id) { if (!L || !id) return null; for (var i = 0; i < L.anchors.length; i++) { var a = L.anchors[i]; if (a.id === id || (a.ids && a.ids.indexOf(id) >= 0)) return a; } return null; }
  function splitId(id) { var m = String(id || '').match(/^(.*?)(?:#(\d+))?$/); return { id: m[1], li: m[2] == null ? -1 : +m[2] }; }

  var TAG = { tc: '統測', aq: 'A卷有考', jia: '甲卷', wb: '習作', basic: '課本練習', ex: '延伸', tip: '提醒' };
  function noteHTML(n) {
    var tags = (n.tag || ['tip']).map(function (t) { return '<span class="tag ' + esc(t) + '">' + esc(TAG[t] || t) + '</span>'; }).join('');
    return '<div class="card note"><div class="tags">' + tags + '</div><div class="t">' + fmt(n.t) + '</div>' +
      (n.say ? '<div class="say">' + fmt(n.say) + '</div>' : '') + (n.src ? '<div class="src">' + fmt(n.src) + '</div>' : '') + '</div>';
  }
  /* V220（老師 11/9）：全部預設展開；短版在前、長版接在下面 */
  function shortLong(kcls, kname, shortHtml, longHtml) {
    if (!longHtml || shortHtml === longHtml) return '<div class="it c-' + kcls + '"><span class="k ' + kcls + '">' + kname + '</span>' + (shortHtml || longHtml) + '</div>';
    return '<div class="it c-' + kcls + '"><details open><summary><span class="k ' + kcls + '">' + kname + '</span>' + shortHtml + '<span class="more">長版▸</span></summary><div class="long">' + longHtml + '</div></details></div>';
  }
  function askBlock(asks, askT, label) {
    return '<div class="it c-a"><span class="k a">' + esc(label || '提問') + '</span>' +
      '<div class="qbody">' + asks.map(clean).join('') + (askT ? '<div class="teach">' + clean(askT) + '</div>' : '') + '</div></div>';
  }
  /* 這一句的字義：課文裡的 {n:號|字}（對注釋 P.notes）與 {g:字|解釋} */
  function wordsOf(l, P) {
    var out = [], st = P.noteStart || 1, t = String(l.text || ''), m, re = /\{([a-z]+):([^{}|]*)\|([^{}]*)\}/g;
    while ((m = re.exec(t))) {
      if (/^\d+$/.test(m[2])) { var n = (P.notes || [])[+m[2] - st]; if (n) out.push([n[0], n[1]]); }
      else if (m[1] === 'g') out.push([m[2], m[3]]);
    }
    return out;
  }

  /* 逐句講稿（課文頁） */
  function segHTML(L, A, P) {
    var h = '';
    /* V220 順序（老師 11/9）：每一句 句意→字義→修辭→翻譯→提問（全部展開）；段末統整、問答、析；本段考點放最後 */
    if (P.pian) h += '<div class="pian"><b>段旨</b>　' + clean(P.pian) + '</div>';
    (P.lines || []).forEach(function (l, i) {
      var b = '<div class="ln" data-li="' + i + '"><div class="tx"><span class="no">' + (i + 1) + '</span>' + esc(plain(l.text)) + '</div>';
      if (l.mean) b += shortLong('m', '句意', (l.cite ? '<span class="cite">' + clean(l.cite) + '──</span>' : '') + clean(l.meanShort || l.mean), l.meanShort ? clean(l.mean) : '');
      if (l.mean2) b += shortLong('m', '句意', (l.cite2 ? '<span class="cite">' + clean(l.cite2) + '──</span>' : '') + clean(l.mean2Short || l.mean2), l.mean2Short ? clean(l.mean2) : '');
      var ws = wordsOf(l, P);
      if (ws.length) b += '<div class="it c-w"><span class="k w">字義</span><div class="words">' + ws.map(function (w) { return '<div><b>' + clean(w[0]) + '</b>：' + clean(w[1]) + '</div>'; }).join('') + '</div></div>';
      (l.rhet || []).forEach(function (r, ri) {
        var sh = l.rhetShort && l.rhetShort[ri];
        b += shortLong('r', '修辭', '<b>' + esc(r[0]) + '</b>　' + (sh ? clean(sh) : clean(r[1])), sh ? clean(r[1]) : '');
      });
      (l.style || []).forEach(function (r) { b += '<div class="it c-s"><span class="k s">筆法</span><b>' + clean(r[0]) + '</b>　' + clean(r[1]) + '</div>'; });
      if (l.tr) b += '<div class="it c-t"><span class="k t">翻譯</span><span class="trx">' + clean(l.tr) + '</span></div>';
      if (l.ask && l.ask.length) b += askBlock(l.ask, l.askT, '提問');
      if (l.tongT) b += '<div class="it c-g"><span class="k g">統測</span>' + clean(l.tongT) + '</div>';
      h += b + '</div>';
    });
    if (P.ask && P.ask.length) h += '<div class="ln">' + askBlock(P.ask, P.askT, P.askLabel || '本段統整') + '</div>';
    (P.boxes || []).forEach(function (bx) { h += '<div class="ln">' + askBlock(bx.ask || [], bx.askT, bx.label || '統整') + '</div>'; });
    if (P.qa && P.qa.length) h += '<div class="ln blkln c-a"><span class="k a">問答</span>' + P.qa.map(function (q, i) { return '<div class="it"><b>' + (i + 1) + '. ' + clean(q[0]) + '</b><div class="qa-a">' + clean(q[1]) + '</div></div>'; }).join('') + '</div>';
    if (P.xi) h += '<div class="ln blkln c-t"><span class="k t">析</span>' + clean(P.xi) + '</div>';
    if (A && A.notes.length) h += '<div class="kdz"><div class="sec-h kh">★ 本段考點（' + A.notes.length + '）</div>' + A.notes.map(noteHTML).join('') + '</div>';
    if (!unlocked) h += lockedHTML();
    return h;
  }

  function lockedHTML() {
    return '<div class="sec-h kh">考點</div><div class="card"><div style="font-size:15px;color:var(--mut);margin-bottom:8px">🔒 考點已上鎖（學生打開這頁也看不到）。用老師的專屬網址打開會自動解鎖，或在這裡輸入一次講稿密碼。</div>' +
      '<div class="row"><input class="unlock-in" type="password" autocomplete="current-password" style="flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)">' +
      '<button type="button" class="btn on unlock-go">解鎖</button></div></div>';
  }
  function pageList(L) {   /* 本課所有頁：課文段落（網站資料）＋有講稿的說明頁 */
    var seen = {}, list = [];
    var d = TB[L.k];
    if (d && d.textPages) d.textPages.forEach(function (p) { var id = 'seg:' + p.seg, a = anchorOf(L, id); seen[id] = 1; list.push({ id: id, h: a ? a.h : p.seg, n: a ? a.notes.length : 0 }); });
    L.anchors.forEach(function (a) { if (!seen[a.id]) { seen[a.id] = 1; list.push({ id: a.id, h: a.h, n: a.notes.length }); } });
    return list;
  }

  function render() {
    var raw = S.follow && S.pos ? S.pos.id : S.viewId, sp = splitId(raw);
    var k = S.follow && S.pos ? S.pos.k : S.viewK, id = sp.id;
    var L = lessonOf(k) || (D && D.lessons[0]);
    if (!S.viewK && L) S.viewK = L.k;
    if (L) loadLesson(L.k);
    var A = anchorOf(L, id);
    var P = (L && /^seg:/.test(id)) ? pageOf(L.k, id.slice(4)) : null;
    $('wls').textContent = L ? L.name : '';
    $('wpg').textContent = A ? A.h : P ? P.seg + (P.sub ? '　' + plain(P.sub) : '') : (S.follow && S.pos ? (S.pos.h || '（這頁）') + (lessonOf(S.pos.k) ? '' : '　（這課還沒有講稿）') : '本課總提醒');
    var h = '';
    if (P) {
      h += segHTML(L, A, P);
    } else {
      if (A) h += A.notes.map(noteHTML).join('');
      else if (L && /^seg:/.test(id) && LESSON_FILE[L.k] && !TB[L.k]) h += '<div class="empty">課文資料載入中…</div>';
      else if (!unlocked) h += lockedHTML();
      else if (S.follow && S.pos && lessonOf(S.pos.k)) h += '<div class="empty">這頁沒有特別提醒</div>';
    }
    if (L) {
      if (L.overview && L.overview.length) h += '<details class="blk"' + (A || P ? '' : ' open') + '><summary>本課總提醒（' + L.overview.length + '）</summary>' + L.overview.map(noteHTML).join('') + '</details>';
      var list = pageList(L);
      h += '<details class="all"' + (A || P ? '' : ' open') + '><summary>本課所有頁面（' + list.length + '）▸</summary><div class="alist">' +
        list.map(function (a) { return '<button type="button" data-id="' + esc(a.id) + '" class="' + (a.id === id ? 'cur' : '') + '">' + esc(a.h) + (a.n ? '<small>考點 ' + a.n + '</small>' : '') + '</button>'; }).join('') + '</div></details>';
    }
    h += '<details class="blk"><summary>怎麼用</summary><div class="howto">' +
      '① 平板開教學網站並登入登記密碼（成績系統的那組）。<br>② 手機開這頁，保持「跟著平板」。平板翻到哪頁，這裡就跳到哪頁。<br>' +
      '③ 平板上點句子開頭那顆淡淡的小點（或句子本身），這裡會捲到那一句並框起來；小點閃綠＝手機收到了。<br>' +
      '　上方色塊＝分類開關：句意綠、字義黃、修辭紫、翻譯灰、提問藍、考點紅框；點一下收起那一類，再點打開。下面 A−／A+ 調字級。<br>④ 想先看後面的內容：點「跟著平板」切成自己翻，下面選課、點「本課所有頁面」；看完再點一次跟回來。<br>' +
      '⑤ 備課時不用開平板，直接選課、選頁就能看。<br>⑥ 考點：用老師專屬網址（掃 QR code）打開就自動解鎖；建議把那個網址「加入主畫面」，以後點圖示就好。</div></details>';
    $('main').innerHTML = h;
    S.rendered = (L ? L.k : '') + '|' + id;
    S.li = -1;
    $('lsel').value = L ? L.k : '';
    $('follow').classList.toggle('on', S.follow);
    $('follow').textContent = S.follow ? '跟著平板' : '自己翻（點我跟回）';
    markLine(sp.li, false);
  }
  function markLine(li, smooth) {
    if (li === S.li) return;
    S.li = li;
    var all = $('main').querySelectorAll('.ln.cur'); for (var i = 0; i < all.length; i++) all[i].classList.remove('cur');
    if (li < 0) return;
    var el = $('main').querySelector('.ln[data-li="' + li + '"]'); if (!el) return;
    el.classList.add('cur');
    var top = el.getBoundingClientRect().top + scrollY - $('app').querySelector('.top').offsetHeight - 8;
    scrollTo(0, Math.max(0, top));   /* 不用 smooth：部分瀏覽器在背景輪詢時不會真的捲動 */
  }

  function paintLive() {
    var dot = $('dot'), age = S.pos ? Math.round((Date.now() - S.pos.t) / 1000) : 0, t;
    if (S.err) { dot.className = 'dot bad'; t = S.err; }
    else if (!S.pos) { dot.className = 'dot'; t = '平板還沒送位置（平板要先登入登記密碼）'; }
    else { dot.className = 'dot' + (age < 600 ? ' on' : ''); t = '平板：第 ' + (S.pos.i + 1) + '/' + S.pos.n + ' 頁　' + (age < 60 ? '剛剛' : age < 3600 ? Math.round(age / 60) + ' 分鐘前' : Math.round(age / 3600) + ' 小時前'); }
    $('lv').textContent = t;
  }

  /* ── 輪詢位置 ── */
  var pollT = 0, inflight = false;
  function poll() {
    clearTimeout(pollT);
    if (document.hidden) return;
    if (!inflight) {
      inflight = true;
      fetch(GS_URL, { method: 'POST', body: JSON.stringify({ action: 'liveGet' }), redirect: 'follow' })
        .then(function (r) { return r.json(); })
        .then(function (r) {
          if (!r.ok) throw new Error(/不明的動作/.test(r.error || '') ? 'Google 後台還沒更新到 gr-21' : (r.error || '讀不到位置'));
          S.err = '';
          var p = r.pos;
          if (p && r.now) p.t = p.t + (Date.now() - r.now);
          S.pos = p || null;
          if (S.follow && p) {
            var sp = splitId(p.id);
            if (S.rendered !== p.k + '|' + sp.id) { render(); if (sp.li < 0) scrollTo(0, 0); }
            else markLine(sp.li, true);
          }
        })
        .catch(function (e) { S.err = (e && e.message) || '連不上'; if (/Failed to fetch|NetworkError|Load failed/i.test(S.err)) S.err = '網路連不上，稍後自動重試'; })
        .then(function () { inflight = false; paintLive(); });
    }
    pollT = setTimeout(poll, POLL);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { poll(); wake(); } });
  setInterval(paintLive, 15000);

  var lockW = null;
  function wake() { try { if (navigator.wakeLock && !lockW) navigator.wakeLock.request('screen').then(function (w) { lockW = w; w.addEventListener('release', function () { lockW = null; }); }).catch(function () {}); } catch (e) {} }

  /* ── 互動 ── */
  $('follow').onclick = function () { S.follow = !S.follow; if (!S.follow && S.pos) { S.viewK = S.pos.k; S.viewId = splitId(S.pos.id).id; } render(); if (S.follow) scrollTo(0, 0); };
  $('main').addEventListener('click', function (e) {
    var b = e.target.closest('.alist button'); if (!b) return;
    var cur = S.follow && S.pos ? S.pos.k : S.viewK;
    S.follow = false; S.viewK = lessonOf(cur) ? cur : S.viewK; S.viewId = b.getAttribute('data-id'); render(); scrollTo(0, 0);
  });
  $('lsel').onchange = function () { S.follow = false; S.viewK = this.value; S.viewId = ''; render(); scrollTo(0, 0); };
  $('lockb').onclick = function () { if (!confirm('鎖上後要重新輸入講稿密碼，確定？')) return; lrm(PASS_K); location.reload(); };

  /* V221（老師 11/9「為什麼要上鎖，很麻煩」）：打開就能看句意、字義、修辭、翻譯、提問（網站本來就公開的內容）；
     只有「考點」加密。專屬網址 …/tn/#k=<講稿密碼> 打開就自動解鎖（# 後面不會傳到網路上），加到主畫面後點圖示即可。
     沒有鑰匙時，考點的位置顯示一個小解鎖框。 */
  var BASE = { lessons: [
    { k: '論語選—子路曾皙冉有公西華侍坐', name: 'L6 論語選〈侍坐〉', overview: [], anchors: [] },
    { k: '樂府詩選—長干行', name: 'L7 樂府詩選〈長干行〉', overview: [], anchors: [] },
    { k: '茫茫人海中的一名女孩', name: 'L8 茫茫人海中的一名女孩', overview: [], anchors: [] },
    { k: '桃花源記', name: 'L9 桃花源記', overview: [], anchors: [] },
    { k: '極短篇小說選', name: 'L10 極短篇小說選', overview: [], anchors: [] }
  ] };
  var unlocked = false;
  function hashKey() { var m = String(location.hash || '').match(/[#&]k=([^&]+)/); try { return m ? decodeURIComponent(m[1]) : ''; } catch (e) { return ''; } }
  function start(data) {
    D = data;
    $('lock').classList.add('hide'); $('app').classList.remove('hide');
    var cur = $('lsel').value;
    $('lsel').innerHTML = D.lessons.map(function (L) { return '<option value="' + esc(L.k) + '">' + esc(L.name) + '</option>'; }).join('');
    if (cur) $('lsel').value = cur;
    $('lockb').textContent = unlocked ? '鎖上考點' : '🔒 考點';
    render();
  }
  function tryPass(p, quiet) {
    if (!window.crypto || !crypto.subtle) { if (!quiet) alert('這個瀏覽器不支援解密，請用 Safari 或 Chrome 打開'); return Promise.resolve(); }
    return decrypt(p).then(function (d) { lset(PASS_K, p); unlocked = true; start(d); })
      .catch(function (e) { lrm(PASS_K); if (!quiet) alert(/講稿檔/.test(e && e.message) ? e.message : '密碼不對'); });
  }
  /* 考點區沒解鎖時的小框（在 render 產生，這裡處理按鈕） */
  $('main').addEventListener('click', function (e) {
    if (!e.target.closest('.unlock-go')) return;
    var inp = $('main').querySelector('.unlock-in'); var p = inp && inp.value.trim(); if (p) tryPass(p);
  });
  $('lockb').onclick = function () {
    if (!unlocked) { var p = prompt('輸入講稿密碼解鎖考點（只要一次，這支手機會記住）'); if (p) tryPass(p.trim()); return; }
    if (!confirm('鎖上考點？（句意、修辭、提問照樣看得到）')) return;
    lrm(PASS_K); unlocked = false;
    if (hashKey()) history.replaceState(null, '', location.pathname + location.search);
    start(BASE);
  };
  start(BASE); poll(); wake();
  var key0 = hashKey() || lget(PASS_K);
  if (key0) tryPass(key0, true);
})();
</script>
