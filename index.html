<div id="cls-tab" onclick="clsToggle()">班級進度</div>
<div id="cls-panel">
  <div class="cls-head">
    <span class="cls-title">班級進度與考試紀錄</span>
    <button class="cls-x" onclick="clsToggle()">✕</button>
  </div>

    <input type="date" id="cls-date">

  <div class="cls-list" id="cls-list"></div>
  <div class="cls-foot">
    <button onclick="clsExport()">匯出備份</button>

<div id="display-tab" onclick="toggleDisplayPanel()">顯示設定</div>

</div>

<div id="wk-fullscreen">
  <div class="wkfs-header">
    <span class="wkfs-title" id="wkfs-title">古文複習</span>
    <button class="wkfs-section-toggle" id="wkfs-section-toggle" onclick="wkToggleSections()" title="顯示／隱藏段落快速切換">☰ 段落</button>
    <div class="wkfs-sections" id="wkfs-sections"></div>
    <div class="wkfs-ctrl-btns">
      <button class="wkfs-ctrl-btn" onclick="wkFontDown()" title="縮小字級">A−</button>

      <button class="wkfs-ctrl-btn" id="wkfs-dark-btn" onclick="toggleDarkMode()" title="深色模式">🌙</button>
    </div>
    <button class="wkfs-close" onclick="wkCloseProj()">✕ 關閉</button>
  </div>
  <div class="wkfs-body" id="wkfs-body"></div>

  <button type="button" id="tp-close-blue-tab" onclick="closeAllBlueFloatingNotes()" aria-label="關閉所有藍色浮框">關閉浮框</button>
  <div id="wk-ink-layer" aria-label="投影畫記工具">
    <canvas id="wk-ink-canvas"></canvas>
    <div id="wk-ink-toolbar" role="toolbar" aria-label="畫記工具">
      <button type="button" id="wk-ink-toggle" class="wk-ink-btn" onclick="wkInkToggle()">✎ 畫記</button>
      <div id="wk-ink-extra" class="wk-ink-extra">
        <button type="button" class="wk-ink-btn" onclick="wkInkUndo()">↶ 撤銷</button>
        <button type="button" class="wk-ink-btn" onclick="wkInkClear()">清除本頁</button>
        <button type="button" class="wk-ink-color on" data-color="#c0392b" style="--ink-color:#c0392b" onclick="wkInkColor(this,'#c0392b')" aria-label="紅色"></button>
        <button type="button" class="wk-ink-color" data-color="#1f6fb2" style="--ink-color:#1f6fb2" onclick="wkInkColor(this,'#1f6fb2')" aria-label="藍色"></button>
        <button type="button" class="wk-ink-color" data-color="#2d7a4f" style="--ink-color:#2d7a4f" onclick="wkInkColor(this,'#2d7a4f')" aria-label="綠色"></button>
        <button type="button" class="wk-ink-color" data-color="#7c4da0" style="--ink-color:#7c4da0" onclick="wkInkColor(this,'#7c4da0')" aria-label="紫色"></button>
        <button type="button" class="wk-ink-color wk-ink-highlighter" data-color="rgba(255,235,59,.48)" style="--ink-color:rgba(255,235,59,.48)" onclick="wkInkHighlighter(this)" aria-label="黃色螢光筆"></button>
        <button type="button" class="wk-ink-size on" onclick="wkInkSetSize(3)">細</button>
        <button type="button" class="wk-ink-size" onclick="wkInkSetSize(5)">中</button>
        <button type="button" class="wk-ink-size" onclick="wkInkSetSize(8)">粗</button>
      </div>
    </div>
  </div>
  <div class="wkfs-footer">
    <button class="wkfs-nav" onclick="wkPrev()">←</button>
    <span id="wkfs-counter" style="color:var(--gold);font-family:'Noto Serif TC',serif;font-size:15px">─</span>
    <button class="wkfs-nav" onclick="wkNext()">→</button>
  </div>
</div>
