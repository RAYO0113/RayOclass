<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>詩的變形記</title>
<!-- V240（2026-11-12）〈長干行〉詩的流變動畫頁。依老師〈詩的變形記_互動簡報製作規格.md〉製作；內容基準＝L7 詩的流變總表（30.js）。
     iPad 11（1194×834）為主、手機直式可用。全部內嵌、可離線。核校清單：教學系統專案根目錄「詩的變形記_內容核校清單.md」 -->
<style>
:root{
  --bg:#F4F0E7; --ink:#252722; --muted:#6d6a60; --line:#d8cfbd; --card:#fffdf8;
  --sj:#8D7655; --cc:#537C83; --yf:#A7794F; --gs:#628475; --jt:#805C4D; --ci:#A88A4D; --qu:#806C8E; --xs:#607F96; --fu:#7a6f5a;
  --fs: clamp(15px, 1.75vw, 22px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;font-size:var(--fs);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:.6em;padding:.45em 1em;border-bottom:1px solid var(--line);min-height:2.6em}
header .t{font-weight:800;letter-spacing:.08em}
header .crumb{color:var(--muted);font-size:.85em}
header .sp{flex:1}
main{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:1.1em 1.6em 1em;overflow:auto;opacity:0;visibility:hidden;transition:opacity .35s}
.slide.on{opacity:1;visibility:visible}
footer{display:flex;align-items:center;gap:.5em;padding:.4em .8em calc(.4em + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#efe9dc}
.btn{border:1.5px solid #b9ad94;background:var(--card);border-radius:999px;padding:.32em .95em;cursor:pointer;white-space:nowrap;font-size:.9em}
.btn:hover{background:#f6efe0}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:default}
footer .pg{color:var(--muted);font-size:.85em;min-width:3.5em;text-align:center}
footer .sp{flex:1}
.hint{color:var(--muted);font-size:.78em}
h1{font-size:1.75em;margin:.1em 0 .25em;letter-spacing:.06em}
h2{font-size:1.15em;margin:.2em 0}
.tags{display:flex;flex-wrap:wrap;gap:.35em;margin:.2em 0 .7em}
.tag{font-size:.78em;padding:.12em .65em;border-radius:999px;border:1.5px solid currentColor;font-weight:700;background:#fffdf8}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:1.2em;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.8em 1em}
.card h3{margin:0 0 .35em;font-size:1em}
.note{font-size:.8em;color:var(--muted);margin-top:.4em}
.small{font-size:.85em}
ul.pts{margin:.2em 0;padding-left:1.2em;line-height:1.75}
/* 逐步揭露 */
.st{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;pointer-events:none}
.st.show{opacity:1;transform:none;pointer-events:auto}
/* 分類展開 chips */
.chips{display:flex;flex-wrap:wrap;gap:.4em;margin:.3em 0}
.chip{border:1.5px solid var(--c,#999);color:var(--c,#555);background:#fffdf8;border-radius:8px;padding:.25em .8em;cursor:pointer;font-weight:700}
.chip.on{background:var(--c,#555);color:#fff}
.expl{min-height:2.6em;margin-top:.35em;padding:.5em .8em;border-left:4px solid var(--c,#999);background:#fbf7ee;border-radius:0 8px 8px 0;line-height:1.7}
.expl:empty{display:none}
/* 字塊 */
.verse{display:flex;flex-direction:column;gap:.45em;align-items:flex-start}
.row{display:flex;gap:.25em;flex-wrap:nowrap}
.ch{display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;font-size:1.15em;border:1.5px solid var(--c,#8D7655);border-radius:6px;background:#fff;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s, width .5s, margin .5s}
.play .ch{opacity:1;transform:none}
.ch.p{border:none;background:none;width:.9em;color:var(--muted)}
.ch.xi{background:#e6f0f1;font-weight:800}
.ch.rhy{box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--ink)}
.ch.rhy::after{content:'韻';position:absolute;font-size:.42em;transform:translate(1.35em,-1.35em);background:var(--ink);color:#fff;border-radius:4px;padding:0 .2em}
.ch{position:relative}
.ch.cz{background:#f1e9e3}
.ch.zz{border-style:solid;border-width:2px}
.ch.cz-small{width:1.2em;height:1.2em;font-size:.75em;border-style:dashed;background:#efe8f3;align-self:center}
.gap{display:inline-block;width:1em}
.lab{font-size:.75em;color:var(--muted);margin-left:.5em;align-self:center;white-space:nowrap}
/* 封面 */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center;gap:.6em}
.cover h1{font-size:2.8em;letter-spacing:.3em;margin:0}
.cover .sub{color:var(--muted);letter-spacing:.2em}
.evo{display:flex;align-items:flex-end;gap:1.6em;margin:1.2em 0;flex-wrap:wrap;justify-content:center}
.evo .blk{display:flex;flex-direction:column;gap:.25em;align-items:flex-start;opacity:0;transform:translateX(-10px);transition:opacity .5s,transform .5s}
.evo .blk.show{opacity:1;transform:none}
.evo .bar{height:.85em;border-radius:4px;background:var(--c)}
.evo .blk{gap:.35em}
.evo .cap{font-size:.85em;color:var(--muted);margin-top:.35em;font-weight:700}
/* 時間軸 */
.tl{position:relative;margin-top:.3em}
.tl-axis{display:grid;grid-template-columns:repeat(9,1fr);font-size:.75em;color:var(--muted);border-bottom:2px solid var(--ink);padding-bottom:.2em}
.tl-axis span{text-align:center}
.tl-lanes{display:grid;grid-template-columns:repeat(9,1fr);grid-auto-rows:3.4em;gap:.55em .3em;margin-top:.8em}
.node{border:2.5px solid var(--c);color:var(--ink);background:#fffdf8;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:800;font-size:1.05em;padding:0 .3em;transition:background .2s,transform .2s;white-space:nowrap;overflow:hidden;opacity:0;transform:translateY(8px)}
.play .node,.play .fu-card{opacity:1;transform:none;transition:opacity .4s,transform .4s,background .2s}
.node:hover,.node.sel{background:color-mix(in srgb,var(--c) 20%,#fff)}
.node.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.node small{font-weight:400;color:var(--muted);font-size:.62em;line-height:1.1}
.tl-note{font-size:.78em;color:var(--muted);margin-top:.9em;line-height:1.7}
.fu-card{border:2px dashed var(--fu);border-radius:12px;background:#fffdf8;display:flex;align-items:center;justify-content:center;font-size:.85em;cursor:pointer;color:var(--muted);opacity:0}
.fu-card b{color:var(--fu);font-size:1.15em}
/* 兩漢分支 */
.fork{display:grid;grid-template-columns:1fr 3.2em 1fr;gap:.6em;align-items:start}
.fork .mid{display:flex;flex-direction:column;align-items:center;gap:.3em;padding-top:.3em}
.fork .mid .dot{width:2.6em;height:2.6em;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:800}
.branch{border:2px solid var(--c);border-radius:14px;padding:.7em .9em;background:#fffdf8;cursor:pointer;transition:transform .5s,opacity .5s}
.branch h2{color:var(--c)}
.wave{display:flex;align-items:flex-end;gap:3px;height:1.6em;margin:.3em 0}
.wave i{display:block;width:4px;border-radius:2px;background:var(--yf);animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{height:20%}50%{height:100%}}
.paused .wave i{animation-play-state:paused}
.fork-line{height:3px;background:linear-gradient(90deg,var(--yf),var(--ink),var(--gs));border-radius:2px;margin:.4em 0 .8em;transform-origin:center;transform:scaleX(0);transition:transform .7s}
.play .fork-line{transform:scaleX(1)}
/* 近體格線 */
.jt-ctrl{display:flex;flex-wrap:wrap;gap:.35em;margin-bottom:.6em;align-items:center}
.jt-ctrl .sep{width:1px;height:1.4em;background:var(--line);margin:0 .3em}
.jt-wrap{position:relative;display:inline-block}
.jt-grid{display:flex;flex-direction:column;gap:.35em}
.jt-grid .row .ch{border-style:solid}
.jt-grid .row.empty .ch{color:transparent;background:#fbf8f1;border-style:dashed;opacity:1;transform:none}
.dz{background:#efe4dd !important}
.dz-tag{font-size:.7em;color:#fff;background:var(--jt);border-radius:4px;padding:0 .35em;margin-left:.4em;align-self:center}
.lian{font-size:.7em;color:var(--muted);width:2.6em;align-self:center}
/* 詞 */
.ci-lines{display:flex;flex-direction:column;gap:.4em}
.ci-line{display:flex;align-items:center;gap:.6em}
.ci-line .bar{font-size:1.1em;height:1.9em;border-radius:6px;background:color-mix(in srgb,var(--ci) 22%,#fff);border:1.5px solid var(--ci);display:flex;align-items:center;padding:0 .6em;white-space:nowrap;transform-origin:left;transform:scaleX(0);transition:transform .45s}
.ci-line .n{font-size:.7em;color:var(--muted);width:2.4em;text-align:right}
.play .ci-line .bar{transform:scaleX(1)}
.style2{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
/* 曲 */
.qu-demo .ch{--c:var(--qu)}
.qu-tree{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
/* 新詩 */
.xs-stage{position:relative;min-height:12em}
.xs-grid{display:grid;grid-template-columns:repeat(7,1.9em);gap:.25em;transition:opacity .8s}
.xs-grid i{width:1.9em;height:1.9em;border:1.5px dashed #b9ad94;border-radius:5px}
.xs-free{position:absolute;left:0;top:0;line-height:2.2;font-size:1.45em;font-weight:600;color:var(--ink);opacity:0;transition:opacity .9s}
.xs-stage{min-height:13em}
.xs-grid{grid-template-columns:repeat(7,2.3em)}.xs-grid i{width:2.3em;height:2.3em}
.xs-free div{transition:transform .9s, opacity .9s}
.xs-on .xs-grid{opacity:0}
.xs-on .xs-free{opacity:1}
/* 四大韻文 */
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em;margin-top:.5em}
.four .card{border-top:6px solid var(--c);text-align:center}
.four .big{font-size:2.4em;font-weight:900;color:var(--c);line-height:1.2}
/* 表與測驗 */
table.sum{border-collapse:collapse;width:100%;font-size:.8em}
table.sum th,table.sum td{border:1px solid var(--line);padding:.32em .45em;vertical-align:top;text-align:left;background:#fffdf8}
table.sum th{background:#ece4d3}
table.sum td:first-child{font-weight:800;border-left:5px solid var(--c)}
.quiz{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.q{border:1px solid var(--line);border-radius:12px;padding:.6em .8em;background:#fffdf8}
.q .opts{display:flex;flex-wrap:wrap;gap:.35em;margin-top:.35em}
.q .fb{min-height:1.4em;font-size:.85em;margin-top:.35em}
.q .opt.ok{background:#2d6b4f;color:#fff;border-color:#2d6b4f}
.q .opt.no{background:#efe6e2;border-color:#b0796a}
/* 手機直式 */
@media (max-width: 760px){
  :root{--fs:15px}
  .slide{padding:.8em .9em}
  .grid2,.fork,.style2,.qu-tree,.quiz{grid-template-columns:1fr}
  .fork .mid{flex-direction:row;justify-content:center}
  .four{grid-template-columns:1fr 1fr}
  .cover h1{font-size:2em}
  .tl-axis{display:none}
  .tl-lanes{grid-template-columns:1fr;grid-auto-rows:auto}
  .tl-lanes .node,.tl-lanes .fu-card{grid-column:auto !important;grid-row:auto !important;flex-direction:row;gap:.6em;justify-content:flex-start;padding:.55em .8em}
  header .crumb{display:none}
  .ch{width:1.7em;height:1.7em;font-size:1em}
  footer .hint{display:none}
  table.sum{font-size:.72em}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="app">
<header><span class="t">詩的變形記</span><span class="crumb" id="crumb"></span><span class="sp"></span>
  <button class="btn" id="bHome" title="回到總覽（Esc）">☰ 總覽</button>
  <button class="btn" id="bFull" title="全螢幕">⛶</button>
  <button class="btn" id="bClose" hidden>✕ 回課文</button>
</header>
<main id="main"></main>
<footer>
  <button class="btn" id="bPrev">← 上一頁</button>
  <span class="pg" id="pg"></span>
  <button class="btn pri" id="bNext">下一步 →</button>
  <button class="btn" id="bReplay" title="重新播放本頁">⟲ 重播</button>
  <button class="btn" id="bPause" title="暫停／繼續動畫">❚❚</button>
  <span class="sp"></span>
  <span class="hint">點畫面或按 → 逐步揭露；← 上一頁；Esc 回總覽</span>
</footer>
</div>
<script>
'use strict';
/* ───────── 小工具 ───────── */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const PUNC = '，。？！；：、「」';
function chars(text, cls, color) {   /* 每字一格；標點縮小不佔格 */
  return [...text].map(c => PUNC.includes(c) ? `<span class="ch p">${c}</span>` : `<span class="ch ${cls || ''}" ${color ? `style="--c:${color}"` : ''}>${c}</span>`).join('');
}
function rowsOf(lines, color, delayBase = 0) {
  return lines.map((l, i) => `<div class="row" style="transition-delay:${delayBase + i * .18}s">${chars(l, '', color)}</div>`).join('');
}
/* 讓字格依序出現（逐字／逐行） */
function stagger(el, per = .045) {
  $$('.ch', el).forEach((c, i) => c.style.transitionDelay = (i * per) + 's');
}

/* ───────── 頁面資料 ───────── */
const C = { sj: 'var(--sj)', cc: 'var(--cc)', yf: 'var(--yf)', gs: 'var(--gs)', jt: 'var(--jt)', ci: 'var(--ci)', qu: 'var(--qu)', xs: 'var(--xs)', fu: 'var(--fu)' };
const PAGES = [];
const P = (id, title, html, init) => PAGES.push({ id, title, html, init });

/* 1 封面 */
P('cover', '封面', `
<div class="cover">
  <h1>詩的變形記</h1>
  <div class="sub">從《詩經》到新詩的千年旅程</div>
  <div class="evo" id="evo">
    ${[['四言', C.sj, [4, 4, 4, 4]], ['長短句', C.cc, [7, 5, 8, 6]], ['方格律詩', C.jt, [5, 5, 5, 5]], ['詞的長短句', C.ci, [4, 7, 3, 6]], ['自由分行', C.xs, [6, 2, 9, 4]]]
      .map(([cap, c, ls], i) => `<div class="blk" style="--c:${c};transition-delay:${i * .22}s">${ls.map(n => `<div class="bar" style="width:${n * 1.25}em"></div>`).join('')}<div class="cap">${cap}</div></div>`).join('')}
  </div>
  <div class="note">每一條線代表一句詩的長短：形式一直在變</div>
  <button class="btn pri" onclick="go(1)">開始探索 →</button>
</div>`, el => setTimeout(() => $$('.blk', el).forEach(b => b.classList.add('show')), 60));

/* 2 總覽時間軸（9 欄：先秦 戰國 西漢 東漢 魏晉南北朝 唐 宋 元 民國） */
const NODES = [
  ['sj', '《詩經》', '先秦', C.sj, '1/2', 1],
  ['cc', '《楚辭》', '戰國～西漢初', C.cc, '2/4', 1],
  ['yf', '樂府詩', '兩漢起', C.yf, '3/6', 2],
  ['gs', '古詩（古體詩）', '兩漢～六朝', C.gs, '3/6', 3],
  ['jt', '近體詩', '唐', C.jt, '6/7', 1],
  ['ci', '詞', '唐～宋', C.ci, '6/8', 3],
  ['qu', '曲', '元', C.qu, '8/9', 2],
  ['xs', '新詩', '五四以來', C.xs, '9/10', 1],
];
P('map', '總覽', `
<h1>詩歌發展總覽</h1>
<div class="hint" style="margin-bottom:.4em">點任一詩體進入專頁；時間為大致發展時期的示意，不是精確斷代</div>
<div class="tl">
  <div class="tl-axis">${['先秦', '戰國', '西漢', '東漢', '魏晉南北朝', '唐', '宋', '元', '五四以來'].map(t => `<span>${t}</span>`).join('')}</div>
  <div class="tl-lanes">
    ${NODES.map(([id, n, t, c, col, row]) => `<div class="node" data-go="${id}" style="--c:${c};grid-column:${col};grid-row:${row}">${n}<small>${t}</small></div>`).join('')}
    <div class="fu-card" data-go="four" style="grid-column:3/5;grid-row:4"><b>漢賦</b>　與詩並列的漢代文體 ▸</div>
  </div>
  <div class="tl-note">● 樂府詩與古詩<b>同在兩漢出現、時間交疊</b>，是兩條並行的路線，不是「樂府結束後才有古詩」。<br>● 虛線卡「漢賦」：漢代最重要的文體之一，鋪陳文采、韻散結合；它和詩並列，不是詩歌主線上的一站，最後「四大韻文」會再出現。</div>
</div>`, el => {
  $$('.fu-card', el).forEach(n => n.onclick = () => go('four'));
  $$('.node,.fu-card', el).forEach((n, i) => n.style.transitionDelay = (i * .08) + 's');
  $$('.node', el).forEach(n => n.onclick = () => go(n.dataset.go));
  if (state.last) { const s = $(`.node[data-go="${state.last}"]`, el); if (s) s.classList.add('sel'); }
});

/* 3 詩經 */
P('sj', '《詩經》', `
<h1 style="color:${C.sj}">《詩經》：整齊的四言世界</h1>
<div class="tags" style="color:${C.sj}"><span class="tag">先秦（約西周初年至春秋中葉）</span><span class="tag">四言為主</span><span class="tag">風・雅・頌</span><span class="tag">賦・比・興</span></div>
<div class="grid2">
  <div>
    <div class="verse" id="sjv">${rowsOf(['關關雎鳩', '在河之洲', '窈窕淑女', '君子好逑'], C.sj)}</div>
    <div class="note">〈周南・關雎〉：四個字一拍，整齊、穩定</div>
  </div>
  <div>
    <div class="card st"><h3>中國最早的詩歌總集・韻文之祖</h3>可概括為黃河流域、北方文學的重要代表（大致的地域概括，不是每一篇都出自同一地區）。</div>
    <div class="card st" style="margin-top:.7em;--c:${C.sj}"><h3>體裁：點一點</h3>
      <div class="chips" data-ex="ex1">${['風', '雅', '頌'].map(x => `<span class="chip" style="--c:${C.sj}">${x}</span>`).join('')}</div><div class="expl" id="ex1" style="--c:${C.sj}"></div>
    </div>
    <div class="card st" style="margin-top:.7em"><h3>表現手法：點一點</h3>
      <div class="chips" data-ex="ex2">${['賦', '比', '興'].map(x => `<span class="chip" style="--c:${C.sj}">${x}</span>`).join('')}</div><div class="expl" id="ex2" style="--c:${C.sj}"></div>
    </div>
  </div>
</div>`, el => {
  stagger($('#sjv', el), .07);
  const EX = { 風: '<b>風</b>：各地的民間歌謠（十五國風）。', 雅: '<b>雅</b>：朝廷宴會、典禮所用的樂歌（大雅、小雅）。', 頌: '<b>頌</b>：宗廟祭祀所用的樂歌（周頌、魯頌、商頌）。',
    賦: '<b>賦</b>＝直接鋪陳敘述：把事情、景物直接說出來。', 比: '<b>比</b>＝譬喻：以彼物比此物。', 興: '<b>興</b>＝起興：先說別的景物，再引出要詠的事。如先寫「關關雎鳩，在河之洲」，再引出「窈窕淑女，君子好逑」。' };
  chipsInit(el, EX);
});

/* 4 楚辭 */
P('cc', '《楚辭》', `

/* 11 總整理＋挑戰 */
const SUM = [
  ['《詩經》', C.sj, '先秦', '四言為主；風雅頌、賦比興', '可配樂歌唱', '最早詩歌總集'],
  ['《楚辭》', C.cc, '戰國～西漢初', '句式較長而靈活，常用「兮」', '楚地歌謠', '騷體・浪漫'],
  ['樂府詩', C.yf, '兩漢起', '長短句、雜言；多敘事', '入樂、可歌', '可歌・長短句'],
  ['古詩', C.gs, '兩漢～六朝', '多五言、七言，句數不限', '以誦讀為主', '五七言・自由'],
  ['近體詩', C.jt, '唐', '絕句四句、律詩八句', '平仄、用韻、對仗', '格線・格律'],
  ['詞', C.ci, '唐～宋', '長短句；小令、中調、長調', '依詞牌，與曲調相關', '詞牌・婉約豪放'],
  ['曲', C.qu, '元', '可加襯字；散曲、劇曲', '依曲牌', '襯字・口語'],
  ['新詩', C.xs, '五四以來', '白話、分行分段', '不拘傳統格律', '白話・自由'],
];
const QUIZ = [
  ['哪一種詩體以四言為主，並分風、雅、頌？', '《詩經》', ['《詩經》', '《楚辭》', '樂府詩', '詞'], '關鍵是「四言」和「風雅頌」。', '提示：想想「關關雎鳩」那種四字一拍的作品。'],
  ['哪一種詩體依詞牌填製，常見長短句？', '詞', ['古詩', '近體詩', '詞', '新詩'], '「詞牌」是辨識詞的關鍵。', '提示：〈如夢令〉、〈念奴嬌〉是什麼的名稱？'],
  ['哪一種詩體講究句數、字數、平仄、用韻與對仗？', '近體詩', ['樂府詩', '近體詩', '古詩', '曲'], '格律最嚴整的是唐代成熟的近體詩。', '提示：想想「先有格線再填字」的那一頁。'],
  ['哪一種詩體可以加入襯字，語言較口語化？', '曲', ['詞', '曲', '新詩', '《楚辭》'], '「襯字」是曲的特色。', '提示：依「曲牌」填寫的是哪一種？'],
];
P('sum', '總整理', `
<h1>總整理與挑戰</h1>
<table class="sum"><tr><th>詩體</th><th>大致時代</th><th>形式特徵</th><th>音樂／格律</th><th>記憶關鍵字</th></tr>
${SUM.map(r => `<tr><td style="--c:${r[1]}">${r[0]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join('')}</table>
<div class="quiz st" id="qz" style="margin-top:.8em"></div>
<div class="st" style="margin-top:.6em;display:flex;gap:.5em"><button class="btn" id="qr">⟲ 重新作答</button><button class="btn" onclick="go(1)">☰ 回到總覽</button></div>`, el => {
  const draw = () => {
    $('#qz', el).innerHTML = QUIZ.map((q, i) => `<div class="q" data-i="${i}"><b>${i + 1}. ${q[0]}</b><div class="opts">${q[2].map(o => `<button class="btn opt">${o}</button>`).join('')}</div><div class="fb"></div></div>`).join('');
    $$('.q', el).forEach(qd => {
      const q = QUIZ[qd.dataset.i];
      $$('.opt', qd).forEach(b => b.onclick = () => {
        if (qd.dataset.done) return;
        if (b.textContent === q[1]) { b.classList.add('ok'); $('.fb', qd).innerHTML = '✔ 答對！' + q[3]; qd.dataset.done = 1; }
        else { b.classList.add('no'); $('.fb', qd).innerHTML = '再想想。' + q[4]; }
      });
    });
  };
  $('#qr', el).onclick = draw; draw();
});

/* ───────── 共用：分類展開 ───────── */
function chipsInit(el, EX) {
  $$('.chips[data-ex]', el).forEach(g => $$('.chip', g).forEach(c => c.onclick = () => {
    $$('.chip', g).forEach(x => x.classList.toggle('on', x === c)); $('#' + g.dataset.ex, el).innerHTML = EX[c.textContent];
  }));
}

/* ───────── 播放控制 ───────── */
const state = { i: 0, last: null };
const main = $('#main');
PAGES.forEach((p, i) => { const s = document.createElement('section'); s.className = 'slide'; s.dataset.i = i; main.appendChild(s); });
function render(i) {
  const p = PAGES[i], s = main.children[i];
  s.innerHTML = p.html; s.scrollTop = 0; s.classList.remove('play');
  p.init && p.init(s);
  requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('play')));
}
function go(t) {
  const i = typeof t === 'number' ? t : PAGES.findIndex(p => p.id === t);
  if (i < 0 || i >= PAGES.length) return;
  if (i > 1) state.last = PAGES[i].id;
  state.i = i;
  [...main.children].forEach((s, k) => s.classList.toggle('on', k === i));
  render(i);
  $('#crumb').textContent = '｜' + PAGES[i].title;
  $('#pg').textContent = (i + 1) + ' / ' + PAGES.length;
  $('#bPrev').disabled = i === 0;
  try { history.replaceState(null, '', '#' + PAGES[i].id); } catch (e) {}
  updNext();
}
function cur() { return main.children[state.i]; }
function pending() { return $$('.st:not(.show):not([data-click])', cur()); }   /* data-click 的由點擊路線展開，不算逐步 */
function updNext() { $('#bNext').textContent = pending().length ? '下一步 ▸' : (state.i < PAGES.length - 1 ? '下一頁 →' : '完'); }
function next() {
  const p = pending();
  if (p.length) { p[0].classList.add('show'); updNext(); return; }
  if (state.i < PAGES.length - 1) go(state.i + 1);
}
function prev() { if (state.i > 0) go(state.i - 1); }
$('#bNext').onclick = next; $('#bPrev').onclick = prev; $('#bHome').onclick = () => go(1);
$('#bReplay').onclick = () => go(state.i);
$('#bPause').onclick = e => { const p = document.body.classList.toggle('paused'); e.currentTarget.textContent = p ? '▶' : '❚❚'; };
$('#bFull').onclick = () => { const d = document.documentElement; if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d); else document.exitFullscreen && document.exitFullscreen(); };
/* 點畫面空白處＝下一步（點按鈕、選項、連結不觸發） */
main.addEventListener('click', e => {
  if (e.target.closest('button,.chip,.node,.branch,.fu-card,a,.opt,svg,table')) return;
  next();
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Escape') { go(1); }
});
/* 從教學網站內嵌開啟時，顯示「回課文」 */
if (window.parent !== window) { const b = $('#bClose'); b.hidden = false; b.onclick = () => window.parent.postMessage({ lbClose: 1 }, '*'); $('#bFull').hidden = true; }
const h = location.hash.slice(1); go(PAGES.findIndex(p => p.id === h) >= 0 ? h : 0);
</script>
</body>
</html>
