<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>詩的變形記</title>
<!-- V240（2026-11-12）〈長干行〉詩的流變動畫頁。依老師〈詩的變形記_互動簡報製作規格.md〉＋老師 11/12 意見改版：
     字放大、多分頁（每個詩體＝特徵頁＋看形式頁）、小標統一為「時代／作者／句式／入樂／其他重要」、總覽點一下往右滑、拿掉漢賦、
     關雎全文、楚辭名句與作者（樂府詩與古詩比較 11/13 移回網站）。iPad 11（1194×834）為主、手機直式可用。全部內嵌、可離線。
     核校清單：教學系統專案根目錄「詩的變形記_內容核校清單.md」 -->
<style>
:root{
  --bg:#F4F0E7; --ink:#252722; --muted:#3f3c35; --line:#cfc5b0; --card:#fffdf8;
  --sj:#8D7655; --cc:#537C83; --yf:#A7794F; --gs:#628475; --jt:#805C4D; --ci:#A88A4D; --qu:#806C8E; --xs:#607F96;
  --fs: clamp(18px, 2.75vw, 40px);
}
*{box-sizing:border-box}
@font-face{font-family:"RayGenRyuRead";src:url("../fonts/genryumin-read-r.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"RayGenRyuRead";src:url("../fonts/genryumin-read-b.woff2") format("woff2");font-weight:700;font-display:swap}
/* 11/13 老師：改源流明體 */
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"RayGenRyuRead","Noto Serif TC","PMingLiU",serif;font-size:var(--fs);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:.4em;padding:.2em .7em;border-bottom:1px solid var(--line);font-size:.62em}
header .t{font-weight:800;letter-spacing:.08em}
header .sp{flex:1}
main{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:.45em .9em .5em;overflow:auto;opacity:0;visibility:hidden;transition:opacity .35s}
.slide.on{opacity:1;visibility:visible}
footer{display:flex;align-items:center;gap:.4em;padding:.25em .6em calc(.25em + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#efe9dc;font-size:.62em}
.btn{border:2px solid #b9ad94;background:var(--card);border-radius:999px;padding:.25em .9em;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f6efe0}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:default}
footer .pg{min-width:3.5em;text-align:center;color:var(--muted)}
footer .sp{flex:1}
footer .hint{color:var(--muted);font-size:.85em}
/* 頁首：詩體名＋第幾頁 */
.ph{display:flex;align-items:baseline;gap:.45em;margin:0 0 .3em;flex-wrap:wrap}
.ph h1{font-size:.95em;margin:0;letter-spacing:.04em;color:var(--c,var(--ink))}
.ph .k{font-size:.62em;color:#fff;background:var(--c,var(--ink));border-radius:6px;padding:.05em .5em;font-weight:700}
.note{font-size:.7em;color:var(--muted);margin-top:.3em;line-height:1.5}
/* 逐步揭露 */
.st{opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s}
.st.show{opacity:1;transform:none}
/* 五項特徵（小標統一） */
.feat{display:grid;grid-template-columns:auto 1fr;gap:.32em .55em;align-items:start}
.feat .lb{font-size:.72em;font-weight:800;color:#fff;background:var(--c);border-radius:8px;padding:.18em .6em;text-align:center;white-space:nowrap;margin-top:.12em}
.feat .tx{line-height:1.45;font-size:.92em}
.feat .tx b{color:var(--c)}
.chips{display:inline-flex;flex-wrap:wrap;gap:.3em;vertical-align:middle}
.chip{border:2px solid var(--c);color:var(--c);background:#fffdf8;border-radius:8px;padding:0 .5em;cursor:pointer;font-weight:800;font-size:.9em}
.chip.on{background:var(--c);color:#fff}
.expl{margin-top:.25em;padding:.25em .6em;border-left:5px solid var(--c);background:#fbf7ee;border-radius:0 8px 8px 0;line-height:1.45;font-size:.88em}
.expl:empty{display:none}
/* 字格 */
.verse{display:flex;flex-direction:column;gap:.22em;align-items:flex-start}
.row{display:flex;gap:.12em;flex-wrap:nowrap;align-items:center}
.ch{position:relative;display:inline-flex;align-items:center;justify-content:center;width:1.45em;height:1.45em;border:2px solid var(--c,#8D7655);border-radius:6px;background:#fff;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.play .ch{opacity:1;transform:none}
.ch.p{border:none;background:none;width:.6em;color:var(--muted)}
.ch.xi{background:#d9e8ea;font-weight:900}
.ch.rhy{outline:3px solid var(--ink);outline-offset:1px}
.ch.dz{background:#efe4dd}
.ch.zz{border-width:2.5px}
.ch.cz{width:1em;height:1em;font-size:.65em;border-style:dashed;background:#efe8f3}
.lab{font-size:.62em;color:var(--muted);margin-left:.4em;white-space:nowrap}
.src{font-size:.68em;color:var(--muted);margin:.15em 0 .5em}
.gap{width:.7em}
/* 封面 */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center;gap:.35em}
.cover h1{font-size:1.8em;letter-spacing:.25em;margin:0}
.cover .sub{color:var(--muted);letter-spacing:.15em}
.evo{display:flex;align-items:flex-end;gap:.8em;margin:.5em 0;flex-wrap:wrap;justify-content:center}
.evo .blk{display:flex;flex-direction:column;gap:.2em;align-items:flex-start;opacity:0;transform:translateX(-10px);transition:opacity .5s,transform .5s}
.evo .blk.show{opacity:1;transform:none}
.evo .bar{height:.42em;border-radius:3px;background:var(--c)}
.evo .cap{font-size:.55em;color:var(--muted);margin-top:.2em;font-weight:700}
/* 總覽：往右滑的時間軸 */
.tl-view{position:relative;overflow:hidden;height:calc(100% - 2.9em);border-radius:12px}
.tl-track{position:absolute;left:0;top:0;height:100%;transition:transform .9s cubic-bezier(.4,.1,.2,1);transform-origin:0 50%}
.tl-axis{position:absolute;left:0;right:0;top:1.3em;border-top:3px solid var(--ink)}
.era{position:absolute;top:.15em;font-size:.6em;color:var(--muted);transform:translateX(-50%);white-space:nowrap;font-weight:700}
.era::after{content:'';position:absolute;left:50%;top:1.55em;width:3px;height:.6em;background:var(--ink)}
.node{position:absolute;border:3px solid var(--c);background:#fffdf8;border-radius:14px;padding:.25em .6em;cursor:pointer;font-weight:900;white-space:nowrap;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s,box-shadow .3s}
.node small{display:block;font-size:.55em;font-weight:500;color:var(--muted)}
.node.show{opacity:1;transform:none}
.node.cur{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 30%,transparent)}
.lane{position:absolute;height:.5em;border-radius:.25em;background:color-mix(in srgb,var(--c) 45%,transparent);opacity:0;transition:opacity .5s}
.lane.show{opacity:1}
.tl-note{font-size:.62em;color:var(--muted);line-height:1.5}
/* 兩漢分支 */
.fork{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.branch{border:3px solid var(--c);border-radius:16px;padding:.4em .6em;background:#fffdf8}
.branch h2{color:var(--c);margin:0 0 .2em;font-size:1.05em}
.branch ul{margin:.1em 0;padding-left:1.1em;line-height:1.5;font-size:.88em}
.root{display:flex;align-items:center;justify-content:center;gap:.4em;margin:.1em 0 .35em}
.root .dot{background:var(--ink);color:#fff;border-radius:999px;padding:.1em .8em;font-weight:900}
.root .ln{height:3px;flex:1;background:var(--line)}
.wave{display:inline-flex;align-items:flex-end;gap:3px;height:.9em;vertical-align:middle;margin-left:.3em}
.wave i{display:block;width:5px;border-radius:2px;background:var(--yf);animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{height:20%}50%{height:100%}}
.paused .wave i{animation-play-state:paused}
/* 比較表 */
table.cmp{border-collapse:collapse;width:100%;font-size:.8em}
table.cmp th,table.cmp td{border:2px solid var(--line);padding:.18em .4em;vertical-align:top;text-align:left;background:#fffdf8;line-height:1.4}
table.cmp thead th{background:#ece4d3;text-align:center}
table.cmp thead th.a{color:#fff;background:var(--yf)}
table.cmp thead th.b{color:#fff;background:var(--gs)}
table.cmp tbody th{white-space:nowrap;background:#f3ecdc;width:4.2em}
table.cmp tr.st{display:table-row}
/* 近體格線 */
.jt-ctrl{display:flex;flex-wrap:wrap;gap:.25em;margin-bottom:.3em;align-items:center;font-size:.7em}
.jt-ctrl .sep{width:2px;height:1.4em;background:var(--line);margin:0 .2em}
.jt-grid .row.empty .ch{color:transparent;background:#fbf8f1;border-style:dashed;opacity:1;transform:none}
.lian{font-size:.55em;color:var(--muted);width:2.2em}
.dz-tag{font-size:.55em;color:#fff;background:var(--jt);border-radius:5px;padding:0 .35em;margin-left:.3em}
/* 詞 */
.ci-line{display:flex;align-items:center;gap:.4em;margin:.12em 0}
.ci-line .n{font-size:.55em;color:var(--muted);width:2.2em;text-align:right}
.ci-line .bar{height:1.45em;border-radius:7px;background:color-mix(in srgb,var(--ci) 22%,#fff);border:2px solid var(--ci);display:flex;align-items:center;padding:0 .4em;white-space:nowrap;transform-origin:left;transform:scaleX(0);transition:transform .45s}
.play .ci-line .bar{transform:scaleX(1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:.35em .6em}
.card h3{margin:0 0 .15em;font-size:1em;color:var(--c,var(--ink))}
/* 新詩 */
.xs-stage{position:relative;height:6.8em}
.xs-grid{display:grid;grid-template-columns:repeat(5,1.45em);gap:.15em;transition:opacity .8s;position:absolute;left:0;top:0}
.xs-grid i{width:1.45em;height:1.45em;border:2px dashed #b9ad94;border-radius:6px;display:flex;align-items:center;justify-content:center;font-style:normal}
.xs-free{position:absolute;left:0;top:0;line-height:1.65;font-size:1.05em;font-weight:600;opacity:0;transition:opacity .9s}
.xs-on .xs-grid{opacity:0}
.xs-on .xs-free{opacity:1}
/* 總整理 */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:.35em}
.sum .card{border-top:8px solid var(--c);padding:.25em .45em}
.sum .card h3{font-size:.95em}
.sum .card div{font-size:.62em;line-height:1.45}
/* 測驗 */
.qbox{max-width:28em}
.qbox .qq{font-weight:800;font-size:1.05em;line-height:1.4;margin:.2em 0 .45em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.35em}
.opt{border:3px solid #b9ad94;background:#fffdf8;border-radius:14px;padding:.3em .5em;cursor:pointer;font-weight:800}
.opt.ok{background:#2d6b4f;color:#fff;border-color:#2d6b4f}
.opt.no{background:#efe6e2;border-color:#b0796a}
.fb{min-height:1.5em;margin-top:.4em;line-height:1.45;font-size:.9em}
/* 手機直式 */
@media (max-width: 760px){
  :root{--fs:17px}
  header,footer{font-size:.85em}
  footer .hint{display:none}
  .fork,.two{grid-template-columns:1fr}
  .sum{grid-template-columns:1fr 1fr}
  .opts{grid-template-columns:1fr}
  .cover h1{font-size:1.5em}
  .ch{width:1.55em;height:1.55em}
  table.cmp{font-size:.8em}
  .tl-view{height:24em}
  #ccv .row{flex-wrap:wrap;row-gap:.12em}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="app">
<header><span class="t">詩的變形記</span><span id="crumb"></span><span class="sp"></span>
  <button class="btn" id="bHome" title="回到總覽（Esc）">☰ 總覽</button>
  <button class="btn" id="bFull" title="全螢幕">⛶</button>
  <button class="btn" id="bClose" hidden>✕ 回課文</button>
</header>
<main id="main"></main>
<footer>
  <button class="btn" id="bPrev">← 上一頁</button>
  <span class="pg" id="pg"></span>
  <button class="btn pri" id="bNext">下一步 →</button>
  <button class="btn" id="bReplay" title="重新播放本頁">⟲ 重播</button>
  <button class="btn" id="bPause" title="暫停／繼續動畫">❚❚</button>
  <span class="sp"></span>
  <span class="hint">點畫面或 → 下一步；← 上一頁；Esc 總覽</span>
</footer>
</div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const PUNC = '，。？！；：、「」';
function chars(text, cls, color) {
  return [...text].map(c => PUNC.includes(c) ? `<span class="ch p">${c}</span>` : `<span class="ch ${cls || ''}" ${color ? `style="--c:${color}"` : ''}>${c}</span>`).join('');
}
function stagger(el, per = .04) { $$('.ch', el).forEach((c, i) => c.style.transitionDelay = (i * per) + 's'); }
const nChars = s => [...s].filter(c => !PUNC.includes(c)).length;

/* ───────── 詩體資料：五項小標統一（時代／作者／句式／入樂／其他重要） ───────── */
const C = { sj: 'var(--sj)', cc: 'var(--cc)', yf: 'var(--yf)', gs: 'var(--gs)', jt: 'var(--jt)', ci: 'var(--ci)', qu: 'var(--qu)', xs: 'var(--xs)' };
const FORMS = {
  sj: { name: '《詩經》', c: C.sj, f: [
    ['時代', '約西周初年至春秋中葉'],
    ['作者', '大多<b>不可考</b>；有各地民間歌謠，也有貴族、樂官的作品'],
    ['句式', '<b>四言</b>為主，常重章疊句'],
    ['入樂', '<b>入樂</b>：原本都可配樂歌唱'],
    ['其他', '中國最早的<b>詩歌總集</b>、韻文之祖；北方文學代表<br>體裁 <span class="chips" data-g="sj1"><span class="chip">風</span><span class="chip">雅</span><span class="chip">頌</span></span>　作法 <span class="chips" data-g="sj1"><span class="chip">賦</span><span class="chip">比</span><span class="chip">興</span></span><div class="expl" id="sj1"></div>'],
  ]},
  cc: { name: '《楚辭》', c: C.cc, f: [
    ['時代', '戰國～西漢初'],
    ['作者', '<b>屈原</b>為代表（〈離騷〉〈九歌〉〈九章〉〈天問〉）；<b>宋玉</b>等人繼承；西漢 <b>劉向</b>輯錄成書'],
    ['句式', '句子較長、靈活，常見六言、七言；多用語助詞「<b>兮</b>」'],
    ['入樂', '源自楚地歌謠，〈九歌〉原是祭神樂歌；多數篇章以吟誦為主'],
    ['其他', '<b>辭賦之祖</b>；又稱「騷體」；浪漫色彩濃厚；南方文學代表'],
  ]},
  yf: { name: '樂府詩', c: C.yf, f: [
    ['時代', '兩漢起（漢武帝時正式成立「樂府」官署）'],
    ['作者', '多為<b>民間百姓</b>（佚名）；魏晉以後有文人仿作'],
    ['句式', '句式自由，多<b>長短句</b>（雜言），五言漸多'],
    ['入樂', '<b>入樂</b>，可歌可誦（後代仿作多不入樂）'],
    ['其他', '「感於哀樂，緣事而發」；多敘事、反映民生；常以「歌」「行」「歌行」為題——〈長干行〉就是李白沿用的樂府舊題'],
  ]},
  gs: { name: '古詩（古體詩）', c: C.gs, f: [
    ['時代', '兩漢～六朝（古詩之名始於唐，用來和近體詩區分）'],
    ['作者', '多為<b>士大夫</b>；〈古詩十九首〉作者不詳'],
    ['句式', '多<b>五言、七言</b>；句數不限，可換韻'],
    ['入樂', '<b>不入樂</b>，只可誦'],
    ['其他', '與樂府詩並稱「<b>漢代詩歌雙葩</b>」；最早的五言詩：班固〈詠史〉；最早的七言詩：曹丕〈燕歌行〉'],
  ]},
  jt: { name: '近體詩', c: C.jt, f: [
    ['時代', '<b>唐代</b>成熟、盛行'],
    ['作者', '李白、杜甫、王維、王之渙、王昌齡等唐代詩人'],
    ['句式', '<b>五言、七言</b>；<b>絕句四句、律詩八句</b>'],
    ['入樂', '不配樂，以吟誦為主（教坊可能加以譜曲歌唱）'],
    ['其他', '又稱「<b>今體詩</b>」；講究<b>平仄、用韻、對仗</b>，一韻到底'],
  ]},
  ci: { name: '詞', c: C.ci, f: [
    ['時代', '興起於唐，發展於五代，<b>大盛於宋</b>'],
    ['作者', '婉約：柳永、李清照；豪放：蘇軾、辛棄疾'],
    ['句式', '<b>長短句</b>；依<b>詞牌</b>規定的句數、字數'],
    ['入樂', '<b>入樂</b>：依曲調填詞，可歌（原名「曲子詞」）'],
    ['其他', '又稱詩餘、長短句、倚聲、樂府；分小令、中調、長調；<b>婉約、豪放</b>兩大風格'],
  ]},
  qu: { name: '曲', c: C.qu, f: [
    ['時代', '<b>元代</b>'],
    ['作者', '元曲四大家：關漢卿、馬致遠、白樸、鄭光祖'],
    ['句式', '依<b>曲牌</b>填寫，可加<b>襯字</b>；口語化、散文化'],
    ['入樂', '<b>入樂</b>，可歌唱'],
    ['其他', '又稱詞餘、樂府；分 <span class="chips" data-g="qu1"><span class="chip">散曲</span><span class="chip">劇曲</span></span><div class="expl" id="qu1"></div>'],
  ]},
  xs: { name: '新詩（現代詩）', c: C.xs, f: [
    ['時代', '<b>五四運動</b>以來'],
    ['作者', '胡適、徐志摩、余光中、鄭愁予等'],
    ['句式', '<b>白話</b>；分行、分段，不限字數'],
    ['入樂', '<b>不入樂</b>（有些作品後來被譜成歌曲）'],
    ['其他', '不拘平仄、不限字數；但仍講究節奏與意象；胡適《嘗試集》是重要的早期新詩集（教材稱「最早的新詩集」）'],
  ]},
};
const CHIPEX = {
  風: '<b>風</b>：各地的民間歌謠（十五國風）', 雅: '<b>雅</b>：朝廷宴會、典禮的樂歌（大雅、小雅）', 頌: '<b>頌</b>：宗廟祭祀的樂歌',
  賦: '<b>賦</b>：直接鋪陳敘述', 比: '<b>比</b>：以彼物比此物（譬喻）', 興: '<b>興</b>：先言他物，引起所要詠的事（如先寫雎鳩鳴叫，再引出淑女）',
  散曲: '<b>散曲</b>：沒有故事情節、供清唱；分<b>小令</b>（單支）與<b>套數</b>（多支聯成一套）', 劇曲: '<b>劇曲</b>：用於戲劇演出，代表為<b>元雜劇</b>（明清傳奇是之後的戲曲發展）',
};

const PAGES = [];
const P = (id, title, html, init, steps) => PAGES.push({ id, title, html, init, steps });
const head = (id, sub) => `<div class="ph" style="--c:${FORMS[id].c}"><h1>${FORMS[id].name}</h1><span class="k">${sub}</span></div>`;
function featPage(id) {

P('map', '總覽', `

<div class="tl-view" id="tlv"><div class="tl-track" id="tlt" style="width:${(8.8 + 2.4) * UX}em">
  <div class="tl-axis"></div>
  ${ERAS.map(([t, x]) => `<div style="position:absolute;top:0;left:${x * UX + 2.3}em"><div class="era">${t}</div></div>`).join('')}
  ${STOPS.map(([id, n, t, x, y, w], i) => `<div class="lane" data-i="${i}" style="--c:${FORMS[id].c};left:${x * UX + 1.6}em;top:${3.1 + y * UY + 2.3}em;width:${w * UX}em"></div>
    <div class="node" data-i="${i}" data-go="${id}" style="--c:${FORMS[id].c};left:${x * UX + .3}em;top:${3.1 + y * UY}em">${n}<small>${t}</small></div>`).join('')}
</div></div>
<div class="tl-note st" id="tln" style="margin-top:.2em">樂府詩與古詩<b>同在兩漢出現、時間交疊</b>：兩條並行的路線，不是「樂府結束後才有古詩」。</div>`,
  el => {
    $$('.node', el).forEach(n => n.onclick = e => { e.stopPropagation(); go(n.dataset.go); });
    el._k = -1;
    el._step = k => {   /* k＝第幾站；k＝STOPS.length 時縮放看全部 */
      const view = $('#tlv', el), track = $('#tlt', el), em = parseFloat(getComputedStyle(track).fontSize);
      if (k >= STOPS.length) {
        const s = Math.min(1, view.clientWidth / track.scrollWidth);
        track.style.transform = `scale(${s})`; $$('.node,.lane', el).forEach(x => x.classList.add('show')); $('#tln', el).classList.add('show');
        $$('.node', el).forEach(x => x.classList.remove('cur')); return;
      }
      $$('.node,.lane', el).forEach(x => { const i = +x.dataset.i; x.classList.toggle('show', i <= k || (k === 2 && i === 3) || (k === 3 && i === 2)); });
      $$('.node', el).forEach(x => x.classList.toggle('cur', +x.dataset.i === k || (k === 2 && +x.dataset.i === 3)));
      if (k === 2) $('#tln', el).classList.add('show');
      const x = (STOPS[k][3] * UX + .3) * em, dx = Math.max(0, Math.min(x - view.clientWidth * .35, track.scrollWidth - view.clientWidth));
      track.style.transform = `translateX(${-dx}px)`;
    };
    if (state.back && state.last) { const i = STOPS.findIndex(s => s[0] === state.last); for (let k = 0; k <= i; k++) el._step(k); el._k = i; }
    else { el._step(0); el._k = 0; }

  el => {   /* 自訂步驟：兩漢一次出樂府＋古詩 */
    const order = [0, 1, 2, 4, 5, 6, 7, STOPS.length];
    const cur = order.indexOf(el._k); if (cur < 0 || cur >= order.length - 1) return false;
    el._k = order[cur + 1]; el._step(el._k); return true;
  });

<div class="row"><span class="lab" style="margin:0 .4em 0 0">加入襯字</span>${[1, 1, 0, 0, 0, 1, 0, 0, 0, 0].map(x => x ? `<span class="ch cz" style="--c:${C.qu}">襯</span>` : `<span class="ch zz" style="--c:${C.qu}">正</span>`).join('')}</div>
<div class="note">示意：大格＝曲牌規定的字，小虛線格＝襯字。襯字讓語氣更像說話。</div></div>`, el => stagger($('#qud', el), .03));

/* ───────── 新詩 ───────── */
featPage('xs');
P('xs2', '新詩｜走出格線', head('xs', '看形式：文字走出格線') + `
<div class="xs-stage" id="xss">
  <div class="xs-grid">${'白日依山盡黃河入海流欲窮千里目更上一層樓'.split('').map(c => `<i>${c}</i>`).join('')}</div>
  <div class="xs-free"><div>輕輕的我走了，</div><div style="padding-left:2em">正如我輕輕的來；</div><div>我輕輕的招手，</div><div style="padding-left:2em">作別西天的雲彩。</div></div>
</div>
<div class="src" id="xsc">格線裡是近體詩〈登鸛雀樓〉</div>
<button class="btn" id="xsb" style="font-size:.7em">▶ 讓文字走出格線</button>`, el => {
  const s = $('#xss', el), cap = $('#xsc', el);
  const set = on => { s.classList.toggle('xs-on', on); cap.textContent = on ? '徐志摩〈再別康橋〉第一節：白話、分行，長短自由' : '格線裡是近體詩〈登鸛雀樓〉'; };
  $('#xsb', el).onclick = e => { e.stopPropagation(); set(!s.classList.contains('xs-on')); };
  setTimeout(() => set(true), 1600);
});

/* ───────── 總整理 ───────── */
const SUMS = [['sj', '先秦', '四言・入樂'], ['cc', '戰國～西漢初', '加「兮」・騷體'], ['yf', '兩漢起', '長短句・入樂'], ['gs', '兩漢～六朝', '五七言・不入樂'], ['jt', '唐', '絕句律詩・格律'], ['ci', '唐～宋', '詞牌・長短句・入樂'], ['qu', '元', '曲牌・襯字・入樂'], ['xs', '五四以來', '白話・分行']];
P('sum', '總整理', `<div class="ph"><h1>總整理</h1><span class="k" style="background:var(--ink)">點卡片回專頁</span></div>
<div class="sum">${SUMS.map(([id, t, k]) => `<div class="card st" data-go="${id}" style="--c:${FORMS[id].c};cursor:pointer"><h3>${FORMS[id].name.replace('（現代詩）', '').replace('（古體詩）', '')}</h3><div>${t}<br><b>${k}</b></div></div>`).join('')}</div>
<div class="note st" style="font-size:.75em;margin-top:.4em">風格記憶語：<b>詩莊・詞媚・曲俗</b>（概括的風格提示，不是每首都如此）</div>`,
  el => $$('.card[data-go]', el).forEach(c => c.onclick = e => { e.stopPropagation(); go(c.dataset.go); }));

/* ───────── 挑戰：一次一題 ───────── */
const QUIZ = [
  ['哪一種詩體以四言為主，並分風、雅、頌？', '《詩經》', ['《詩經》', '《楚辭》', '樂府詩', '詞'], '關鍵是「四言」和「風雅頌」。', '提示：〈關雎〉四字一拍。'],
  ['哪一種詩體可以入樂，句子長短不齊，多為民間作品？', '樂府詩', ['古詩', '樂府詩', '近體詩', '新詩'], '入樂、長短句、民間：樂府詩。', '提示：〈上邪〉、〈長干行〉都屬於它。'],
  ['哪一種詩體講究句數、字數、平仄、用韻與對仗？', '近體詩', ['樂府詩', '近體詩', '古詩', '曲'], '格律最嚴整的是唐代成熟的近體詩。', '提示：「先有格線再填字」。'],
  ['哪一種詩體依詞牌填寫，常見長短句？', '詞', ['古詩', '曲', '詞', '新詩'], '「詞牌」是詞的關鍵。', '提示：〈如夢令〉〈念奴嬌〉是什麼？'],
  ['哪一種詩體可以加入襯字，語言較口語化？', '曲', ['詞', '曲', '新詩', '《楚辭》'], '「襯字」是曲的特色。', '提示：依「曲牌」填寫的是哪一種？'],
];
P('quiz', '挑戰', `<div class="ph"><h1>挑戰</h1><span class="k" style="background:var(--ink)" id="qn"></span></div>
<div class="qbox" id="qb"></div>
<div style="display:flex;gap:.4em;margin-top:.5em;font-size:.7em"><button class="btn" id="qp">← 上一題</button><button class="btn pri" id="qx">下一題 →</button><button class="btn" id="qr">⟲ 重新作答</button><button class="btn" onclick="go(1)">☰ 回總覽</button></div>`, el => {
  let i = 0;
  const draw = () => {
    const q = QUIZ[i]; $('#qn', el).textContent = `第 ${i + 1}／${QUIZ.length} 題`;
    $('#qb', el).innerHTML = `<div class="qq">${q[0]}</div><div class="opts">${q[2].map(o => `<button class="opt">${o}</button>`).join('')}</div><div class="fb"></div>`;
    $$('.opt', el).forEach(b => b.onclick = e => {
      e.stopPropagation(); const box = $('#qb', el); if (box.dataset.done) return;
      if (b.textContent === q[1]) { b.classList.add('ok'); $('.fb', el).innerHTML = '✔ 答對！' + q[3]; box.dataset.done = 1; }
      else { b.classList.add('no'); $('.fb', el).innerHTML = '再想想。' + q[4]; }
    });
    delete $('#qb', el).dataset.done;
  };
  $('#qp', el).onclick = e => { e.stopPropagation(); if (i > 0) { i--; draw(); } };
  $('#qx', el).onclick = e => { e.stopPropagation(); if (i < QUIZ.length - 1) { i++; draw(); } };
  $('#qr', el).onclick = e => { e.stopPropagation(); i = 0; draw(); };
  draw();
});

/* ───────── 播放控制 ───────── */
const state = { i: 0, last: null, back: false };
const main = $('#main');
PAGES.forEach((p, i) => { const s = document.createElement('section'); s.className = 'slide'; main.appendChild(s); });
function go(t, back) {
  const i = typeof t === 'number' ? t : PAGES.findIndex(p => p.id === t);
  if (i < 0 || i >= PAGES.length) return;
  const p = PAGES[i], s = main.children[i];
  if (i > 1) state.last = p.id.replace(/2$/, '');
  state.i = i; state.back = !!back;
  [...main.children].forEach((x, k) => x.classList.toggle('on', k === i));
  s.innerHTML = p.html; s.scrollTop = 0; s.classList.remove('play');
  p.init && p.init(s);
  requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('play')));
  $('#crumb').textContent = '｜' + p.title;
  $('#pg').textContent = (i + 1) + ' / ' + PAGES.length;
  $('#bPrev').disabled = i === 0;
  try { history.replaceState(null, '', '#' + p.id); } catch (e) {}
  updNext();
}
const cur = () => main.children[state.i];
function pending() {
  /* 特徵頁：標籤＋內容一對一起出現 */
  const st = $$('.st:not(.show)', cur());
  if (st[0] && st[0].classList.contains('lb')) return st.slice(0, 2);
  return st.slice(0, 1);
}
function hasMore() { const p = PAGES[state.i]; return pending().length || (p.steps && cur()._k !== undefined && cur()._k !== STOPS.length); }
function updNext() { $('#bNext').textContent = hasMore() ? '下一步 ▸' : (state.i < PAGES.length - 1 ? '下一頁 →' : '完'); }
function next() {
  const p = PAGES[state.i], el = cur();
  if (p.steps && p.steps(el)) { updNext(); return; }
  const ps = pending();
  if (ps.length) { ps.forEach(x => x.classList.add('show')); setTimeout(() => ps[ps.length - 1].scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 60); updNext(); return; }
  if (state.i < PAGES.length - 1) go(state.i + 1);
}
function prev() { if (state.i > 0) go(state.i - 1, true); }
$('#bNext').onclick = next; $('#bPrev').onclick = prev; $('#bHome').onclick = () => go(1, true);
$('#bReplay').onclick = () => go(state.i);
$('#bPause').onclick = e => { const p = document.body.classList.toggle('paused'); e.currentTarget.textContent = p ? '▶' : '❚❚'; };
$('#bFull').onclick = () => { const d = document.documentElement; if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d); else document.exitFullscreen && document.exitFullscreen(); };
main.addEventListener('click', e => { if (e.target.closest('button,.chip,.node,a,.opt,.card[data-go]')) return; next(); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Escape') go(1, true);
});
if (window.parent !== window) { const b = $('#bClose'); b.hidden = false; b.onclick = () => window.parent.postMessage({ lbClose: 1 }, '*'); $('#bFull').hidden = true; }
const h = location.hash.slice(1); go(PAGES.findIndex(p => p.id === h) >= 0 ? h : 0);
</script>
</body>
</html>
