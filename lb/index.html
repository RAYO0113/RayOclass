<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>詩的變形記</title>
<!-- V252（2026-11-15 老師：照「樂府長卷」的做法整個重做）〈長干行〉詩的流變互動頁。
     文字內容＝老師核校過的 V240／V251 版原樣搬來（FORMS、CHIPEX、各詩例、SUMS、QUIZ 一字未改；核校清單：教學系統專案 docs 或根目錄「詩的變形記_內容核校清單.md」），
     這一版只重做呈現與互動：
     ・一種詩體一幅徽宗工筆畫（img/ui/bg，八主題配八詩體），中央留紙色放字；☾ 切夜景
     ・總覽＝可左右拖動的長卷（點畫面往右走一站，最後縮小看全部）
     ・五項特徵的重點字先藏（朱框），按了才揭曉；「答案」鍵一次全開
     ・「看形式」改成動手做：關雎找重複句、楚辭點「兮」、樂府／古詩／曲數字數、近體把詩句排進格線、詞照詞牌填字、曲自己找襯字位置、新詩拆格線
     ・挑戰＝原 5 題＋總整理 8 張關鍵詞卡，洗牌出題
     字體＝源流明體（老師 11/13：不要標楷體）。頁碼代號（#map、#sj、#jt2…）與舊版相同；從網站開（188 的 l7Anim 蓋版）時右上有「✕ 回課文」。
     iPad 11（1194×834）為主、手機直式可用。 -->
<style>
:root{
  --fs:clamp(18px,2.75vw,40px);
  --paper:247,238,214; --ink:#2a2521; --mute:#5a4c3a; --zhu:#a8352a; --zhu-d:#7f241c; --gold:#b08d57; --line:rgba(107,74,43,.32);
  --card:rgba(255,251,240,.88); --cell:#fffaf0; --stx:#fbefdc; --xi:#cfe3e6; --dzb:#f0dfd3;
  --sj:#8D7655; --cc:#537C83; --yf:#A7794F; --gs:#628475; --jt:#805C4D; --ci:#A88A4D; --qu:#806C8E; --xs:#607F96;
  --seal:linear-gradient(135deg,#b83f31,#98291f);
  --ming:"RayGenRyuRead","Noto Serif TC","PMingLiU",serif;
}
body.night{--paper:16,18,26; --ink:#f1e6cb; --mute:#b9a988; --zhu:#e9a45c; --zhu-d:#f0c184; --gold:#d8b878; --line:rgba(240,225,190,.28);
  --card:rgba(22,24,34,.84); --cell:#22252f; --stx:#15161c; --xi:#2f5560; --dzb:#4a3a34;
  --sj:#c9b188; --cc:#8fbcc4; --yf:#d9a877; --gs:#9cc0ae; --jt:#c9a08e; --ci:#d8bb78; --qu:#b9a3c9; --xs:#9bbdd6}
*{box-sizing:border-box}
@font-face{font-family:"RayGenRyuRead";src:url("../fonts/genryumin-read-r.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"RayGenRyuRead";src:url("../fonts/genryumin-read-b.woff2") format("woff2");font-weight:700;font-display:swap}
html,body{margin:0;height:100%;background:#1a1612;color:var(--ink);font-family:var(--ming);font-size:var(--fs);-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
/* ── 場景：兩層交疊換畫，畫面緩慢推移 ── */
.bg{position:fixed;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.4s;animation:drift 40s ease-in-out infinite alternate}
.bg.on{opacity:1}
@keyframes drift{from{transform:scale(1.03) translate(-.6%,.3%)}to{transform:scale(1.1) translate(.8%,-.5%)}}
.veil{position:fixed;inset:0;pointer-events:none;transition:background .8s;
  background:radial-gradient(ellipse 80% 84% at 50% 52%,rgba(var(--paper),.95) 0 70%,rgba(var(--paper),.62) 88%,rgba(var(--paper),.15) 100%)}
body.full .veil{background:rgba(var(--paper),.8)}
body.cover .veil{background:radial-gradient(ellipse 60% 62% at 50% 50%,rgba(var(--paper),.88) 0 58%,rgba(var(--paper),0) 100%)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* ── 上列 ── */
header{display:flex;align-items:center;gap:.3em;padding:.3em .6em;font-size:.58em;background:linear-gradient(rgba(var(--paper),.94),rgba(var(--paper),0))}
.logo{border:0;color:#fbefdc;background:var(--seal);border-radius:4px 7px 4px 8px;box-shadow:inset 0 0 0 1.5px rgba(251,239,220,.55);padding:.1em .45em;font-weight:700;letter-spacing:.1em;transform:rotate(-2deg);margin-right:.2em;white-space:nowrap}
nav{display:flex;gap:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:.2em .42em;border-radius:6px;color:var(--mute);font-weight:700;letter-spacing:.04em;position:relative;white-space:nowrap}
nav button.on{color:var(--zhu-d)}
nav button.on::after{content:'';position:absolute;left:.4em;right:.4em;bottom:0;height:3px;border-radius:50%;background:var(--zhu)}
header .sp{flex:1}
.tool{border:1.5px solid var(--line);background:rgba(var(--paper),.78);border-radius:6px;padding:.2em .7em;white-space:nowrap}
.tool.on{background:var(--zhu);border-color:var(--zhu);color:var(--stx)}
.tool[disabled]{opacity:.35;cursor:default}
main{flex:1;position:relative;overflow:hidden}
#stage{position:absolute;inset:0;overflow:auto;padding:.3em 1.1em .8em;display:flex;flex-direction:column;align-items:center}
#stage>.in{margin:auto;width:min(100%,35em);animation:enter .7s cubic-bezier(.2,.7,.2,1) both}
body.full #stage>.in{width:100%}
@keyframes enter{from{opacity:0;transform:translateY(18px);filter:blur(6px)}}
/* ── 下列 ── */
footer{display:flex;align-items:center;gap:.4em;padding:.25em .6em calc(.3em + env(safe-area-inset-bottom));font-size:.58em;background:linear-gradient(rgba(var(--paper),0),rgba(var(--paper),.94))}
footer .pg{min-width:4em;text-align:center;color:var(--mute)}
footer .sp{flex:1} footer .hint{color:var(--mute)}
.nx{background:var(--seal);border:0;color:#fbefdc;border-radius:6px 9px 5px 10px;padding:.3em 1.1em;font-weight:700;box-shadow:inset 0 0 0 1.5px rgba(251,239,220,.5),0 2px 5px rgba(0,0,0,.25);white-space:nowrap}
#bar{position:absolute;left:0;bottom:0;height:3px;background:var(--zhu);transition:width .5s}
/* ── 內容共用 ── */
.ph{display:flex;align-items:center;gap:.5em;margin:0 0 .35em;flex-wrap:wrap}
.ph h2{margin:0;font-size:1.15em;font-weight:700;letter-spacing:.08em;line-height:1.25;color:var(--c,var(--ink))}
.ph .k{font-size:.62em;color:var(--stx);background:var(--c,var(--zhu));border-radius:4px 7px 4px 8px;padding:.12em .6em;font-weight:700;box-shadow:inset 0 0 0 1.5px rgba(251,239,220,.4)}
.tip{display:inline-block;font-size:.6em;color:var(--zhu-d);border:1px dashed var(--zhu);border-radius:4px;padding:.05em .6em;background:rgba(var(--paper),.7);line-height:1.5}
.cnt{font-size:.68em;color:var(--zhu-d);font-weight:700;min-height:1.6em;margin:.2em 0}
.note{font-size:.78em;color:var(--mute);margin-top:.3em;line-height:1.55}
.src{font-size:.68em;color:var(--mute);margin:.15em 0 .4em}
.split{display:flex;gap:1em;align-items:flex-start;flex-wrap:wrap}
.split .side{flex:1;min-width:8em}
.st{opacity:0;transform:translateY(10px);filter:blur(5px);transition:opacity .55s,transform .55s,filter .55s}
.st.show{opacity:1;transform:none;filter:none}
/* 重點字：先藏（朱框），按了才落下 */
.bk{display:inline-block;color:transparent;border-bottom:2.5px solid var(--zhu);background:rgba(168,53,42,.1);border-radius:4px 4px 0 0;padding:0 .18em;margin:0 .06em;cursor:pointer;font-weight:700;line-height:1.3;transition:color .35s,background .35s;user-select:none;-webkit-user-select:none}
.bk.on{color:var(--c,var(--zhu));background:none;animation:drop .45s cubic-bezier(.3,1.5,.5,1)}
body.night .bk:not(.on){background:rgba(233,164,92,.14)}
@keyframes drop{from{transform:translateY(-.35em) scale(1.25);filter:blur(3px)}}
/* ── 封面 ── */
.cv{text-align:center}
.cv h1{display:flex;align-items:center;justify-content:center;margin:0;font-size:2.7em;letter-spacing:.16em;line-height:1.15;font-weight:700;text-shadow:0 0 .4em rgba(var(--paper),1)}
.cv h1 span{display:inline-block;animation:ink .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.18s + .3s)}
@keyframes ink{from{opacity:0;transform:scale(1.7);filter:blur(10px)}}
.cv h1 .seal{font-size:.3em;font-weight:400;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.1em;line-height:1;margin-left:.9em;padding:.4em .3em .3em;color:#fbefdc;background:var(--seal);border-radius:5px 7px 4px 8px;box-shadow:inset 0 0 0 2px rgba(251,239,220,.55);animation:stamp .45s 1.4s cubic-bezier(.3,1.4,.5,1) both}
@keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-14deg)}}
.cv .sub{letter-spacing:.3em;text-indent:.3em;color:var(--mute);margin:.25em 0 .6em;animation:enter .7s 1.5s both}
.evo{display:flex;align-items:stretch;gap:.35em;margin:0 0 .7em;flex-wrap:wrap;justify-content:center}
.evo .blk{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:4px;padding:.3em .4em .2em;box-shadow:2px 3px 0 rgba(107,74,43,.12);animation:enter .6s both;animation-delay:calc(var(--i)*.28s + 1.8s)}
.evo .erow{display:flex;gap:.07em;margin-bottom:.07em}
.evo .erow i{display:block;width:.3em;height:.3em;border:1.5px solid var(--c);border-radius:1.5px;background:color-mix(in srgb,var(--c) 20%,var(--cell))}
.evo .cap{font-size:.52em;color:var(--mute);margin-top:.3em;font-weight:700;align-self:center}
.evo .arr{align-self:center;color:var(--mute);font-size:.7em;animation:enter .6s both;animation-delay:calc(var(--i)*.28s + 1.7s)}
.toc{display:flex;flex-wrap:wrap;justify-content:center;gap:.35em;font-size:.68em;animation:enter .7s 3s both;margin-bottom:.8em}
.toc button{border:1px solid var(--line);border-top:5px solid var(--c);background:var(--card);border-radius:4px;padding:.3em .7em;box-shadow:2px 3px 0 rgba(107,74,43,.15);font-weight:700;transition:transform .15s}
.toc button:hover{transform:translateY(-3px)}
.toc small{display:block;font-weight:400;color:var(--mute);font-size:.72em}
.cv .nx{font-size:.8em;letter-spacing:.15em;animation:enter .6s 3.3s both}
/* ── 總覽：可拖動的長卷 ── */
.tl-view{position:relative;overflow-x:auto;overflow-y:hidden;height:min(17.8em,calc(100vh - 8.2em));border-radius:4px;border:1px solid var(--line);background:rgba(var(--paper),.55);box-shadow:inset 0 0 2em rgba(107,74,43,.13);cursor:grab;user-select:none;-webkit-user-select:none;scrollbar-width:none}
.tl-view::-webkit-scrollbar{display:none}
.tl-view.all{overflow:hidden;cursor:default}
.tl-track{position:relative;height:100%;width:calc(var(--ux) * 8.8 + 18.9em)}
.tl-view.all .tl-track{width:100%}
.tl-pin{position:absolute;top:0;transition:left 1s cubic-bezier(.4,.1,.2,1)}
.tl-view.all .node i{width:0;margin-right:-.45em;opacity:0}
.tl-axis{position:absolute;left:0;right:0;top:1.3em;height:4px;border-radius:50%;background:linear-gradient(90deg,transparent,var(--ink) 2%,var(--ink) 98%,transparent);opacity:.8}
.tl-era{position:absolute;top:.1em;font-size:.62em;line-height:1.3;color:var(--zhu);background:rgb(var(--paper));border:1px solid var(--zhu);border-radius:3px;padding:0 .45em;transform:translateX(-50%);white-space:nowrap}
.tl-era::after{content:'';position:absolute;left:50%;top:1.6em;width:2px;height:.55em;background:var(--ink)}
.node{position:absolute;display:flex;align-items:center;gap:.45em;font-weight:700;line-height:1.3;border:1.5px solid var(--c);border-left:7px solid var(--c);background:var(--card);border-radius:4px;padding:.2em .7em .2em .25em;cursor:pointer;white-space:nowrap;box-shadow:2px 3px 0 rgba(107,74,43,.16);
  opacity:.4;filter:grayscale(.85);transition:opacity .5s,filter .5s,box-shadow .3s,transform .5s cubic-bezier(.2,.8,.2,1),left 1s cubic-bezier(.4,.1,.2,1);transform:scale(.94)}
.node i{display:block;flex:none;width:2.5em;height:2.5em;border-radius:3px;background:center/cover no-repeat;box-shadow:inset 0 0 0 1px var(--line);transition:width .8s,margin .8s,opacity .5s}
.node small{display:block;font-weight:400;font-size:.55em;color:var(--mute)}
.node.lit{opacity:1;filter:none;transform:none}
.node.cur{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 32%,transparent),2px 3px 0 rgba(107,74,43,.16)}
.lane{position:absolute;height:.4em;border-radius:.3em .5em .5em .3em;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 75%,transparent),color-mix(in srgb,var(--c) 18%,transparent));transform-origin:left;transform:scaleX(0);opacity:0;transition:opacity .4s,transform 1s cubic-bezier(.3,.7,.2,1) .15s,left 1s cubic-bezier(.4,.1,.2,1),width 1s cubic-bezier(.4,.1,.2,1)}
.lane.lit{opacity:1;transform:none}
.tl-note{font-size:.62em;color:var(--mute);line-height:1.5}
/* ── 特徵頁：直式朱印＋五項（小標＝印章） ── */
.era{display:grid;grid-template-columns:auto 1fr;gap:0 .9em;align-items:start}
.era .big{writing-mode:vertical-rl;text-orientation:upright;font-size:2.3em;font-weight:700;letter-spacing:.1em;line-height:1;color:var(--stx);background:var(--c);border-radius:8px 12px 7px 14px;padding:.3em .18em .22em;box-shadow:inset 0 0 0 3px rgba(251,239,220,.45),0 6px 18px rgba(0,0,0,.3);transform:rotate(-2deg);animation:stamp .55s .25s cubic-bezier(.3,1.4,.5,1) both}
.feat{display:grid;grid-template-columns:auto 1fr;gap:.32em .55em;align-items:start}
.feat .lb{font-size:.78em;color:var(--stx);background:var(--c);border-radius:4px 7px 4px 8px;box-shadow:inset 0 0 0 1.5px rgba(251,239,220,.4);padding:.16em .6em;text-align:center;white-space:nowrap;margin-top:.1em;font-weight:700}
.feat .tx{line-height:1.45;font-size:.92em}
.chips{display:inline-flex;flex-wrap:wrap;gap:.3em;vertical-align:middle}
.chip{border:1.5px solid var(--c);color:var(--c);background:var(--cell);border-radius:4px;padding:0 .5em;cursor:pointer;font-size:.92em;box-shadow:1px 2px 0 rgba(107,74,43,.14);font-weight:700}
.chip.on{background:var(--c);color:var(--stx)}
.expl{margin-top:.25em;padding:.25em .6em;border-left:4px solid var(--c);background:var(--card);border-radius:0 6px 6px 0;line-height:1.45;font-size:.88em}
.expl:empty{display:none}
.expl b{color:var(--c)}
.rail{display:flex;align-items:flex-start;justify-content:space-between;position:relative;margin:.9em .4em 0;font-size:.58em}
.rail::before{content:'';position:absolute;left:0;right:0;top:.42em;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,var(--mute) 4%,var(--mute) 96%,transparent);opacity:.6}
.rail button{position:relative;border:0;background:none;padding:1.1em .2em 0;color:var(--mute);font-weight:700}
.rail button::before{content:'';position:absolute;left:50%;top:0;width:.8em;height:.8em;margin-left:-.4em;border-radius:50%;background:rgb(var(--paper));border:2.5px solid var(--mute);transition:all .4s}
.rail button.done::before{background:var(--mute)}
.rail button.on{color:var(--c)}
.rail button.on::before{background:var(--c);border-color:var(--c);transform:scale(1.5);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 25%,transparent)}
/* ── 字格：米字格，落墨出現 ── */
.verse{display:flex;flex-direction:column;gap:.22em;align-items:flex-start}
.row{display:flex;gap:.12em;flex-wrap:nowrap;align-items:center}
.ch{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:1.45em;height:1.45em;border:1.5px solid var(--c,var(--gold));border-radius:3px;
  background:linear-gradient(90deg,transparent calc(50% - .5px),color-mix(in srgb,var(--c,#8D7655) 24%,transparent) calc(50% - .5px),color-mix(in srgb,var(--c,#8D7655) 24%,transparent) calc(50% + .5px),transparent calc(50% + .5px)),
    linear-gradient(0deg,transparent calc(50% - .5px),color-mix(in srgb,var(--c,#8D7655) 24%,transparent) calc(50% - .5px),color-mix(in srgb,var(--c,#8D7655) 24%,transparent) calc(50% + .5px),transparent calc(50% + .5px)),var(--cell);
  transition:color .45s,background .35s,box-shadow .3s;animation:inkc .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 1s)}
@keyframes inkc{from{opacity:0;transform:scale(1.5);filter:blur(4px)}}
.ch.p{border:none;background:none;width:.6em;color:var(--mute)}
.lab{font-size:.62em;color:var(--mute);margin-left:.5em;white-space:nowrap;font-weight:400}
.lab.bk{font-weight:700}
/* 還沒放字的格子：虛線空格 */
.hid:not(.on) .ch{color:transparent;border-style:dashed}
/* 關雎：點一句，同樣的句子一起亮 */
.hf{display:inline-flex;gap:.12em;cursor:pointer;border-radius:4px}
.hf.same .ch:not(.p){background:color-mix(in srgb,var(--zhu) 22%,var(--cell));box-shadow:0 0 0 2px var(--zhu);font-weight:700}
/* 楚辭：兮 */
#ccv .ch:not(.p){cursor:pointer}
.ch.xi.on{background:var(--xi);font-weight:700;box-shadow:0 0 0 2px var(--cc)}
/* 兩漢分支 */
.fork{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.branch{border:1px solid var(--line);border-top:6px solid var(--c);border-radius:4px;padding:.35em .65em .4em;background:var(--card);box-shadow:2px 3px 0 rgba(107,74,43,.13)}
.branch h3{font-weight:700;color:var(--c);margin:0 0 .2em;font-size:1.08em}
.branch ul{margin:.1em 0;padding-left:1.1em;line-height:1.55;font-size:.9em}
.root{display:flex;align-items:center;justify-content:center;gap:.4em;margin:.1em 0 .35em}
.root .dot{background:var(--seal);color:#fbefdc;border-radius:4px 7px 4px 8px;box-shadow:inset 0 0 0 1.5px rgba(251,239,220,.5);padding:.08em .7em;letter-spacing:.15em}
.root .ln{height:3px;flex:1;border-radius:50%;background:linear-gradient(90deg,transparent,var(--mute))}
.root .ln:last-child{transform:scaleX(-1)}
.wave{display:inline-flex;align-items:flex-end;gap:3px;height:.9em;vertical-align:middle;margin-left:.3em}
.wave i{display:block;width:5px;border-radius:2px;background:var(--yf);animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{height:20%}50%{height:100%}}
/* 近體：把詩句排進格線 */
.ctrl{display:flex;flex-wrap:wrap;gap:.25em;margin-bottom:.35em;align-items:center;font-size:.66em}
.ctrl .sep{width:2px;height:1.4em;background:var(--line);margin:0 .2em}
.lian{font-size:.55em;color:var(--mute);width:2.2em;flex:none}
.dz-tag{display:none;font-size:.55em;color:var(--stx);background:var(--jt);border-radius:3px 5px 3px 6px;padding:0 .4em;margin-left:.3em;white-space:nowrap}
.jt-grid.dz .row.on .dz-tag{display:inline}
.jt-grid.dz .row.on .ch.d{background:var(--dzb)}
.jt-grid.rhy .row.on .ch.r{box-shadow:0 0 0 3px var(--zhu)}
.tray{flex:1;min-width:8em;display:flex;flex-wrap:wrap;gap:.35em;align-content:flex-start}
.tile{border:1.5px solid var(--jt);border-bottom-width:4px;background:var(--card);border-radius:4px;padding:.12em .55em;font-weight:700;letter-spacing:.12em;box-shadow:2px 3px 0 rgba(107,74,43,.16);transition:transform .15s,opacity .3s}
.tile:hover{transform:translateY(-2px)}
.tile.used{opacity:0;pointer-events:none}
.tray .msg{flex-basis:100%;font-size:.7em;color:var(--mute)}
/* 詞：詞牌先定格子，再填字 */
.ci-line{display:flex;align-items:center;gap:.4em;margin:.1em 0;cursor:pointer}
.ci-line .n{font-size:.55em;color:var(--mute);width:2.2em;text-align:right;flex:none}
/* 曲：襯字 */
.cz-play{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;margin:.2em 0}
.cz-yt{position:fixed;left:-400px;top:0;width:200px;height:113px;opacity:0;pointer-events:none}   /* 只出聲：播放器放在畫面外 */
.cz-yt.show{position:static;opacity:1;pointer-events:auto}
.cz-yt iframe{display:block;border:0}
.cz-gap{flex:none;width:.6em}
.cz-demo{display:flex;flex-direction:column;gap:.55em;margin:.2em 0 .3em}
.cz-row{display:flex;align-items:center;gap:.1em}
.cz-tag{font-size:.6em;font-weight:700;color:var(--stx);background:var(--qu);border-radius:4px 7px 4px 8px;box-shadow:inset 0 0 0 1.5px rgba(251,239,220,.4);padding:.12em .45em;margin-right:.4em;min-width:3.6em;text-align:center;flex:none}
.slot{flex:none;width:.95em;height:1.9em;border:0;background:none;padding:0;color:var(--qu);font-size:.72em;font-weight:700;opacity:.6;border-radius:4px}
.slot:hover{opacity:1;background:color-mix(in srgb,var(--qu) 18%,transparent)}
.cz-on .slot{display:none}
.ch.cz-new{color:var(--stx);background:var(--qu);border-width:3px;margin:0 .1em;transition:width .5s,border-width .5s,margin .5s,opacity .5s}
.ch.cz-new.hid:not(.on){width:0;border-width:0;margin:0;opacity:0;overflow:hidden}
.ch.cz-new::after{content:'襯字';position:absolute;top:-1.5em;left:50%;transform:translateX(-50%);font-size:.5em;color:var(--qu);font-weight:700;white-space:nowrap}
/* 新詩：拆格線 */
.xs-stage{position:relative;height:6.8em;cursor:pointer}
.xs-grid{display:grid;grid-template-columns:repeat(5,1.45em);gap:.15em;position:absolute;left:0;top:0}
.xs-grid i{width:1.45em;height:1.45em;border:1.5px dashed var(--gold);border-radius:3px;background:var(--cell);display:flex;align-items:center;justify-content:center;font-style:normal;transition:opacity .9s,transform 1s cubic-bezier(.3,.6,.3,1),border-color .5s}
.xs-free{position:absolute;left:0;top:0;line-height:1.65;font-size:1.05em;font-weight:700;opacity:0;transform:translateY(8px);filter:blur(5px);transition:opacity .9s .35s,transform .9s .35s,filter .9s .35s;pointer-events:none}
.xs-on .xs-grid i{opacity:0;transform:translate(var(--rx),var(--ry)) rotate(var(--rr))}
.xs-on .xs-free{opacity:1;transform:none;filter:none}
.xs-free>div{white-space:nowrap}
.bh{color:var(--xs);background:color-mix(in srgb,var(--xs) 16%,transparent);border-radius:4px;padding:0 .05em}
.xs-rules{flex:1;min-width:9em;display:flex;flex-direction:column;gap:.35em;font-size:.72em}
.xr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.4em;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.3em .55em;line-height:1.35;box-shadow:2px 3px 0 rgba(107,74,43,.1)}
.xr::before{content:'→';grid-column:2;grid-row:1;color:var(--xs);font-weight:700}
.xr .a{grid-column:1;grid-row:1;color:var(--mute);text-decoration:line-through;text-decoration-color:#b0796a;text-decoration-thickness:2px}
.xr .b{grid-column:3;grid-row:1;color:var(--xs);font-weight:700}
.wq{font-size:1.08em;line-height:1.7;font-weight:700}
.wq-l.st{transform:translateX(-10px)}
.wq-l.st.show{transform:none}
.wq-l b{color:var(--xs)}
/* 總整理 */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:.4em}
.sum .card{background:var(--card);border:1px solid var(--line);border-top:7px solid var(--c);border-radius:4px;padding:0 0 .25em;box-shadow:2px 3px 0 rgba(107,74,43,.12);cursor:pointer;overflow:hidden}
.sum .card i{display:block;height:2.3em;background:center/cover no-repeat}
.sum .card h3{font-weight:700;margin:.15em .45em 0;font-size:.98em;color:var(--c)}
.sum .card div{font-size:.62em;line-height:1.45;margin:0 .7em}
/* 挑戰 */
.gm{text-align:center}
.gm .q{min-height:3.6em;display:flex;align-items:center;justify-content:center;font-size:1.12em;font-weight:700;line-height:1.45;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.4em .8em;box-shadow:3px 4px 0 rgba(107,74,43,.15);margin:.1em 0 .5em}
.gm .q.in2{animation:enter .45s both}
.gm .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:.45em}
.gm .opts button{border:2px solid var(--mute);background:rgba(var(--paper),.9);border-radius:8px;padding:.4em .2em;font-weight:700;box-shadow:2px 3px 0 rgba(107,74,43,.18);transition:transform .1s,background .2s}
.gm .opts button:active{transform:translateY(2px)}
.gm .opts button.ok{background:#3f6b52;border-color:#3f6b52;color:#fff}
.gm .opts button.no{background:#b0796a;border-color:#b0796a;color:#fff}
.gm .fb{min-height:3em;margin:.45em 0 .1em;font-size:.82em;line-height:1.5}
.gm .sc{font-size:.66em;color:var(--mute);letter-spacing:.1em}
.gm .dots{display:flex;gap:.25em;justify-content:center;margin:.3em 0;flex-wrap:wrap}
.gm .dots i{width:.5em;height:.5em;border-radius:50%;background:var(--line)}
.gm .dots i.ok{background:#3f6b52}.gm .dots i.no{background:#b0796a}.gm .dots i.cur{outline:2px solid var(--zhu);outline-offset:2px}
/* 手機直式 */
@media (max-width:760px){
  :root{--fs:17px}
  header{font-size:.72em}footer{font-size:.75em}
  footer .hint,.logo{display:none}
  #stage{padding:.3em .7em 1em}
  .veil,body.cover .veil{background:rgba(var(--paper),.9)}
  .cv h1{font-size:1.7em;letter-spacing:.06em}
  .evo .arr{display:none}
  .era{grid-template-columns:1fr}.era .big{writing-mode:horizontal-tb;font-size:1.3em;justify-self:start;margin-bottom:.3em;padding:.1em .4em}
  .fork{grid-template-columns:1fr}
  .sum{grid-template-columns:1fr 1fr}
  .gm .opts{grid-template-columns:1fr 1fr}
  .ch{width:1.5em;height:1.5em}
  #ccv .row,.cz-row{flex-wrap:wrap;row-gap:.12em}
  .rail{font-size:.62em;margin:.9em 0 0}
  .tl-view{height:19em}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div><div class="veil"></div>
<div id="app">
  <header><button class="logo" id="bLogo" title="回封面">詩的變形記</button><nav id="nav"></nav><span class="sp"></span>
    <button class="tool" id="bAns" title="本頁重點全部顯示／藏起來">答案</button>
    <button class="tool" id="bNight" title="日／夜">☾</button>
    <button class="tool" id="bFull" title="全螢幕">⛶</button>
    <button class="tool" id="bClose" hidden>✕ 回課文</button></header>
  <main><div id="stage"></div><div id="bar"></div></main>
  <footer><button class="tool" id="bPrev">← 上一頁</button><span class="pg" id="pg"></span><button class="nx" id="bNext">下一步 ▸</button>
    <button class="tool" id="bReplay" title="本頁重來">⟲ 重來</button>
    <span class="sp"></span><span class="hint">點畫面或 → 下一步・點朱框揭曉・Esc 回長卷</span></footer>
</div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const PUNC = '，。？！；：、「」';
function chars(text, cls, color) {
  return [...text].map(c => PUNC.includes(c) ? `<span class="ch p">${c}</span>` : `<span class="ch ${cls || ''}" ${color ? `style="--c:${color}"` : ''}>${c}</span>`).join('');
}
function stagger(el, per = .04) { $$('.ch', el).forEach((c, i) => c.style.setProperty('--d', i * per)); }
const nChars = s => [...s].filter(c => !PUNC.includes(c)).length;
const shake = el => el.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(-3px)' }, { transform: 'none' }], { duration: 320 });

/* ───────── 詩體資料：五項小標統一（時代／作者／句式／入樂／其他重要）。以下文字為老師核校版，不要改 ───────── */
const C = { sj: 'var(--sj)', cc: 'var(--cc)', yf: 'var(--yf)', gs: 'var(--gs)', jt: 'var(--jt)', ci: 'var(--ci)', qu: 'var(--qu)', xs: 'var(--xs)' };
const FORMS = {
  sj: { name: '《詩經》', c: C.sj, f: [
    ['時代', '約西周初年至春秋中葉'],
    ['作者', '大多<b>不可考</b>；有各地民間歌謠，也有貴族、樂官的作品'],
    ['句式', '<b>四言</b>為主，常重章疊句'],
    ['入樂', '<b>入樂</b>：原本都可配樂歌唱'],
    ['其他', '中國最早的<b>詩歌總集</b>、韻文之祖；北方文學代表<br>體裁 <span class="chips" data-g="sj1"><span class="chip">風</span><span class="chip">雅</span><span class="chip">頌</span></span>　作法 <span class="chips" data-g="sj1"><span class="chip">賦</span><span class="chip">比</span><span class="chip">興</span></span><div class="expl" id="sj1"></div>'],
  ]},
  cc: { name: '《楚辭》', c: C.cc, f: [
    ['時代', '戰國～西漢初'],
    ['作者', '<b>屈原</b>為代表（〈離騷〉〈九歌〉〈九章〉〈天問〉）；<b>宋玉</b>等人繼承；西漢 <b>劉向</b>輯錄成書'],
    ['句式', '句子較長、靈活，常見六言、七言；多用語助詞「<b>兮</b>」'],
    ['入樂', '源自楚地歌謠，〈九歌〉原是祭神樂歌；多數篇章以吟誦為主'],
    ['其他', '<b>辭賦之祖</b>；又稱「騷體」；浪漫色彩濃厚；南方文學代表'],
  ]},
  yf: { name: '樂府詩', c: C.yf, f: [
    ['時代', '兩漢起（漢武帝時正式成立「樂府」官署）'],
    ['作者', '多為<b>民間百姓</b>（佚名）；魏晉以後有文人仿作'],
    ['句式', '句式自由，多<b>長短句</b>（雜言），五言漸多'],
    ['入樂', '<b>入樂</b>，可歌可誦（後代仿作多不入樂）'],
    ['其他', '「感於哀樂，緣事而發」；多敘事、反映民生；常以「歌」「行」「歌行」為題——〈長干行〉就是李白沿用的樂府舊題'],
  ]},
  gs: { name: '古詩（古體詩）', c: C.gs, f: [
    ['時代', '兩漢～六朝（古詩之名始於唐，用來和近體詩區分）'],
    ['作者', '多為<b>士大夫</b>；〈古詩十九首〉作者不詳'],
    ['句式', '多<b>五言、七言</b>；句數不限，可換韻'],
    ['入樂', '<b>不入樂</b>，只可誦'],
    ['其他', '與樂府詩並稱「<b>漢代詩歌雙葩</b>」；最早的五言詩：班固〈詠史〉；最早的七言詩：曹丕〈燕歌行〉'],
  ]},
  jt: { name: '近體詩', c: C.jt, f: [
    ['時代', '<b>唐代</b>成熟、盛行'],
    ['作者', '李白、杜甫、王維、王之渙、王昌齡等唐代詩人'],
    ['句式', '<b>五言、七言</b>；<b>絕句四句、律詩八句</b>'],
    ['入樂', '不配樂，以吟誦為主（教坊可能加以譜曲歌唱）'],
    ['其他', '又稱「<b>今體詩</b>」；講究<b>平仄、用韻、對仗</b>，一韻到底'],
  ]},
  ci: { name: '詞', c: C.ci, f: [
    ['時代', '興起於唐，發展於五代，<b>大盛於宋</b>'],
    ['作者', '婉約：柳永、李清照；豪放：蘇軾、辛棄疾'],
    ['句式', '<b>長短句</b>；依<b>詞牌</b>規定的句數、字數'],
    ['入樂', '<b>入樂</b>：依曲調填詞，可歌（原名「曲子詞」）'],
    ['其他', '又稱詩餘、長短句、倚聲、樂府；分小令、中調、長調；<b>婉約、豪放</b>兩大風格'],
  ]},
  qu: { name: '曲', c: C.qu, f: [
    ['時代', '<b>元代</b>'],
    ['作者', '元曲四大家：關漢卿、馬致遠、白樸、鄭光祖'],
    ['句式', '依<b>曲牌</b>填寫，可加<b>襯字</b>；口語化、散文化'],
    ['入樂', '<b>入樂</b>，可歌唱'],
    ['其他', '又稱詞餘、樂府；分 <span class="chips" data-g="qu1"><span class="chip">散曲</span><span class="chip">劇曲</span></span><div class="expl" id="qu1"></div>'],
  ]},
  xs: { name: '新詩（現代詩）', c: C.xs, f: [
    ['時代', '<b>五四運動</b>以來'],
    ['作者', '胡適、徐志摩、余光中、鄭愁予等'],
    ['句式', '<b>白話</b>；分行、分段，不限字數'],
    ['入樂', '<b>不入樂</b>（有些作品後來被譜成歌曲）'],
    ['其他', '不拘平仄、不限字數；但仍講究節奏與意象；胡適《嘗試集》是重要的早期新詩集（教材稱「最早的新詩集」）'],
  ]},
};
const CHIPEX = {
  風: '<b>風</b>：各地的民間歌謠（十五國風）', 雅: '<b>雅</b>：朝廷宴會、典禮的樂歌（大雅、小雅）', 頌: '<b>頌</b>：宗廟祭祀的樂歌',
  賦: '<b>賦</b>：直接鋪陳敘述', 比: '<b>比</b>：以彼物比此物（譬喻）', 興: '<b>興</b>：先言他物，引起所要詠的事（如先寫雎鳩鳴叫，再引出淑女）',
  散曲: '<b>散曲</b>：沒有故事情節、供清唱；分<b>小令</b>（單支）與<b>套數</b>（多支聯成一套）', 劇曲: '<b>劇曲</b>：用於戲劇演出，代表為<b>元雜劇</b>（明清傳奇是之後的戲曲發展）',
};
const NAME = id => FORMS[id].name.replace(/（.*）/, ''), SEAL = id => NAME(id).replace(/[《》]/g, '');
const IDS = Object.keys(FORMS);
/* 一種詩體一幅畫（img/ui/bg 八主題） */
const BG = { cover: '2-garden', map: '8-booklover', sj: '2-garden', cc: '3-westlake', yf: '1-fuguang', gs: '7-dongpo', jt: '6-gugong', ci: '5-lookback', qu: '4-snowpeak', xs: '8-booklover', sum: '8-booklover', quiz: '2-garden' };
const th = id => `<i data-th="${BG[id]}"></i>`;

const S = [];   /* {id, ch 章, title, html, init, steps, more, full, cls} */
const P = (id, ch, title, html, o) => S.push(Object.assign({ id, ch, title, html, bg: BG[ch] }, o || {}));
const head = (id, sub) => `<div class="ph" style="--c:${FORMS[id].c}"><h2>${FORMS[id].name}</h2><span class="k">${sub}</span></div>`;
const rail = id => `<div class="rail" style="--c:${FORMS[id].c}">${IDS.map((x, j) => `<button data-go="${x}" class="${x === id ? 'on' : j < IDS.indexOf(id) ? 'done' : ''}">${SEAL(x)}</button>`).join('')}</div>`;
function featPage(id) {
  const F = FORMS[id];
  P(id, id, F.name + '｜特徵', `<div class="era" style="--c:${F.c}"><div class="big">${SEAL(id)}</div><div>${head(id, '特徵')}
    <div class="feat" data-hide>${F.f.map(([l, t]) => `<div class="lb st">${l}</div><div class="tx st">${t}</div>`).join('')}</div></div></div>${rail(id)}`,
    { init: el => $$('.chips[data-g]', el).forEach(g => $$('.chip', g).forEach(c => c.onclick = e => { e.stopPropagation(); $$('.chips[data-g="' + g.dataset.g + '"] .chip', el).forEach(x => x.classList.toggle('on', x === c)); $('#' + g.dataset.g, el).innerHTML = CHIPEX[c.textContent]; })) });
}

/* ───────── 1 封面 ───────── */
P('cover', 'cover', '封面', `
<div class="cv">
  <h1>${[...'詩的變形記'].map((c, i) => `<span style="--i:${i}">${c}</span>`).join('')}<span class="seal">流變</span></h1>
  <div class="sub">從《詩經》到新詩的千年旅程</div>
  <div class="evo">${[['四言', C.sj, [4, 4, 4, 4]], ['長短句', C.cc, [7, 5, 8, 6]], ['方整格律', C.jt, [5, 5, 5, 5]], ['詞的長短句', C.ci, [4, 7, 3, 6]], ['自由分行', C.xs, [6, 2, 9, 4]]]
    .map(([cap, c, ls], i) => `${i ? `<span class="arr" style="--i:${i}">→</span>` : ''}<div class="blk" style="--c:${c};--i:${i}">${ls.map(n => `<div class="erow">${'<i></i>'.repeat(n)}</div>`).join('')}<div class="cap">${cap}</div></div>`).join('')}</div>
  <div class="toc" id="toc"></div>
  <button class="nx" data-go="map">開始探索 →</button>
</div>`, { cls: 'cover' });

/* ───────── 2 總覽：可拖動的長卷；點一下往右走一站 ───────── */
const ERAS = [['先秦', 0], ['戰國', 1], ['兩漢', 2.2], ['魏晉南北朝', 3.6], ['唐', 5], ['宋', 6.2], ['元', 7.4], ['五四以來', 8.8]];
const STOPS = [   /* [id, 名稱, 時代說明, x(格), y(列), 線段長] */
  ['sj', '《詩經》', '西周初～春秋中葉', 0, 0, 0.9],
  ['cc', '《楚辭》', '戰國～西漢初', 1, 1, 1.6],
  ['yf', '樂府詩', '兩漢起・入樂', 2.2, 0, 2.6],
  ['gs', '古詩', '兩漢～六朝・不入樂', 2.2, 2, 2.6],
  ['jt', '近體詩', '唐', 5, 0, 1],
  ['ci', '詞', '唐～宋', 5.2, 2, 1.9],
  ['qu', '曲', '元', 7.4, 1, 0.9],
  ['xs', '新詩', '五四以來', 8.8, 0, 0.8],
];
const UX = 7, UY = 4.6, Y0 = 3.2;   /* 每一格寬 em、每一列高 em、第一列起點 */
S.find(s => s.id === 'cover').init = el => { $('#toc', el).innerHTML = STOPS.map(([id, n, t]) => `<button data-go="${id}" style="--c:${FORMS[id].c}">${n}<small>${t}</small></button>`).join(''); };
P('map', 'map', '總覽', `
<div class="ph"><h2>詩歌發展總覽</h2><span class="tl-note">左右拖動看長卷；點畫面往右走一站；點詩體進專頁；時間是大致示意</span></div>
<div class="tl-view" id="tlv"><div class="tl-track" id="tlt" style="--ux:${UX}em">
  <div class="tl-axis"></div>
  ${ERAS.map(([t, x]) => `<div class="tl-pin" style="left:calc(var(--ux) * ${x} + 2.6em)"><div class="tl-era">${t}</div></div>`).join('')}
  ${STOPS.map(([id, n, t, x, y, w], i) => `<div class="lane" data-i="${i}" style="--c:${FORMS[id].c};left:calc(var(--ux) * ${x} + 1.6em);top:${Y0 + y * UY + 3.35}em;width:calc(var(--ux) * ${w})"></div>
    <div class="node" data-i="${i}" data-go="${id}" style="--c:${FORMS[id].c};left:calc(var(--ux) * ${x} + .5em);top:${Y0 + y * UY}em">${th(id)}<span>${n}<small>${t}</small></span></div>`).join('')}
</div></div>
<div class="tl-note st" id="tln" style="margin-top:.25em">樂府詩與古詩<b>同在兩漢出現、時間交疊</b>：兩條並行的路線，不是「樂府結束後才有古詩」。</div>`,
  { full: true,
    init: el => {
      const view = $('#tlv', el), track = $('#tlt', el);
      el._k = -1;
      el._step = (k, instant) => {   /* k＝第幾站；k＝STOPS.length 時縮小看全部 */
        if (k >= STOPS.length) {
          const em = parseFloat(getComputedStyle(track).fontSize);   /* 收攏：格距縮到整卷剛好一個畫面，字不縮 */
          view.scrollTo({ left: 0, behavior: 'smooth' }); view.classList.add('all');

          $$('.node,.lane', el).forEach(x => x.classList.add('lit')); $('#tln', el).classList.add('show');
          $$('.node', el).forEach(x => x.classList.remove('cur')); return;
        }
        view.classList.remove('all'); track.style.setProperty('--ux', UX + 'em');
        $$('.node,.lane', el).forEach(x => { const i = +x.dataset.i; x.classList.toggle('lit', i <= k || (k === 2 && i === 3)); });
        $$('.node', el).forEach(x => x.classList.toggle('cur', +x.dataset.i === k || (k === 2 && +x.dataset.i === 3)));
        if (k >= 2) $('#tln', el).classList.add('show');
        const n = $(`.node[data-i="${k}"]`, el);
        view.scrollTo({ left: Math.max(0, n.offsetLeft - view.clientWidth * .3), behavior: instant ? 'auto' : 'smooth' });
      };
      /* 滑鼠拖動（觸控用原生橫向捲動） */
      let d = null;
      view.onpointerdown = e => { if (e.pointerType === 'mouse' && !view.classList.contains('all')) d = { x: e.clientX, l: view.scrollLeft, m: false }; };
      view.onpointermove = e => { if (!d) return; const dx = e.clientX - d.x; if (Math.abs(dx) > 6) d.m = true; if (d.m) view.scrollLeft = d.l - dx; };
      view.onpointerup = view.onpointerleave = () => { if (d && d.m) { st.drag = true; setTimeout(() => st.drag = false, 60); } d = null; };
      const i = st.back && st.last ? STOPS.findIndex(s => s[0] === st.last) : 0;
      el._k = Math.max(0, i); el._step(el._k, true);
    },
    steps: el => {   /* 兩漢一次出樂府＋古詩 */

      if (cur >= order.length - 1) return false;
      el._k = order[cur + 1]; el._step(el._k); return true;
    },
    more: el => el._k !== STOPS.length });

  /* 播放：載入 YouTube 播放器 API，播 start～end；影片藏起來只出聲。2 秒後還沒在播（瀏覽器擋自動出聲）→ 露出小播放器請老師點 */

  const fmt = x => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');
  const show = () => { clearInterval(tick); tick = setInterval(() => { if (!pl || !pl.getCurrentTime) return; const c = pl.getCurrentTime(), st = pl.getPlayerState();
      tm.textContent = st === 1 ? '播放中 ' + fmt(Math.max(0, c - S.start)) + ' / ' + fmt(S.end - S.start) : '';

const WQ = ['天上的白雲真白啊', '真的，很白很白', '非常白', '非常非常十分白', '極其白', '賊白', '簡直白死了', '啊—'];

</div>`);

/* ───────── 總整理 ───────── */
const SUMS = [['sj', '先秦', '四言・入樂'], ['cc', '戰國～西漢初', '加「兮」・騷體'], ['yf', '兩漢起', '長短句・入樂'], ['gs', '兩漢～六朝', '五七言・不入樂'], ['jt', '唐', '絕句律詩・格律'], ['ci', '唐～宋', '詞牌・長短句・入樂'], ['qu', '元', '曲牌・襯字・入樂'], ['xs', '五四以來', '白話・分行']];
P('sum', 'sum', '總整理', `<div class="ph"><h2>總整理</h2><span class="k" style="background:var(--ink);color:rgb(var(--paper))">點卡片回專頁</span></div>
<div class="sum">${SUMS.map(([id, t, k]) => `<div class="card st" data-go="${id}" style="--c:${FORMS[id].c}">${th(id)}<h3>${NAME(id)}</h3><div>${t}<br><b>${k}</b></div></div>`).join('')}</div>
<div class="note st" style="font-size:.75em;margin-top:.5em">風格記憶語：<b>詩莊・詞媚・曲俗</b>（概括的風格提示，不是每首都如此）</div>`);

/* ───────── 挑戰：原 5 題＋總整理 8 張關鍵詞卡，洗牌出題 ───────── */
const QUIZ = [
  ['哪一種詩體以四言為主，並分風、雅、頌？', '《詩經》', ['《詩經》', '《楚辭》', '樂府詩', '詞'], '關鍵是「四言」和「風雅頌」。', '提示：〈關雎〉四字一拍。'],
  ['哪一種詩體可以入樂，句子長短不齊，多為民間作品？', '樂府詩', ['古詩', '樂府詩', '近體詩', '新詩'], '入樂、長短句、民間：樂府詩。', '提示：〈上邪〉、〈長干行〉都屬於它。'],
  ['哪一種詩體講究句數、字數、平仄、用韻與對仗？', '近體詩', ['樂府詩', '近體詩', '古詩', '曲'], '格律最嚴整的是唐代成熟的近體詩。', '提示：「先有格線再填字」。'],
  ['哪一種詩體依詞牌填寫，常見長短句？', '詞', ['古詩', '曲', '詞', '新詩'], '「詞牌」是詞的關鍵。', '提示：〈如夢令〉〈念奴嬌〉是什麼？'],
  ['哪一種詩體可以加入襯字，語言較口語化？', '曲', ['詞', '曲', '新詩', '《楚辭》'], '「襯字」是曲的特色。', '提示：依「曲牌」填寫的是哪一種？'],
];
const POOL = QUIZ.map(q => ({ t: q[0], a: q[1], o: q[2], ok: q[3], hint: q[4] }))
  .concat(SUMS.map(([id, t, k]) => ({ t: `「${k}」是哪一種詩體？`, a: NAME(id), o: IDS.map(NAME), ok: `${NAME(id)}：${t}，${k}。`, hint: `提示：時代是「${t}」。` })));
P('quiz', 'quiz', '挑戰', `<div class="ph"><h2>挑戰</h2><span class="k" id="gs"></span></div>
<div class="gm"><div class="q" id="gq"></div><div class="opts" id="go"></div><div class="fb" id="gf"></div><div class="dots" id="gd"></div>
  <div style="display:flex;gap:.4em;justify-content:center;font-size:.66em;margin-top:.3em"><button class="tool" id="gr">⟲ 重新洗牌</button><button class="tool" data-go="map">☰ 回長卷</button></div></div>`, {
  init: el => {
    let order, i, score, res, done;
    const start = () => { order = POOL.map((_, k) => k).sort(() => Math.random() - .5); i = 0; score = 0; res = []; draw(); };
    const draw = () => {
      const fin = i >= order.length, q = POOL[order[i]]; done = false;
      const box = $('#gq', el); box.textContent = fin ? `完成！第一次就答對 ${score}／${order.length} 題` : q.t; box.classList.remove('in2'); void box.offsetWidth; box.classList.add('in2');
      $('#go', el).innerHTML = fin ? '' : q.o.map(o => `<button>${o}</button>`).join('');
      $('#go', el).style.gridTemplateColumns = !fin && q.o.length === 4 ? 'repeat(2,1fr)' : '';
      $('#gf', el).textContent = ''; $('#gs', el).textContent = fin ? '完成' : `第 ${i + 1}／${order.length} 題`;
      $('#gd', el).innerHTML = order.map((_, k) => `<i class="${res[k] || ''}${k === i ? ' cur' : ''}"></i>`).join('');
      $$('#go button', el).forEach(b => b.onclick = e => {
        e.stopPropagation(); if (done) return;
        if (b.textContent === q.a) { b.classList.add('ok'); if (!res[i]) { res[i] = 'ok'; score++; } $('#gf', el).textContent = '✔ 答對！' + q.ok; done = true; }
        else { b.classList.add('no'); shake(b); res[i] = 'no'; $('#gf', el).textContent = '再想想。' + q.hint; }
        upd();
      });
      upd();
    };
    el._adv = () => { if (!done || i >= order.length) return false; i++; draw(); return true; };
    el._more = () => done && i < order.length;
    $('#gr', el).onclick = e => { e.stopPropagation(); start(); };
    start();
  },
  steps: el => el._adv(), more: el => el._more() });

/* ───────── 播放 ───────── */
const st = { i: 0, ans: false, bg: 0, last: null, back: false, drag: false };
const stage = $('#stage');
const CH = [['map', '長卷']].concat(IDS.map(id => [id, SEAL(id)]), [['sum', '整理'], ['quiz', '挑戰']]);
$('#nav').innerHTML = CH.map(([c, t]) => `<button data-ch="${c}">${t}</button>`).join('');
$$('#nav button').forEach(b => b.onclick = () => go(b.dataset.ch, b.dataset.ch === 'map'));
const night = () => document.body.classList.contains('night');
const bgUrl = name => `url("../img/ui/bg/${name}-${night() ? 'dark' : 'light'}.webp")`;
function setBg(name) {
  const url = bgUrl(name), a = $('#bgA'), b = $('#bgB'), cur = st.bg ? b : a, nxt = st.bg ? a : b;
  if (cur.style.backgroundImage === url) { cur.classList.add('on'); return; }
  nxt.style.backgroundImage = url; nxt.classList.add('on'); cur.classList.remove('on'); st.bg ^= 1;
}
const paintTh = () => $$('[data-th]', stage).forEach(x => x.style.backgroundImage = bgUrl(x.dataset.th));
/* 下一步＝文件順序裡第一個還沒出現的段落，或已出現段落裡第一個還藏著的重點（朱框字、要點的格子） */
const pending = () => $$('.st:not(.show), .bk:not(.on), .hid:not(.on)', stage).find(x => x.classList.contains('st') || !x.closest('.st:not(.show)'));
function reveal(x) {
  if (x._rev) { x._rev(); x.classList.add('on'); }
  else if (x.classList.contains('st')) { x.classList.add('show'); if (x.classList.contains('lb') && x.nextElementSibling) x.nextElementSibling.classList.add('show'); }
  else x.classList.add('on');
}
function revealAll() { const s = S[st.i]; let n = 0; while (s.steps && s.id !== 'quiz' && s.steps(stage) && n++ < 50); let p; n = 0; while ((p = pending()) && n++ < 300) reveal(p); }
function go(t, back) {
  const i = typeof t === 'number' ? t : S.findIndex(p => p.id === t);
  if (i < 0 || i >= S.length) return;
  const s = S[i]; if (FORMS[s.ch]) st.last = s.ch;
  st.i = i; st.back = !!back;
  document.body.classList.toggle('full', !!s.full); document.body.classList.toggle('cover', s.cls === 'cover');
  setBg(s.bg);
  stage.innerHTML = `<div class="in">${s.html}</div>`; stage.scrollTop = 0;
  s.init && s.init(stage);
  $$('[data-hide] b:not([class])', stage).forEach(b => b.classList.add('bk'));
  $$('.bk', stage).forEach(x => x.onclick = e => { e.stopPropagation(); x.classList.toggle('on'); upd(); });
  $$('[data-go]', stage).forEach(x => x.onclick = e => { e.stopPropagation(); if (!st.drag) go(x.dataset.go); });
  paintTh();
  if (!s.steps) { const f = pending(); if (f && f.classList.contains('st')) reveal(f); }   /* 開頁先出第一段；第一步若是要動手的（點兮、找襯字…）就不先出 */
  if (st.ans) revealAll();
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.ch === s.ch));
  const on = $('#nav button.on'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  $('#pg').textContent = (i + 1) + ' / ' + S.length; $('#bar').style.width = ((i + 1) / S.length * 100) + '%';
  $('#bPrev').disabled = i === 0;
  try { history.replaceState(null, '', '#' + s.id); } catch (e) {}
  upd();
}
function upd() {
  const s = S[st.i]; s.upd && s.upd(stage);
  $('#bNext').textContent = pending() || (s.more && s.more(stage)) ? '下一步 ▸' : (st.i < S.length - 1 ? '下一頁 →' : '完');
}
function next() {
  const s = S[st.i];
  if (s.steps && s.steps(stage)) { upd(); return; }
  const p = pending();
  if (p) { reveal(p); setTimeout(() => p.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 80); upd(); return; }
  if (st.i < S.length - 1) go(st.i + 1);
}
const prev = () => { if (st.i > 0) go(st.i - 1, true); };
$('#bNext').onclick = next; $('#bPrev').onclick = prev; $('#bLogo').onclick = () => go(0); $('#bReplay').onclick = () => go(st.i);
$('#bAns').onclick = e => { st.ans = !st.ans; e.currentTarget.classList.toggle('on', st.ans); if (st.ans) { revealAll(); upd(); } else go(st.i); };
$('#bNight').onclick = e => { const n = document.body.classList.toggle('night'); e.currentTarget.classList.toggle('on', n); setBg(S[st.i].bg); paintTh(); };
$('#bFull').onclick = () => { const d = document.documentElement; if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d); else document.exitFullscreen && document.exitFullscreen(); };
$('main').addEventListener('click', e => { if (st.drag || e.target.closest('button,a,.bk,.chip,.node,.hf,.card[data-go],.ci-line,.xs-stage,#ccv .ch')) return; next(); });
document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
  else if (k === 'Escape') go('map', true);
});
if (window.parent !== window) { const b = $('#bClose'); b.hidden = false; b.onclick = () => window.parent.postMessage({ lbClose: 1 }, '*'); $('#bFull').hidden = true; }
const h = location.hash.slice(1); go(S.some(p => p.id === h) ? h : 0);
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (S.some(p => p.id === h) && S[st.i].id !== h) go(h); });
</script>
